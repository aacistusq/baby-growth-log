<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Growth Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
  :root{
    /* Brand accents (used selectively, not as a wall-to-wall wash) */
    --lavender:#B79FD1;
    --lavender-deep:#8E6FB0;
    --blush:#F4B8C1;
    --butter:#F6D186;
    --mint:#8FCDBB;
    --mint-deep:#4F9E8B;
    --coral:#EC9384;
    --coral-deep:#D96F5D;

    /* Calm neutral canvas + surfaces */
    --canvas:#FAF9FB;
    --sky:#FAF9FB;
    --sky2:#FAF9FB;
    --card:#FFFFFF;
    --surface-muted:#F5F3F7;
    --line:#EBE7EE;

    /* Text hierarchy — tuned to meet WCAG AA (4.5:1 body text, 3:1 large/UI
       text) against both --canvas and --card, while keeping ink-tertiary
       visibly quieter than ink-soft so the hierarchy itself stays intact. */
    --ink:#332C3A;
    --ink-soft:#7B7383;
    --ink-tertiary:#918B98;

    /* Status system: icon + label + colour, never colour alone */
    --status-neutral-bg:#F1EFF4;
    --status-neutral-fg:#7B7383;
    --status-positive-bg:rgba(143,205,187,.28);
    --status-positive-fg:#377665;
    --status-attention-bg:rgba(246,209,134,.35);
    --status-attention-fg:#886823;
    --status-critical-bg:rgba(236,147,132,.28);
    --status-critical-fg:#A24E3F;

    /* Radius tiers */
    --radius-major:22px;
    --radius-standard:18px;
    --radius-control:14px;
    --radius-small:12px;
    --radius-pill:999px;

    /* Elevation */
    --shadow-1: 0 1px 2px rgba(51,44,58,0.05);
    --shadow-2: 0 4px 14px rgba(51,44,58,0.08), 0 1px 3px rgba(51,44,58,0.05);
    --shadow-3: 0 -8px 30px rgba(51,44,58,0.18);
    --shadow: var(--shadow-2);

    /* Spacing scale */
    --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
    --space-5:20px; --space-6:24px; --space-7:32px; --space-8:40px;

    /* Motion */
    --motion-fast:150ms;
    --motion-base:200ms;
    --motion-slow:250ms;
    --ease: cubic-bezier(.4,0,.2,1);
  }
  /* Dark mode — dark charcoal, not pure black; muted lavender; restrained contrast.
     Built for nighttime feeds, not just an inverted palette. */
  [data-theme="dark"]{
    --canvas:#1E1A22;
    --sky:#1E1A22;
    --sky2:#1E1A22;
    --card:#28232D;
    --surface-muted:#332C3A;
    --line:#3D3544;
    --ink:#EDE8F0;
    --ink-soft:#B0A6BC;
    --ink-tertiary:#83788F;
    --lavender:#9B82B8;
    --lavender-deep:#C3AADD;
    --status-neutral-bg:#332C3A;
    --status-neutral-fg:#B0A6BC;
    --status-positive-bg:rgba(143,205,187,.16);
    --status-positive-fg:#82C7B1;
    --status-attention-bg:rgba(246,209,134,.16);
    --status-attention-fg:#E0BB6E;
    --status-critical-bg:rgba(236,147,132,.18);
    --status-critical-fg:#E39184;
    --shadow-1: 0 1px 2px rgba(0,0,0,0.35);
    --shadow-2: 0 4px 14px rgba(0,0,0,0.4), 0 1px 3px rgba(0,0,0,0.3);
    --shadow-3: 0 -8px 30px rgba(0,0,0,0.5);
    --shadow: var(--shadow-2);
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
  }
  @keyframes ptFadeIn{ from{ opacity:0; } to{ opacity:1; } }
  .pt-new{ animation: ptFadeIn var(--motion-slow) var(--ease); }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:linear-gradient(180deg, var(--sky) 0%, var(--sky2) 100%);
    color:var(--ink);
    font-family:'Nunito',sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
    transition:background-color var(--motion-base) var(--ease), color var(--motion-base) var(--ease);
  }
  body, .card, .surface-muted, .stat, header.top, nav.bottom, .sheet, input, select, textarea{
    transition:background-color var(--motion-base) var(--ease), border-color var(--motion-base) var(--ease), color var(--motion-base) var(--ease);
  }
  #app{
    max-width:480px;
    margin:0 auto;
    position:relative;
  }
  header.top{
    position:fixed; top:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:480px; box-sizing:border-box;
    padding:calc(16px + env(safe-area-inset-top)) 20px 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--canvas);
    z-index:20;
  }
  header.top .brand{
    font-family:'Baloo 2',cursive;
    font-weight:700;
    font-size:18px;
    color:var(--ink);
    display:flex;
    align-items:center;
    gap:6px;
  }
  header.top .age{
    font-family:'IBM Plex Mono',monospace;
    font-variant-numeric: tabular-nums;
    font-size:11.5px;
    color:var(--ink-soft);
    background:var(--surface-muted);
    padding:5px 10px;
    border-radius:var(--radius-pill);
  }
  main{
    padding:calc(74px + env(safe-area-inset-top)) 18px calc(150px + env(safe-area-inset-bottom));
  }
  .hero{ margin:8px 0 16px; }
  .hero h1{
    font-family:'Baloo 2',cursive;
    font-size:26px;
    font-weight:700;
    margin:0 0 3px;
    line-height:1.15;
    color:var(--ink);
  }
  .hero p{ margin:0; color:var(--ink-soft); font-size:13.5px; }
  .card{
    background:var(--card);
    border-radius:var(--radius-major);
    padding:18px 18px 20px;
    margin-bottom:14px;
    box-shadow:var(--shadow-2);
  }
  .card h2{
    font-family:'Nunito',sans-serif;
    font-size:15.5px;
    font-weight:800;
    margin:0 0 12px;
    color:var(--ink);
    display:flex;
    align-items:center;
    gap:7px;
  }
  .section-header{
    display:flex; align-items:center; justify-content:space-between;
    margin:22px 2px 8px; font-family:'Nunito',sans-serif; font-size:13.5px; font-weight:800; color:var(--ink);
  }
  .section-header:first-child{ margin-top:2px; }
  .section-header .link{ font-size:12px; font-weight:700; color:var(--lavender-deep); cursor:pointer; }
  .surface-group{
    background:var(--surface-muted); border-radius:var(--radius-standard); padding:4px 14px; margin-bottom:14px;
  }
  .stat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .stat{
    background:var(--surface-muted);
    border-radius:var(--radius-control);
    padding:12px 8px;
    text-align:center;
  }
  .stat .val{ font-family:'IBM Plex Mono',monospace; font-variant-numeric: tabular-nums; font-size:18px; font-weight:500; color:var(--ink); display:block; }
  .stat .lbl{ font-size:10.5px; color:var(--ink-soft); font-weight:600; display:block; margin-top:3px; }
  .stat .pct{ font-size:9.5px; color:var(--ink-soft); display:block; margin-top:3px; }
  .empty{
    color:var(--ink-soft); font-size:13px; text-align:center; padding:20px 10px;
    background:var(--surface-muted); border-radius:var(--radius-control);
  }
  .row-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:11px 2px; border-bottom:1px solid var(--line); font-size:13.5px;
  }
  .row-item:last-child{ border-bottom:none; }
  .row-item .main{ font-weight:700; }
  .row-item .sub{ color:var(--ink-soft); font-size:11.5px; }
  .row-item button.del{ background:none; border:none; color:var(--ink-tertiary); font-size:12px; cursor:pointer; padding:4px 6px; font-weight:700; }
  label{
    display:block; font-size:13px; font-weight:700;
    color:var(--ink); margin:14px 0 6px;
  }
  label:first-child{ margin-top:0; }
  input,select,textarea{
    width:100%; padding:12px 14px; border:1.5px solid var(--line); border-radius:var(--radius-control);
    background:var(--surface-muted); font-family:'Nunito',sans-serif; font-size:15px; color:var(--ink);
  }
  input:focus,select:focus,textarea:focus{ outline:none; border-color:var(--lavender); }
  button:focus-visible, a:focus-visible, [role="button"]:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
    outline:2px solid var(--lavender-deep); outline-offset:2px;
  }
  input::placeholder,textarea::placeholder{ color:var(--ink-tertiary); opacity:1; }
  button:disabled{ opacity:0.55; cursor:default; }
  .seg{ display:flex; gap:8px; }
  .seg button{
    flex:1; padding:11px 6px; border:2px solid var(--line); border-radius:14px;
    background:var(--sky); font-family:'Nunito',sans-serif; font-weight:700; font-size:13px;
    color:var(--ink-soft); cursor:pointer;
  }
  .seg button.active{ background:var(--lavender); border-color:var(--lavender); color:#fff; }
  [data-theme="dark"] .seg button.active{ background:var(--lavender-deep); border-color:var(--lavender-deep); color:#1E1A22; }
  .btn{
    width:100%; padding:14px; border-radius:16px; border:none;
    background:var(--lavender-deep); color:#fff; font-family:'Baloo 2',cursive; font-size:16px;
    font-weight:600; cursor:pointer; margin-top:18px; box-shadow:0 4px 14px rgba(142,111,176,.35);
  }
  .btn:active{ transform:scale(0.98); }
  .btn.secondary{ background:var(--mint-deep); box-shadow:0 4px 14px rgba(79,158,139,.3); }
  .btn.ghost{ background:transparent; color:var(--lavender-deep); border:2px dashed var(--lavender); box-shadow:none; }
  nav.bottom{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:480px; box-sizing:border-box;
    display:flex; background:var(--card);
    border-radius:var(--radius-standard) var(--radius-standard) 0 0; box-shadow:var(--shadow-3);
    padding:6px 4px calc(4px + env(safe-area-inset-bottom)); z-index:20;
  }
  nav.bottom button{
    flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center;
    gap:2px; padding:6px 1px 4px; color:var(--ink-tertiary); cursor:pointer; font-family:'Nunito',sans-serif;
    font-weight:600; font-size:9.5px; transition:color var(--motion-fast) var(--ease);
    min-height:44px;
  }
  nav.bottom button svg{ width:19px; height:19px; opacity:.75; transition:opacity var(--motion-fast) var(--ease); }
  nav.bottom button.active{ color:var(--lavender-deep); font-weight:800; }
  nav.bottom button.active svg{ stroke:var(--lavender-deep); opacity:1; }
  .fab{
    position:fixed; right:max(16px, calc(50% - 224px)); bottom:calc(78px + env(safe-area-inset-bottom));
    height:48px; padding:0 18px 0 14px; border-radius:var(--radius-pill);
    background:var(--lavender-deep); color:#fff;
    border:none; box-shadow:0 4px 14px rgba(0,0,0,.28); cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:6px;
    font-family:'Nunito',sans-serif; font-weight:800; font-size:14px;
    transition:transform var(--motion-fast) var(--ease), opacity var(--motion-base) var(--ease);
    z-index:25;
  }
  .fab.fab-hidden{ opacity:0; transform:translateY(16px); pointer-events:none; }
  [data-theme="dark"] .fab{ color:#1E1A22; }
  [data-theme="dark"] .fab svg{ stroke:#1E1A22; }
  .fab:active{ transform:scale(0.95); }
  .fab svg{ width:20px; height:20px; stroke:#fff; stroke-width:2.3; }
  /* Segmented control (Weight | Length | Head) */
  .segctl{
    display:flex; background:var(--surface-muted); border-radius:var(--radius-control);
    padding:3px; margin-bottom:14px; position:relative;
  }
  .segctl button{
    flex:1; position:relative; z-index:1; padding:9px 6px; border:none; border-radius:11px;
    background:transparent; font-family:'Nunito',sans-serif; font-weight:700; font-size:13px;
    color:var(--ink-soft); cursor:pointer;
    transition:color var(--motion-base) var(--ease), background-color var(--motion-base) var(--ease), font-weight var(--motion-fast) var(--ease);
    min-height:38px;
  }
  .segctl button.active{ background:var(--card); color:var(--ink); font-weight:800; box-shadow:var(--shadow-1); }
  [data-theme="dark"] .segctl button.active{ background:var(--lavender-deep); color:#1E1A22; }
  /* Growth chart tooltip card */
  .chart-tooltip{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius-control);
    padding:12px 14px; margin-top:8px; box-shadow:var(--shadow-1);
    animation:ptFadeIn var(--motion-base) var(--ease);
  }
  /* Clean stat row with divider */
  .stat-row{ display:flex; align-items:center; margin-top:14px; }
  .stat-cell{ flex:1; text-align:center; }
  .stat-val{ font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; font-size:17px; font-weight:600; color:var(--ink); }
  .stat-lbl{ font-size:11px; font-weight:600; color:var(--ink-soft); margin-top:2px; }
  .stat-div{ width:1px; height:32px; background:var(--line); }
  /* Mobile disclosure row */
  .disclosure-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:13px 2px; margin-top:8px; border-top:1px solid var(--line); border-bottom:1px solid var(--line);
    font-size:13.5px; font-weight:700; color:var(--ink); cursor:pointer; user-select:none;
  }
  .disclosure-row:active{ background:var(--surface-muted); }
  .tabs{ display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .tabs button{
    padding:8px 14px; border-radius:var(--radius-pill); border:1.5px solid var(--line); background:var(--card);
    font-size:12.5px; font-weight:700; color:var(--ink-soft); cursor:pointer;
  }
  .tabs button.active{ background:var(--ink); color:#fff; border-color:var(--ink); }
  [data-theme="dark"] .tabs button.active{ background:var(--lavender-deep); color:#1E1A22; border-color:var(--lavender-deep); }
  .legend{ display:flex; gap:12px; flex-wrap:wrap; margin-top:10px; font-size:10.5px; color:var(--ink-soft); }
  .legend span{ display:inline-flex; align-items:center; gap:5px; }
  .legend i{ width:9px; height:9px; border-radius:50%; display:inline-block; }
  .onboard{ display:flex; flex-direction:column; justify-content:center; min-height:100vh; padding:32px 26px; }
  .onboard .mark{ font-size:34px; margin-bottom:6px; }
  .onboard h1{ font-family:'Baloo 2',cursive; font-size:30px; font-weight:700; line-height:1.15; margin:0 0 8px; color:var(--ink); }
  .onboard p.sub{ color:var(--ink-soft); font-size:14px; margin:0 0 26px; }
  .toast{
    position:fixed; bottom:96px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; padding:10px 18px; border-radius:var(--radius-pill); font-size:13px;
    font-weight:700; opacity:0; transition:opacity var(--motion-base) var(--ease), transform var(--motion-base) var(--ease); pointer-events:none;
    max-width:90%; text-align:center; z-index:60;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .fieldrow{ display:flex; gap:10px; }
  .fieldrow > div{ flex:1; }
  .note{ font-size:11px; color:var(--ink-soft); margin-top:8px; line-height:1.55; }
  .badge{
    display:inline-block; padding:3px 10px; border-radius:var(--radius-pill); font-size:11.5px; font-weight:800;
  }
  .badge.good{ background:var(--status-positive-bg); color:var(--status-positive-fg); }
  .badge.watch{ background:var(--status-attention-bg); color:var(--status-attention-fg); }
  .badge.flag{ background:var(--status-critical-bg); color:var(--status-critical-fg); }
  .badge.neutral{ background:var(--status-neutral-bg); color:var(--ink-soft); }
  .narrative{
    background:var(--surface-muted); border-radius:var(--radius-control); padding:14px 16px; margin-top:12px; font-size:13.5px; line-height:1.55;
  }
  .narrative .head{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .chip{
    display:inline-flex; align-items:center; gap:4px; padding:4px 10px; border-radius:var(--radius-pill); font-size:10.5px; font-weight:800;
  }
  .chip.due{ background:var(--status-attention-bg); color:var(--status-attention-fg); }
  .chip.given{ background:var(--status-positive-bg); color:var(--status-positive-fg); }
  .chip.overdue{ background:var(--status-critical-bg); color:var(--status-critical-fg); }
  .divider-cute{ text-align:center; color:var(--lavender); font-size:12px; letter-spacing:.3em; margin:6px 0 14px; }
  .quickrow{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .quickbtn{
    background:var(--surface-muted); border:1.5px solid var(--line); border-radius:var(--radius-control); padding:14px 4px;
    font-family:'Nunito',sans-serif; font-weight:800; font-size:11.5px; color:var(--ink);
    text-align:center; cursor:pointer; line-height:1.6;
  }
  .quickbtn:active{ background:var(--lavender); border-color:var(--lavender); color:#fff; }
  .quickbtn .ico{ font-size:20px; display:block; }
  .today-row{ display:flex; justify-content:space-between; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--line); gap:10px; }
  .today-row:last-child{ border-bottom:none; }
  .today-row .lbl2{ font-weight:700; font-size:12.5px; white-space:nowrap; color:var(--ink-soft); }
  .today-row .val2{ color:var(--ink); font-weight:600; font-size:12.5px; text-align:right; }

  /* ---- Quick Log bottom sheet ---- */
  .sheet-overlay{
    position:fixed; inset:0; background:rgba(30,22,36,0.4); z-index:70;
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity var(--motion-base) var(--ease);
  }
  .sheet-overlay.open{ opacity:1; pointer-events:auto; }
  .sheet{
    background:var(--card); width:100%; max-width:480px; border-radius:24px 24px 0 0;
    padding:10px 20px calc(22px + env(safe-area-inset-bottom));
    box-shadow:var(--shadow-3); transform:translateY(100%);
    transition:transform var(--motion-base) var(--ease);
    max-height:85vh; overflow-y:auto;
  }
  .sheet-overlay.open .sheet{ transform:translateY(0); }
  .sheet-handle{ width:36px; height:4px; background:var(--line); border-radius:4px; margin:6px auto 16px; }
  .sheet-title{ font-family:'Baloo 2',cursive; font-size:20px; font-weight:700; color:var(--ink); margin-bottom:14px; display:flex; align-items:center; gap:10px; }
  .sheet-title button.back{ background:none; border:none; color:var(--ink-soft); cursor:pointer; padding:2px; display:flex; }
  .ql-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:2px; margin-bottom:6px; }
  .ql-item{
    display:flex; flex-direction:column; align-items:center; gap:7px; background:none; border:none;
    padding:14px 2px; border-radius:var(--radius-control); color:var(--ink); font-family:'Nunito',sans-serif;
    font-weight:700; font-size:11px; cursor:pointer;
  }
  .ql-item:active{ background:var(--surface-muted); }
  .ql-item svg{ stroke:var(--lavender-deep); width:22px; height:22px; }
  .ql-item-active{ background:var(--status-positive-bg); border-radius:var(--radius-control); }
  .ql-item-active span{ color:var(--status-positive-fg); font-weight:800; }
  .ql-more{ width:100%; text-align:center; background:none; border:none; color:var(--ink-soft); font-weight:700; font-size:12.5px; padding:12px; cursor:pointer; }
  .ql-choice-row{ display:flex; gap:10px; margin:6px 0 4px; }
  .ql-choice{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:8px;
    background:var(--surface-muted); border:1.5px solid var(--line); border-radius:var(--radius-standard);
    padding:20px 6px; cursor:pointer; font-family:'Nunito',sans-serif; font-weight:800; font-size:13px; color:var(--ink);
  }
  .ql-choice:active{ background:var(--lavender); border-color:var(--lavender); color:#fff; }
  .ql-choice svg{ stroke:var(--lavender-deep); width:24px; height:24px; }
  .ql-choice:active svg{ stroke:#fff; }
  .ql-nowrow{ display:flex; align-items:center; justify-content:space-between; background:var(--surface-muted); border-radius:var(--radius-control); padding:11px 14px; margin:12px 0; font-size:13.5px; font-weight:700; }
  .ql-nowrow button{ background:none; border:none; color:var(--lavender-deep); font-weight:800; font-size:12.5px; cursor:pointer; padding:0; }
  .ql-link{ background:none; border:none; color:var(--ink-soft); font-weight:700; font-size:12.5px; cursor:pointer; padding:8px 0; text-decoration:underline; }
  .hero-metric{ font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; font-size:38px; font-weight:500; color:var(--ink); line-height:1; }
  .secondary-metric{ font-size:14px; font-weight:700; color:var(--lavender-deep); margin-top:4px; }
  .support-text{ font-size:12.5px; color:var(--ink-soft); margin-top:8px; line-height:1.6; }

let lastSnapshotJSON = null;
let suppressNextSnapshot = false;
/* A random per-session id plus a monotonic local counter, embedded in every
   write. This lets the sync listener tell "a stale echo of a write I've
   since superseded" (e.g. a delete's confirmation arriving after I already
   undid it) apart from "a genuinely newer change from the other parent's
   device" — the root cause of Undo silently getting reverted by its own
   delete's late-arriving echo. */
const deviceId = uid();
let localWriteSeq = 0;
async function saveKey(key, value){

    localWriteSeq++;

    const payload = buildPayload();
    payload._writeSeq = mySeq;
    payload._writeDevice = deviceId;
    lastSnapshotJSON = JSON.stringify(payload);
    suppressNextSnapshot = true;
    await firestorePatch(payload);
  }catch(e){ console.error('save failed', key, e); toast('Sync error — check your connection'); }
}
function applyRemote(remote){

/* Realtime sync: replaces the old 6-second polling. The other phone's changes
   land within moments, and unchanged state costs nothing. */
let dataLoadError = null;
let lastLoadDiagnostic = null;
let weekMetric = 'sleep';
let weekActiveIdx = null;
let weekOffset = 0;
function startRealtimeSync(){
  stopRealtimeSync();
  unsubscribeSnapshot = familyDocRef().onSnapshot(snap=>{
    const wasInitial = !initialDataLoaded;
    initialDataLoaded = true;
    dataLoadError = null;
    if(suppressNextSnapshot && snap.metadata.hasPendingWrites===false){
      suppressNextSnapshot = false;
    }
    if(snap.metadata.hasPendingWrites) return; // our own local write echo
    const data = snap.exists ? snap.data() : null;
    const remote = (data && data.json) ? JSON.parse(data.json) : null;
    if(!remote){
      lastLoadDiagnostic = {
        signedInAs: authUser ? authUser.email : '(unknown)',
        uid: authUser ? authUser.uid : '(unknown)',
        projectId: firebaseConfig.projectId,
        docPath: 'appdata/family',
        docExists: snap.exists,
        fromCache: snap.metadata.fromCache,
        rawFieldKeys: data ? Object.keys(data) : null
      };
      console.log('[sync] no family data found — diagnostic:', lastLoadDiagnostic);
      if(wasInitial) render();
      return;
    }
    /* Ignore a snapshot that reflects one of OUR OWN writes we've since
       superseded locally (e.g. a delete's confirmation arriving after Undo
       already sent a newer write) — our local state is already ahead of it,
       so applying it would silently revert the newer action. Genuinely new
       changes from the other parent's device always carry a different
       deviceId and are never affected by this check. */
    if(remote && remote._writeDevice===deviceId && typeof remote._writeSeq==='number' && remote._writeSeq < localWriteSeq){
      return;
    }
    const remoteJSON = JSON.stringify(remote);
    if(remoteJSON !== lastSnapshotJSON){
      lastSnapshotJSON = remoteJSON;
      applyRemote(remote);
      if(state.prefs && state.prefs.lastFeedType) currentFeedSubtype = state.prefs.lastFeedType;
      if(state.prefs && state.prefs.lastTempMethod) currentTempMethod = state.prefs.lastTempMethod;
      if(state.prefs && state.prefs.lastHealthCat) currentHealthCat = state.prefs.lastHealthCat;
      applyTheme();
      if(wasInitial) render(); else safeRerender();
    } else if(wasInitial){
      render();
    }
  }, err=>{
    console.error('snapshot error', err);
    initialDataLoaded = true;
    dataLoadError = (err && err.code==='permission-denied') ? 'permission' : 'other';
    render();
  });
}
function stopRealtimeSync(){
  if(unsubscribeSnapshot){ unsubscribeSnapshot(); unsubscribeSnapshot = null; }
}

  if(code.includes('user-not-found') || code.includes('wrong-password') || code.includes('invalid-credential') || code.includes('invalid-login-credentials')) return 'Email or password is incorrect.';

}

let navStack = [];

function snapshotNavState(){

    timelineFilter, weekMetric, weekActiveIdx, weekOffset, rhythmDateKey,
    recapYearMonth, currentPhotoBookId, scrollY: window.scrollY

function restoreNavState(snap){
  currentView = snap.view; careSubView = snap.careSubView; healthSubView = snap.healthSubView;
  currentGrowthTab = snap.growthTab; timelineFilter = snap.timelineFilter;
  weekMetric = snap.weekMetric; weekActiveIdx = snap.weekActiveIdx; weekOffset = snap.weekOffset;

/* Navigate to a secondary/drill-down screen, remembering exactly where we
   came from. `opts` may set any of the same fields snapshotNavState reads. */
function navigateTo(view, opts){
  opts = opts || {};
  navStack.push(snapshotNavState());
  currentView = view;
  if(opts.careSubView!==undefined) careSubView = opts.careSubView;
  if(opts.healthSubView!==undefined) healthSubView = opts.healthSubView;
  if(opts.rhythmDateKey!==undefined) rhythmDateKey = opts.rhythmDateKey;
  if(opts.timelineFilter!==undefined) timelineFilter = opts.timelineFilter;
  if(opts.weekMetric!==undefined) weekMetric = opts.weekMetric;
  history.pushState({navDepth: navStack.length}, '', '#'+view);
  render();
}
/* Root tabs (bottom nav) are independent stacks, not a linear history —
   switching between them clears the back-stack rather than growing it. */
function switchRootView(view){
  navStack = [];
  currentView = view; careSubView = null; healthSubView = null;
  history.pushState({navDepth:0}, '', '#'+view);
  render();
}
function goBack(){
  if(navStack.length){
    const snap = navStack.pop();
    restoreNavState(snap);
    render();
    requestAnimationFrame(()=> window.scrollTo(0, snap.scrollY||0));
  } else {
    currentView = VIEW_PARENT[currentView] || 'home';
    careSubView = null; healthSubView = null;
    render();
  }
}

   whose popstate handler calls goBack(), so there is exactly one code path
   for "go back" rather than two that could drift out of sync. */
function handleBackTap(){

function sydDateParts(dateInput){

  const get = t => parts.find(p=>p.type===t).value;
  return { year:get('year'), month:get('month'), day:get('day'), hour:get('hour'), minute:get('minute') };
}

let sleepTickInterval = null;
function startSleepTicker(){
  stopSleepTicker();

    if(!state.activeSleep){ stopSleepTicker(); return; }
    const mins = Math.floor((Date.now()-new Date(state.activeSleep.startAt).getTime())/60000);
    document.querySelectorAll('.sleep-elapsed-live').forEach(el=>{ el.textContent = fmtDuration(mins); });
  }, 20000);

let fastTickInterval = null;
function fmtMMSS(totalSec){ totalSec=Math.max(0,Math.floor(totalSec)); const m=Math.floor(totalSec/60), s=totalSec%60; return `${m}:${String(s).padStart(2,'0')}`; }
/* Both tummy time and breastfeeding use a "segments" array — each segment is
   {start, end|null}; a null end means that segment is currently running
   (i.e. not paused / not switched away from). Elapsed time is always summed
   from these real timestamps, never from a JS counter, so it survives
   refresh, backgrounding, and another device loading the same session. */
function segmentsElapsedSec(segments){
  return segments.reduce((sum,seg)=> sum + (((seg.end?new Date(seg.end):new Date()) - new Date(seg.start))/1000), 0);
}
function startFastTicker(){
  stopFastTicker();
  fastTickInterval = setInterval(()=>{
    if(state.activeTummyTime){
      const sec = segmentsElapsedSec(state.activeTummyTime.segments);
      document.querySelectorAll('.tummy-elapsed-live').forEach(el=> el.textContent = fmtMMSS(sec));
    }
    if(state.activeBreastfeed){
      const segs = state.activeBreastfeed.segments;
      const cur = segs[segs.length-1];
      const curSec = ((cur.end?new Date(cur.end):new Date()) - new Date(cur.start))/1000;
      document.querySelectorAll('.breastfeed-elapsed-live').forEach(el=> el.textContent = fmtMMSS(curSec));
      const totalMin = segmentsElapsedSec(segs)/60;
      document.querySelectorAll('.breastfeed-total-live').forEach(el=> el.textContent = fmtDuration(totalMin));
    }
    if(!state.activeTummyTime && !state.activeBreastfeed) stopFastTicker();
  }, 1000);
}
function stopFastTicker(){ if(fastTickInterval){ clearInterval(fastTickInterval); fastTickInterval=null; } }

function timeAgo(dateISO){
  const diffMs = Date.now() - new Date(dateISO).getTime();
  const mins = Math.round(diffMs/60000);
  if(mins<1) return 'just now';
  if(mins<60) return `${mins}m ago`;
  const hrs = Math.floor(mins/60), remM = mins%60;
  if(hrs<24) return `${hrs}h ${remM}m ago`;
  const days = Math.floor(hrs/24);
  return `${days}d ago`;
}
/* Normalizes both legacy feed records ({method:'breast'|'bottle', side, mins, ml})
   and new-format records ({type:'breastfeeding'|'expressed'|'formula'|'pumping', ...})
   into one consistent shape so nothing already logged breaks. */
function normalizeFeed(f){
  if(f.type) return f;
  if(f.method==='breast'){
    const mins = Number(f.mins||0);
    let leftMins=0, rightMins=0;
    if(f.side==='Left') leftMins=mins;
    else if(f.side==='Right') rightMins=mins;
    else { leftMins=mins/2; rightMins=mins/2; }
    return {...f, type:'breastfeeding', leftMins, rightMins, totalMins:mins};
  }
  return {...f, type:'formula', offeredMl:Number(f.ml||0), consumedMl:Number(f.ml||0)};
}
function feedSummaryLine(f){
  const nf = normalizeFeed(f);
  if(nf.type==='breastfeeding'){
    const parts=[];
    if(nf.leftMins) parts.push(`L ${Math.round(nf.leftMins)}m`);
    if(nf.rightMins) parts.push(`R ${Math.round(nf.rightMins)}m`);
    const total = nf.totalMins!=null ? nf.totalMins : (nf.leftMins||0)+(nf.rightMins||0);
    return `🍼 Breastfeed · ${parts.join(' + ')||'—'} · ${Math.round(total)}m total`;
  }
  if(nf.type==='expressed') return `🍼 Expressed milk · ${nf.consumedMl}mL`;
  if(nf.type==='formula') return `🍼 Formula · ${nf.consumedMl}mL`;
  if(nf.type==='pumping') return `🔄 Pumping · ${nf.pumpTotalMl}mL (L${nf.pumpLeftMl||0}/R${nf.pumpRightMl||0})`;
  return '🍼 Feed';
}

function ageParts(birthISO){
  const birth = new Date(birthISO); const now = new Date();
  let ms = now-birth; if(ms<0) ms=0;
  const days = Math.floor(ms/86400000);
  const weeks = Math.floor(days/7); const remDays = days%7;
  const months = (now.getFullYear()-birth.getFullYear())*12 + (now.getMonth()-birth.getMonth()) - (now.getDate()<birth.getDate()?1:0);
  return {days, weeks, remDays, months: Math.max(0,months)};
}
function ageLabelShort(birthISO){
  const a = ageParts(birthISO);
  if(a.weeks < 12) return `${a.weeks}w ${a.remDays}d`;
  return `${a.months} mo`;
}
function ageMonthsDecimal(birthISO, atISO){
  const birth = new Date(birthISO); const at = new Date(atISO||Date.now());
  return Math.max(0,(at-birth)/(1000*60*60*24*30.4375));
}
/* Adds a (possibly fractional) number of months to a date using real calendar
   month lengths rather than a fixed 30-day approximation. */
function addMonthsPrecise(dateISO, months){
  const d = new Date(dateISO);
  const whole = Math.floor(months);
  const frac = months - whole;
  const result = new Date(d);
  result.setMonth(result.getMonth()+whole);
  if(frac>0){
    const daysInMonth = new Date(result.getFullYear(), result.getMonth()+1, 0).getDate();
    result.setDate(result.getDate() + Math.round(frac*daysInMonth));
  }
  return result;
}
function ordinalSuffix(n){
  const s=['th','st','nd','rd'], v=n%100;
  return n+(s[(v-20)%10]||s[v]||s[0]);
}
/* Corrected age support for babies born preterm (<37 weeks gestation). */
function isPreterm(){
  const g = state.profile && state.profile.gestWeeks;
  return typeof g==='number' && g>0 && g<37;
}
function correctedAgeInfo(){
  if(!isPreterm()) return null;
  const gestWeeks = state.profile.gestWeeks + (state.profile.gestDays||0)/7;
  const prematurityWeeks = 40 - gestWeeks;
  if(prematurityWeeks<=0) return null;
  const correctedRefDate = new Date(new Date(state.profile.birthDate).getTime() + prematurityWeeks*7*86400000);
  const now = new Date();
  if(correctedRefDate > now){
    return { notYetTermEquivalent:true, dueDate: correctedRefDate };
  }
  const a = ageParts(correctedRefDate.toISOString());
  return { label: a.weeks<12 ? `${a.weeks}w ${a.remDays}d` : `${a.months} mo`, notYetTermEquivalent:false };
}
/* ---------------- Vaccine status ---------------- */
function vaccineStatus(v){
  if(v.notApplicable) return 'na';
  if(v.givenDate) return 'given';
  if(!state.profile) return 'upcoming';
  const due = addMonthsPrecise(state.profile.birthDate, v.dueMonths);
  const daysDiff = (due - new Date())/86400000;
  return daysDiff > 14 ? 'upcoming' : 'due';
}
function vaccineDueDate(v){
  return state.profile ? addMonthsPrecise(state.profile.birthDate, v.dueMonths) : null;
}

function toast(msg){
  const t = document.getElementById('toast'); if(!t) return;
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
}
function showUndoToast(msg, restoreFn){
  const t = document.getElementById('toast'); if(!t) return;
  t.innerHTML = `${escapeHtml(msg)} <button class="undo" id="undoBtn">Undo</button>`;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  const btn = document.getElementById('undoBtn');
  if(btn) btn.addEventListener('click', async ()=>{ t.classList.remove('show'); await restoreFn(); });
  window._toastTimer = setTimeout(()=>t.classList.remove('show'), 9000);
}

/* ---------------- Percentile logic ---------------- */
function bandIndex(type, ageMonths, value){
  const table = WHO_GIRLS[type];
  const idx = Math.min(24, Math.max(0, Math.round(ageMonths)));
  const row = table[idx];
  if(value < row[0]) return 0;
  if(value < row[1]) return 1;
  if(value < row[2]) return 2;
  if(value < row[3]) return 3;
  if(value < row[4]) return 4;
  return 5;
}
const BAND_LABELS = ['below 3rd','3rd–15th','15th–50th','50th–85th','85th–97th','above 97th'];
const TYPE_TO_TABLE = {weight:'weight_kg', length:'length_cm', hc:'hc_cm'};

/* ---------------- Continuous percentile interpolation (for growth projection) ---------------- */
const PCT_X = [3,15,50,85,97];
function interpolateRow(tableKey, ageMonths){
  const table = WHO_GIRLS[tableKey];
  const clamped = Math.max(0, Math.min(24, ageMonths));
  const lo = Math.floor(clamped), hi = Math.min(24, Math.ceil(clamped));
  if(lo===hi) return table[lo];
  const frac = clamped - lo;
  return table[lo].map((v,i)=> v + frac*(table[hi][i]-v));
}
function percentileScore(row, value){
  if(value <= row[0]){
    const rate = (row[1]-row[0]) / (PCT_X[1]-PCT_X[0]);
    return PCT_X[0] - (row[0]-value)/rate;
  }
  for(let i=0;i<4;i++){
    if(value>=row[i] && value<=row[i+1]){
      const frac = (value-row[i])/(row[i+1]-row[i]);
      return PCT_X[i] + frac*(PCT_X[i+1]-PCT_X[i]);
    }
  }
  const rate = (row[4]-row[3]) / (PCT_X[4]-PCT_X[3]);
  return PCT_X[4] + (value-row[4])/rate;
}
function valueAtScore(row, score){
  if(score<=PCT_X[0]){
    const rate = (row[1]-row[0]) / (PCT_X[1]-PCT_X[0]);
    return row[0] - (PCT_X[0]-score)*rate;
  }
  for(let i=0;i<4;i++){
    if(score>=PCT_X[i] && score<=PCT_X[i+1]){
      const frac = (score-PCT_X[i])/(PCT_X[i+1]-PCT_X[i]);
      return row[i] + frac*(row[i+1]-row[i]);
    }
  }
  const rate = (row[4]-row[3]) / (PCT_X[4]-PCT_X[3]);
  return row[4] + (score-PCT_X[4])*rate;
}
/* Recent growth rate for a measurement type: prefers a genuine recent window
   (last ~14 days) so the rate reflects her CURRENT pace, not a since-birth
   average that gets less representative as she gets older. Falls back
   gracefully when only sparse data exists. */
function recentGrowthRate(type){
  const list = state.measurements.filter(m=>m.type===type).sort((a,b)=>new Date(a.date)-new Date(b.date));
  if(list.length<2) return null;
  const latest = list[list.length-1];
  const latestTime = new Date(latest.date).getTime();
  const preferredWindowDays = 14;
  let windowStart = list.slice(0,-1).filter(m=> (latestTime-new Date(m.date).getTime()) <= preferredWindowDays*86400000)
    .sort((a,b)=>new Date(a.date)-new Date(b.date))[0];
  let basis;
  if(windowStart){
    basis = `over the latest ${preferredWindowDays}-day measurement period`;
  } else {
    windowStart = list[list.length-2];
    basis = list.length===2 ? 'since birth' : `over her last ${Math.round((latestTime-new Date(windowStart.date).getTime())/86400000)} days of measurements`;
  }
  const days = Math.max(1, (latestTime-new Date(windowStart.date).getTime())/86400000);
  const perDay = (latest.value-windowStart.value)*1000/days;
  return { perDay, basis, windowStart, latest, isEarlyEstimate: list.length===2 };
}
/* Projects her next weekly weigh-in from her own recent growth pace — an
   extrapolation, not a target she needs to hit. */
function projectNextWeighIn(){
  const list = state.measurements.filter(m=>m.type==='weight').sort((a,b)=>new Date(a.date)-new Date(b.date));
  if(!list.length) return null;
  const latest = list[list.length-1];
  const nextDate = new Date(new Date(latest.date).getTime() + 7*86400000);
  const daysUntil = Math.round((nextDate - new Date()) / 86400000);
  const rate = recentGrowthRate('weight');
  if(!rate) return { lastDate: latest.date, lastValue: latest.value, nextDate, daysUntil, insufficient:true };
  const daysToNext = (nextDate-new Date(latest.date))/86400000;
  const projectedVal = latest.value + (rate.perDay/1000)*daysToNext;
  return { lastDate: latest.date, lastValue: latest.value, nextDate, daysUntil, insufficient:false, projectedVal, perDay:rate.perDay, basis:rate.basis, isEarlyEstimate:rate.isEarlyEstimate };
}
/* Once a new weigh-in lands, retroactively work out what the PREVIOUS
   measurement's recent pace would have projected for today — no persistence
   needed, since the growth rate "as of" any past measurement is fully
   recoverable from the measurement history itself. */
function growthPaceComparisonNote(){
  const list = state.measurements.filter(m=>m.type==='weight').sort((a,b)=>new Date(a.date)-new Date(b.date));
  if(list.length<3) return null;
  const latest = list[list.length-1], prev = list[list.length-2];
  const priorList = list.slice(0,-1); // history as it stood at 'prev'
  const priorWindowStart = priorList.slice(0,-1).filter(m=> (new Date(prev.date)-new Date(m.date))/86400000 <= 14)
    .sort((a,b)=>new Date(a.date)-new Date(b.date))[0] || priorList[priorList.length-2];
  if(!priorWindowStart) return null;
  const priorDays = Math.max(1, (new Date(prev.date)-new Date(priorWindowStart.date))/86400000);
  const priorRate = (prev.value-priorWindowStart.value)*1000/priorDays;
  const gapDays = (new Date(latest.date)-new Date(prev.date))/86400000;
  const projectedForLatest = prev.value + (priorRate/1000)*gapDays;
  const diffG = (latest.value-projectedForLatest)*1000;
  if(Math.abs(diffG) < 30) return { text:'Tracking close to her recent trajectory.', changed:false };
  return { text: diffG>0 ? 'Growth has been a little faster than her previous recent pace.' : 'Growth has been a little slower than her previous recent pace.', changed:true, diffG };
}
function renderNextWeighInBlock(){
  const proj = projectNextWeighIn();
  if(!proj) return '';
  const paceNote = growthPaceComparisonNote();
  return `
    <div class="surface-group" style="padding:14px 16px;margin-top:14px;">
      <div style="font-weight:800;font-size:13px;">Next weigh-in · ${fmtDate(proj.nextDate)}</div>
      ${proj.insufficient
        ? `<div class="meta-text" style="margin-top:4px;">Not enough recent measurements for a useful projection yet.</div>`
        : `
        <div class="secondary-metric" style="margin-top:4px;">Projected ~${proj.projectedVal.toFixed(2)} kg${proj.isEarlyEstimate?' (early estimate)':''}</div>
        <div class="meta-text" style="margin-top:2px;">Based on ${proj.perDay>=0?'+':''}${proj.perDay.toFixed(1)} g/day ${proj.basis}</div>
        ${paceNote ? `<div class="meta-text" style="margin-top:6px;">${paceNote.text}</div>` : ''}
        <div class="note" style="margin-top:8px;">This is an extrapolation from her own recent growth, not a target — her WHO percentile trajectory above is the more meaningful longitudinal reference.</div>
      `}
    </div>
  `;
}

function growthNarrative(type){
  const list = state.measurements.filter(m=>m.type===type).sort((a,b)=>new Date(a.date)-new Date(b.date));
  if(!list.length) return null;
  const tableKey = TYPE_TO_TABLE[type];
  const latest = list[list.length-1];
  const ageM = ageMonthsDecimal(state.profile.birthDate, latest.date);
  const row = interpolateRow(tableKey, ageM);
  const score = Math.round(percentileScore(row, latest.value));
  const ordinal = ordinalSuffix(score);
  const noun = type==='weight'?'weight':type==='length'?'length':'head circumference';

  let msg = `${state.profile.name}'s latest ${noun} (${latest.value}${unitFor(type)}) plots around the ${ordinal} percentile on the WHO ${noun}-for-age chart.`;

  if(list.length>=2){
    const prev = list[list.length-2];
    const prevAgeM = ageMonthsDecimal(state.profile.birthDate, prev.date);
    const prevRow = interpolateRow(tableKey, prevAgeM);
    const prevScore = Math.round(percentileScore(prevRow, prev.value));
    msg += ` Her previous measurement plotted around the ${ordinalSuffix(prevScore)} percentile. Repeated measurements over time are generally more informative than any single percentile reading.`;
  } else {
    msg += ` Repeated measurements over time are generally more informative than any single percentile reading — this is just her first.`;
  }
  return { verdict:`Tracking around the ${ordinal} percentile`, msg, score };
}
/* "Birth → Lowest → Regained → Latest" summary (mainly meaningful for weight,
   which commonly dips below birth weight in the first days). */
function growthSinceBirth(type){
  const list = state.measurements.filter(m=>m.type===type).sort((a,b)=>new Date(a.date)-new Date(b.date));
  if(list.length<2) return null;
  const birth = list[0];
  let lowest = list[0];
  list.forEach(m=>{ if(m.value<lowest.value) lowest=m; });
  let regained = null;
  if(lowest.id!==birth.id){
    for(const m of list){ if(new Date(m.date)>new Date(lowest.date) && m.value>=birth.value){ regained=m; break; } }
  }
  const latest = list[list.length-1];
  return { birth, lowest, regained, latest, hasDip: lowest.id!==birth.id };
}
/* Detailed trend stats: since-birth change, %, rate/day, since-previous change, age at measurement. */
function growthTrend(type){
  const list = state.measurements.filter(m=>m.type===type).sort((a,b)=>new Date(a.date)-new Date(b.date));
  if(list.length<2) return { insufficient:true };
  const first = list[0], latest = list[list.length-1];
  const prev = list[list.length-2];
  const daysSinceBirth = (new Date(latest.date)-new Date(first.date))/86400000;
  const diffSinceBirth = latest.value - first.value;
  const pctSinceBirth = first.value!==0 ? (diffSinceBirth/first.value*100) : null;
  const perDay = daysSinceBirth>0 ? (diffSinceBirth/daysSinceBirth) : null;
  const diffSincePrev = latest.value - prev.value;
  const daysSincePrev = (new Date(latest.date)-new Date(prev.date))/86400000;
  return { insufficient:false, first, latest, prev, daysSinceBirth, diffSinceBirth, pctSinceBirth, perDay, diffSincePrev, daysSincePrev };
}

/* ---------------- SVG growth chart ---------------- */
function buildChartSVG(type, points, maxAgeWindow){
  const table = WHO_GIRLS[type];
  const W = 400, H = 250, padL = 34, padR = 12, padT = 14, padB = 26;
  const maxAge = maxAgeWindow || 24;
  const rowCount = Math.min(24, Math.ceil(maxAge)) + 1;
  const dark = isDarkMode();
  const gridColor = dark ? 'rgba(61,53,68,0.55)' : 'rgba(237,227,242,0.7)';
  const textColor = dark ? '#83788F' : '#918B98';
  const bandFill = dark ? '#C3AADD' : '#B79FD1';
  const childStroke = dark ? '#F2A796' : '#EC9384';
  const pointStroke = dark ? '#28232D' : '#fff';
  const labelColor = dark ? '#F0B3A6' : '#B5525B';
  /* WHO reference: quiet. 50th = thin muted dashed; other curves only when expanded. */
  const midCurveColor = dark ? '#6B5F79' : '#C9B8DB';
  const outerCurveColor = dark ? '#4A4152' : '#DDD1E8';
  let minV = Infinity, maxV = -Infinity;
  table.slice(0, rowCount).forEach(row=>{ minV=Math.min(minV,row[0]); maxV=Math.max(maxV,row[4]); });
  points.forEach(p=>{ if(p.m<=maxAge){ minV=Math.min(minV,p.v); maxV=Math.max(maxV,p.v); } });
  const pad = (maxV-minV)*0.1 || 1;
  minV -= pad; maxV += pad;
  const x = m => padL + (Math.min(m,maxAge)/maxAge)*(W-padL-padR);
  const y = v => padT + (1-((v-minV)/(maxV-minV)))*(H-padT-padB);
  function pathFor(colIdx){
    return table.slice(0, rowCount).map((row,i)=> (i===0?'M':'L') + x(i).toFixed(1) + ',' + y(row[colIdx]).toFixed(1)).join(' ');
  }
  /* Parent-friendly X labels: whole months ("Birth · 1m · 2m") for short windows */
  let tickStep = maxAge<=8 ? 1 : maxAge<=12 ? 2 : 6;
  let ticks = []; for(let t=0;t<=maxAge+0.01;t+=tickStep) ticks.push(Math.round(t));
  const monthLabel = m => m===0 ? 'Birth' : `${m}m`;

  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="overflow:hidden" font-family="IBM Plex Mono, monospace" role="img" aria-label="${labelType(type)} chart plotted against WHO reference">`;
  /* 3 gridlines instead of 5, lower opacity */
  for(let g=0; g<=2; g++){
    const v = minV + (maxV-minV)*g/2; const yy = y(v);
    svg += `<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}" stroke="${gridColor}" stroke-width="1"/>`;
    svg += `<text x="2" y="${(yy+3).toFixed(1)}" font-size="8.5" fill="${textColor}">${v.toFixed(1)}</text>`;
  }
  ticks.forEach(m=>{
    svg += `<text x="${x(m).toFixed(1)}" y="${H-8}" font-size="8.5" fill="${textColor}" text-anchor="middle">${monthLabel(m)}</text>`;
  });
  const rows = table.slice(0, rowCount);
  const topPath = rows.map((row,i)=> (i===0?'M':'L') + x(i).toFixed(1) + ',' + y(row[4]).toFixed(1)).join(' ');
  const botPath = rows.slice().reverse().map((row,i)=> 'L' + x(rowCount-1-i).toFixed(1) + ',' + y(row[0]).toFixed(1)).join(' ');
  /* 3rd–97th band: very low opacity */
  svg += `<path d="${topPath} ${botPath} Z" fill="${bandFill}" opacity="${dark?0.07:0.05}"/>`;
  if(showWhoCurves){
    /* Expanded: all five reference curves, still quiet */
    [0,1,3,4].forEach((colIdx)=>{
      svg += `<path d="${pathFor(colIdx)}" fill="none" stroke="${outerCurveColor}" stroke-width="1" stroke-dasharray="3,4" opacity="0.85"/>`;
    });
  }
  /* 50th percentile: thin muted dashed, always */
  svg += `<path d="${pathFor(2)}" fill="none" stroke="${midCurveColor}" stroke-width="1.2" stroke-dasharray="4,4"/>`;
  const visiblePts = points.filter(p=>p.m<=maxAge+0.05);
  if(visiblePts.length){
    /* Vertical guide line through selected point */
    if(chartActivePointIdx!=null && visiblePts[chartActivePointIdx]){
      const gp = visiblePts[chartActivePointIdx];
      svg += `<line x1="${x(gp.m).toFixed(1)}" y1="${padT}" x2="${x(gp.m).toFixed(1)}" y2="${(H-padB).toFixed(1)}" stroke="${childStroke}" stroke-width="1" opacity="0.35" stroke-dasharray="2,3"/>`;
    }
    /* Baby's line: the visual hero */
    const dPath = visiblePts.map((p,i)=> (i===0?'M':'L') + x(p.m).toFixed(1) + ',' + y(p.v).toFixed(1)).join(' ');
    svg += `<path d="${dPath}" fill="none" stroke="${childStroke}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
    visiblePts.forEach((p,i)=>{
      const isActive = i===chartActivePointIdx;
      const isNewest = i===visiblePts.length-1;
      const r = isActive ? 7 : isNewest ? 5.5 : 4;
      svg += `<circle class="chart-pt" data-idx="${i}" cx="${x(p.m).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="13" fill="transparent" style="cursor:pointer;" role="button" aria-label="${labelType(type)} ${p.v}${unitFor(type)}, around the ${Math.round(p.score)}th percentile"/>`;
      svg += `<circle class="${isNewest?'pt-new':''}" cx="${x(p.m).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="${r}" fill="${childStroke}" stroke="${pointStroke}" stroke-width="${isActive?3:2}" pointer-events="none"/>`;
      /* Only the latest point carries a permanent label */
      if(isNewest && !isActive){
        svg += `<text x="${(x(p.m)+10).toFixed(1)}" y="${(y(p.v)+3).toFixed(1)}" font-size="9" fill="${labelColor}" font-weight="600" pointer-events="none">${Math.round(p.score)}th</text>`;
      }
    });
  }
  svg += `</svg>`;
  chartPointsCache = visiblePts;
  return svg;
}

/* Many interactive rows/cards throughout the app are <div>s with a click

   which by default are invisible to keyboard/switch-control navigation. This
   retroactively gives every such element a tab stop, a button role, and
   Enter/Space activation — covering current and future instances alike,
   rather than needing tabindex/role/keydown added at dozens of call sites. */
function makeClickablesKeyboardAccessible(){
  document.querySelectorAll('main [style*="cursor:pointer"], .sheet [style*="cursor:pointer"], .moment-viewer-overlay [style*="cursor:pointer"]').forEach(el=>{
    if(el.tagName==='BUTTON' || el.tagName==='A' || el.hasAttribute('tabindex')) return;
    el.setAttribute('tabindex','0');
    if(!el.hasAttribute('role')) el.setAttribute('role','button');
    el.addEventListener('keydown', function(e){
      if(e.key==='Enter' || e.key===' '){ e.preventDefault(); el.click(); }
    });
  });
}

/* Growth trend plausibility — a soft, dismissible warning (not a hard block) when a new
   measurement is a big jump from the baby's own recent trend, given how much time has
   passed. Physiologically-bounded, generous rates so real growth never gets flagged. */
const GROWTH_RATE_BOUNDS = {
  weight: { maxGainPerDay:0.05, maxLossPerDay:0.04, tolerance:0.2 },
  length: { maxGainPerDay:0.2,  maxLossPerDay:0.1,  tolerance:1.5 },

function mostRecentPriorMeasurement(type, beforeISO, excludeId){
  const list = state.measurements.filter(m=> m.type===type && m.id!==excludeId && new Date(m.date) < new Date(beforeISO));
  if(!list.length) return null;
  return list.sort((a,b)=> new Date(b.date)-new Date(a.date))[0];

function checkPlausibleGrowth(type, newVal, newDateISO, prevEntry){
  const r = GROWTH_RATE_BOUNDS[type];

  const days = Math.max(0.5, (new Date(newDateISO) - new Date(prevEntry.date)) / 86400000);
  const diff = newVal - prevEntry.value;
  const maxGain = r.maxGainPerDay*days + r.tolerance;
  const maxLoss = r.maxLossPerDay*days + r.tolerance;
  if(diff > maxGain) return `That's a big jump from her last ${labelType(type).toLowerCase()} — ${prevEntry.value}${unitFor(type)} on ${fmtDate(prevEntry.date)}. Save anyway?`;
  if(diff < -maxLoss) return `That's a big drop from her last ${labelType(type).toLowerCase()} — ${prevEntry.value}${unitFor(type)} on ${fmtDate(prevEntry.date)}. Save anyway?`;
  return null;

function goToStep(key){
  cancelEditing();

function renderSheet(){
  const overlay = document.getElementById('sheetOverlay');
  const panel = document.getElementById('sheetPanel');
  if(!overlay || !panel) return;
  if(sheetOpen){
    overlay.classList.add('open');
    panel.innerHTML = `<div class="sheet-handle"></div>` + renderSheetContent();
    bindSheet();
    makeClickablesKeyboardAccessible();
  } else {
    overlay.classList.remove('open');
  }
}
function nowTimeRow(inputId, dateOnly, prefillISO){
  let val;
  if(sheetDraft[inputId] !== undefined){
    val = sheetDraft[inputId];
  } else if(prefillISO){
    if(dateOnly){ val = sydDateKey(prefillISO); }
    else { const p = sydDateParts(prefillISO); val = `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}`; }
  } else {
    val = dateOnly ? todayDateInput() : todayInput();
  }
  if(!sheetShowTime){
    return `<div class="ql-nowrow"><span>Now</span><button data-showtime="1">Change</button><input type="hidden" id="${inputId}" value="${val}"></div>`;
  }
  return `<label>Time</label><input type="${dateOnly?'date':'datetime-local'}" id="${inputId}" value="${val}">`;
}
function renderSheetContent(){
  if(sheetStep==='menu') return renderQuickLogMenu();

  if(sheetStep==='feed') return renderQuickLogFeed(sheetPumpForced);
  if(sheetStep==='sleep') return renderQuickLogSleep();
  if(sheetStep==='temp') return renderQuickLogTemp();
  if(sheetStep==='weight') return renderQuickLogWeight();
  if(sheetStep==='moment') return renderQuickLogMoment();

function renderDetailSheet(){
  const m = DELETE_MAP[sheetDetailKind];
  const item = m ? state[m.arr].find(x=>x.id===sheetDetailId) : null;
  if(!item) return `<div class="sheet-title">Details</div><div class="empty">This entry was removed.</div>`;
  let title='', lines=[];
  const loggedByLine = item.createdByRole ? 'Logged by '+item.createdByRole : null;
  if(sheetDetailKind==='feed'){ const nf=normalizeFeed(item); title='Feed'; lines=[feedSummaryLine(item), fmtDateTime(nf.date), item.note, loggedByLine]; }
  else if(sheetDetailKind==='nappy'){ title='Nappy'; lines=[item.type==='wet'?'Wet':item.type==='poo'?'Poo':'Wet + poo', fmtDateTime(item.date), item.note, loggedByLine]; }
  else if(sheetDetailKind==='sleep'){
    title='Sleep';
    const crossesDay = item.endAt && sydDateKey(item.date)!==sydDateKey(item.endAt);
    if(!item.endAt){
      lines=[`${item.label==='nap'?'Nap':'Night sleep'} · ${fmtDuration(item.mins)}`, `${fmtTime(item.date)} · ${fmtDate(item.date)}`, item.note];
    } else if(crossesDay){
      const d1 = sydDateKey(item.date), d2 = sydDateKey(item.endAt);
      const m1 = sleepMinutesOnDay(item, d1), m2 = sleepMinutesOnDay(item, d2);
      lines=[
        `${item.label==='nap'?'Nap':'Night sleep'} · ${fmtDuration(item.mins)} total`,
        `Started ${fmtDate(item.date)} · ${fmtTime(item.date)}`,
        `Ended ${fmtDate(item.endAt)} · ${fmtTime(item.endAt)}`,
        `Daily contribution: ${fmtDate(item.date)} ${fmtDuration(m1)} · ${fmtDate(item.endAt)} ${fmtDuration(m2)}`,
        item.note
      ];
    } else {
      lines=[`${item.label==='nap'?'Nap':'Night sleep'} · ${fmtDuration(item.mins)}`, `${fmtTime(item.date)} – ${fmtTime(item.endAt)} · ${fmtDate(item.date)}`, item.note];
    }
    lines.push(loggedByLine);
  }
  else if(sheetDetailKind==='measurement'){ title=labelType(item.type); lines=[`${item.value}${unitFor(item.type)}`, fmtDateTime(item.date), item.note, loggedByLine]; }
  else if(sheetDetailKind==='vaccine'){ title=item.name; lines=[item.dose, item.givenDate?`Given ${fmtDate(item.givenDate)}`:'Not yet given', item.provider?('Provider: '+item.provider):null]; }
  else if(sheetDetailKind==='appointment'){ title=item.title; lines=[fmtDateFull(item.date), item.note, loggedByLine]; }
  else if(sheetDetailKind==='temperature'){ title='Temperature'; lines=[`${item.tempC}°C · ${item.method}`, fmtDateTime(item.date), item.note, loggedByLine]; }
  else if(sheetDetailKind==='healthRecord'){ title=item.title; lines=[fmtDateTime(item.date), item.details, loggedByLine]; }
  else if(sheetDetailKind==='milestone'){ title=item.title; lines=[`${fmtDate(item.date)} · ${momentAgeLabel(item.date)}`, item.note, loggedByLine]; }
  lines = lines.filter(Boolean);
  const canEdit = !!KIND_TO_STEP[sheetDetailKind];
  return `
    <div class="sheet-title">${escapeHtml(title)}</div>
    ${lines.map(l=>`<div class="support-text" style="margin-top:2px;">${escapeHtml(l)}</div>`).join('')}
    <div class="menu-panel" style="margin-top:20px;">
      ${canEdit ? `<button data-detailedit="1">Edit</button>` : ''}
      <button data-detaildelete="1" class="danger">Delete</button>
    </div>
  `;
}

  });
  const saveNappyDetailed = document.getElementById('saveNappyDetailed');

    const date = document.getElementById('nappyDateInput').value;

    }

  document.querySelectorAll('#qlFeedSubtypeSeg [data-fs]').forEach(b=>{

  });
  const qlFeedAddDetails = document.getElementById('qlFeedAddDetails');

  const saveFeedBtn = document.getElementById('qlSaveFeed');
  if(saveFeedBtn) saveFeedBtn.addEventListener('click', async ()=>{
    const subtype = saveFeedBtn.dataset.subtype;
    const date = document.getElementById('qlFeedDate').value;
    const note = document.getElementById('qlFeedNote') ? document.getElementById('qlFeedNote').value.trim() : '';
    let patch = { type:subtype, date:new Date(date).toISOString(), note };
    if(subtype==='breastfeeding'){
      const left = parseFloat(document.getElementById('qlFeedLeft').value)||0;
      const right = parseFloat(document.getElementById('qlFeedRight').value)||0;
      if(left===0 && right===0){ toast('Enter a duration for at least one side'); return; }
      let err = checkBounds(left, 'feedMins') || checkBounds(right, 'feedMins');
      if(err){ toast(err); return; }
      patch.leftMins=left; patch.rightMins=right; patch.totalMins=left+right;
      state.prefs = state.prefs||{};
      state.prefs.lastBreastSide = (left>0 && right===0) ? 'Left' : (right>0 && left===0) ? 'Right' : 'Both';
    } else if(subtype==='expressed' || subtype==='formula'){
      const offered = parseFloat(document.getElementById('qlFeedOffered').value)||0;
      const consumed = parseFloat(document.getElementById('qlFeedConsumed').value)||0;
      let err = checkBounds(offered, 'feedMl') || checkBounds(consumed, 'feedMl');
      if(err){ toast(err); return; }
      patch.offeredMl = offered; patch.consumedMl = consumed;
    } else if(subtype==='pumping'){
      const pl = parseFloat(document.getElementById('qlPumpLeft').value)||0;
      const pr = parseFloat(document.getElementById('qlPumpRight').value)||0;
      const pd = parseFloat(document.getElementById('qlPumpDuration').value)||0;
      let err = checkBounds(pl, 'feedMl') || checkBounds(pr, 'feedMl') || checkBounds(pd, 'pumpMins');
      if(err){ toast(err); return; }
      patch.pumpLeftMl=pl; patch.pumpRightMl=pr; patch.pumpTotalMl=pl+pr; patch.pumpDurationMin=pd;
    }
    state.prefs = state.prefs||{};
    if(!sheetPumpForced) state.prefs.lastFeedType = subtype;
    if(editingKind==='feed' && editingId){
      updateEntry('feed', editingId, patch);
    } else {
      state.feeds.push(Object.assign({id:uid()}, patch, attributionFields()));

/* Canonical nappy aggregation — every nappy stat anywhere in the app must be
   derived from computeNappyStats() over the right set of records, never
   re-implemented ad hoc. wetContainingCount/dirtyContainingCount overlap
   (a "both" nappy counts toward both) and are NOT meant to sum to changeCount. */
function computeNappyStats(nappies){
  let wetOnlyCount=0, dirtyOnlyCount=0, bothCount=0;
  nappies.forEach(n=>{
    if(n.type==='wet') wetOnlyCount++;
    else if(n.type==='poo') dirtyOnlyCount++;
    else if(n.type==='both') bothCount++;
  });
  return {
    changeCount: nappies.length,
    wetContainingCount: wetOnlyCount+bothCount,
    dirtyContainingCount: dirtyOnlyCount+bothCount,
    wetOnlyCount, dirtyOnlyCount, bothCount,
    wet: wetOnlyCount+bothCount, dirty: dirtyOnlyCount+bothCount // aliases for existing call sites
  };
}
function getDailyNappyStats(dateRef){
  const dayStr = sydDateKey(dateRef || new Date());
  return computeNappyStats(state.nappies.filter(n=> sydDateKey(n.date)===dayStr));
}
function getNappyStatsForPeriod(startMs, endMs){
  return computeNappyStats(state.nappies.filter(n=>{ const t=new Date(n.date).getTime(); return t>=startMs && t<endMs; }));
}
function nappyCountsToday(){ return getDailyNappyStats(); }
function nappyCounts24h(){ return getNappyStatsForPeriod(Date.now()-86400000, Date.now()); }
function weightSinceBirth(){
  const list = state.measurements.filter(m=>m.type==='weight').sort((a,b)=>new Date(a.date)-new Date(b.date));
  if(!list.length) return null;
  const first = list[0], latest = list[list.length-1];
  return { latest: latest.value, diffKg: latest.value-first.value, onlyOne: first.id===latest.id };
}
function urgentTempBanner(){
  const temps = state.temperatures.slice().sort((a,b)=>new Date(b.date)-new Date(a.date));
  const latest = temps[0];
  if(!latest) return '';
  const ageM = ageMonthsDecimal(state.profile.birthDate, latest.date);
  const hoursAgo = (Date.now()-new Date(latest.date).getTime())/3600000;
  if(ageM<3 && latest.tempC>=38.0 && hoursAgo<6){
    return `<div class="urgent-banner"><div class="head">⚠️ Seek urgent medical assessment</div>A temperature of 38.0°C or higher in a baby under 3 months old should be assessed by a doctor promptly, rather than waiting to see how it develops. Logged ${timeAgo(latest.date)}.</div>`;
  }
  return '';
}
function buildTimelineEvents(){
  const events = [];
  state.feeds.forEach(f=>{ const nf=normalizeFeed(f); events.push({id:f.id, kind:'feed', date:nf.date, cat:'feeding', line: feedSummaryLine(f)}); });
  state.nappies.forEach(n=>{ events.push({id:n.id, kind:'nappy', date:n.date, cat:'nappies', line: `${n.type==='wet'?'💧 Wet':n.type==='poo'?'💩 Poo':'💧💩 Wet + poo'} nappy${n.note?' · '+n.note:''}`}); });
  state.sleeps.forEach(s=>{
    const crossesDay = s.endAt && sydDateKey(s.date)!==sydDateKey(s.endAt);
    const rangeLine = crossesDay ? `<br><span style="font-size:11px;color:var(--ink-tertiary);font-weight:500;">${fmtTime(s.date)} → ${fmtTime(s.endAt)} next day</span>` : '';
    events.push({id:s.id, kind:'sleep', date:s.date, cat:'sleep', line: `😴 ${s.label==='nap'?'Nap':'Night sleep'} · ${fmtDuration(s.mins)}${rangeLine}`});
  });
  state.measurements.forEach(m=>{ events.push({id:m.id, kind:'measurement', date:m.date, cat:'growth', line: `${m.type==='weight'?'⚖️':m.type==='length'?'📏':'🧠'} ${labelType(m.type)} · ${m.value}${unitFor(m.type)}`}); });
  state.vaccines.filter(v=>v.givenDate).forEach(v=>{ events.push({id:v.id, kind:'vaccine', date:v.givenDate, cat:'health', line: `💉 ${v.name} given`}); });
  /* Only PAST appointments belong in the "what happened" history — a future
     appointment is not a completed event. Upcoming ones surface separately. */
  state.appointments.filter(a=> new Date(a.date) <= new Date()).forEach(a=>{ events.push({id:a.id, kind:'appointment', date:a.date, cat:'health', line: `🩺 ${a.title}${a.status==='completed'?' (completed)':a.status==='cancelled'?' (cancelled)':''}`}); });
  state.temperatures.forEach(t=>{ events.push({id:t.id, kind:'temperature', date:t.date, cat:'health', line: `🌡 ${t.tempC}°C${t.method?' · '+t.method:''}`}); });
  state.healthRecords.forEach(r=>{ events.push({id:r.id, kind:'healthRecord', date:r.date, cat:'health', line: `${healthCatIcon(r.category)} ${r.title}`}); });
  state.milestones.forEach(m=>{ events.push({id:m.id, kind:'milestone', date:m.date, cat:'moments', line: `⭐ ${m.title}`}); });
  return events.sort((a,b)=> new Date(b.date)-new Date(a.date));
}

/* ---------------- Growth insights: velocity + percentile trend ---------------- */
function growthVelocity(type){
  const list = state.measurements.filter(m=>m.type===type).sort((a,b)=>new Date(a.date)-new Date(b.date));
  if(list.length<2) return null;
  const a = list[list.length-2], b = list[list.length-1];
  const days = (new Date(b.date)-new Date(a.date))/86400000;
  if(days<=0) return null;
  const diff = b.value-a.value;
  return { diff, perWeek: diff/days*7, days };
}
function percentileTrendSVG(points){
  if(points.length<2) return '';
  const W=400,H=90,padL=28,padR=10,padT=10,padB=18;
  const dark = isDarkMode();
  const gridColor = dark ? '#3D3544' : '#EDE3F2';
  const textColor = dark ? '#9A8FAA' : '#8B7E93';
  const lineColor = dark ? '#A3D8C6' : '#8FCDBB';
  const dotColor = dark ? '#6FBBA3' : '#4F9E8B';
  const minM = points[0].m, maxM = points[points.length-1].m;
  const spanM = Math.max(0.1, maxM-minM);
  const x = m => padL + ((m-minM)/spanM)*(W-padL-padR);
  const y = s => padT + (1-((s)/100))*(H-padT-padB);
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="overflow:hidden" font-family="IBM Plex Mono, monospace">`;
  [3,15,50,85,97].forEach(v=>{
    const yy=y(v);
    svg += `<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}" stroke="${gridColor}" stroke-width="1"/>`;
    svg += `<text x="1" y="${(yy+3).toFixed(1)}" font-size="8" fill="${textColor}">${v}</text>`;
  });
  const clamp = s => Math.max(0,Math.min(100,s));
  const dPath = points.map((p,i)=> (i===0?'M':'L') + x(p.m).toFixed(1) + ',' + y(clamp(p.score)).toFixed(1)).join(' ');
  svg += `<path d="${dPath}" fill="none" stroke="${lineColor}" stroke-width="2.5"/>`;
  points.forEach(p=>{
    svg += `<circle cx="${x(p.m).toFixed(1)}" cy="${y(clamp(p.score)).toFixed(1)}" r="3.5" fill="${dotColor}"/>`;
  });
  svg += `</svg>`;
  return svg;
}

/* ---------------- Growth ---------------- */
function renderSinceBirthCard(type){
  const gsb = growthSinceBirth(type);
  const trend = growthTrend(type);
  const unit = unitFor(type);
  let chainHtml = '';
  if(gsb){
    const parts = [`Birth: ${gsb.birth.value}${unit} · ${fmtDate(gsb.birth.date)}`];
    if(gsb.hasDip){
      parts.push(`Lowest: ${gsb.lowest.value}${unit} · ${fmtDate(gsb.lowest.date)}`);
      parts.push(gsb.regained ? `Regained by ${fmtDate(gsb.regained.date)}` : 'Not yet regained');
    }
    parts.push(`Latest: ${gsb.latest.value}${unit} · ${fmtDate(gsb.latest.date)}`);
    chainHtml = `<div class="note" style="font-size:12.5px;line-height:1.9;">${parts.join(' → ')}</div>`;
  }
  let trendHtml;
  if(trend.insufficient){
    trendHtml = `<div class="empty">Not enough measurements for a reliable trend yet.</div>`;
  } else {
    const diffLbl = `${trend.diffSinceBirth>=0?'+':''}${trend.diffSinceBirth.toFixed(2)}${unit}`;
    const pctLbl = trend.pctSinceBirth!=null ? `${trend.pctSinceBirth>=0?'+':''}${trend.pctSinceBirth.toFixed(1)}%` : '—';
    const perDayLbl = trend.perDay!=null ? (type==='weight' ? `${trend.perDay>=0?'+':''}${(trend.perDay*1000).toFixed(1)} g/day` : `${trend.perDay>=0?'+':''}${trend.perDay.toFixed(3)} ${unit.trim()}/day`) : '—';
    trendHtml = `
      <div class="stat-grid" style="grid-template-columns:1fr 1fr;">
        <div class="stat"><span class="val">${diffLbl}</span><span class="lbl">Since birth</span></div>
        <div class="stat"><span class="val">${pctLbl}</span><span class="lbl">% from birth</span></div>
      </div>
      <div class="note" style="margin-top:10px;">${trend.diffSincePrev>=0?'+':''}${trend.diffSincePrev.toFixed(2)}${unit} since previous measurement (${Math.round(trend.daysSincePrev)}d ago) · ${perDayLbl} average, based on ${Math.round(trend.daysSinceBirth)} days between first and latest measurements.</div>
    `;
  }
  return `<div class="card"><h2>📐 Since birth</h2>${chainHtml || `<div class="empty">Log at least two measurements to see her growth since birth.</div>`}${trendHtml}</div>`;
}
function renderGrowth(){
  const tableKey = TYPE_TO_TABLE[currentGrowthTab];
  const pts = state.measurements.filter(m=>m.type===currentGrowthTab)
    .map(m=>{
      const ageM = ageMonthsDecimal(state.profile.birthDate, m.date);
      const row = interpolateRow(tableKey, ageM);
      return { m: ageM, v: m.value, score: percentileScore(row, m.value), date: m.date, id: m.id };
    })
    .sort((a,b)=>a.m-b.m);
  const currentAgeM = ageMonthsDecimal(state.profile.birthDate, new Date().toISOString());
  const zoomWindow = Math.min(24, Math.max(3, Math.ceil(currentAgeM)+2));
  const activeWindow = growthZoomed ? zoomWindow : 24;
  const svg = buildChartSVG(tableKey, pts, activeWindow);
  const nar = growthNarrative(currentGrowthTab);
  const trend = growthTrend(currentGrowthTab);
  const trendSvg = percentileTrendSVG(pts);
  const corrected = correctedAgeInfo();
  const latest = pts[pts.length-1];
  const activePt = (chartActivePointIdx!=null && chartPointsCache[chartActivePointIdx]) ? chartPointsCache[chartActivePointIdx] : null;
  const first = pts[0];
  const sinceBirthLine = (latest && first && latest.id!==first.id)
    ? (currentGrowthTab==='weight'
        ? `${(latest.v-first.v)>=0?'+':''}${Math.round((latest.v-first.v)*1000)} g since birth`
        : `${(latest.v-first.v)>=0?'+':''}${(latest.v-first.v).toFixed(1)} cm since birth`)
    : null;
  /* Tooltip stats for a selected point */
  let activeDetail = null;
  if(activePt){
    const fromBirth = first && activePt.id!==first.id ? activePt.v-first.v : null;
    const daysFromBirth = first ? (new Date(activePt.date)-new Date(first.date))/86400000 : 0;
    const perDay = (fromBirth!=null && daysFromBirth>0) ? fromBirth/daysFromBirth : null;
    activeDetail = { fromBirth, perDay };

  return `
    <div class="hero" style="margin:2px 0 10px;"><h1>Growth</h1>${corrected && !corrected.notYetTermEquivalent ? `<p>Chronological ${ageLabelShort(state.profile.birthDate)} · Corrected ${corrected.label}</p>` : ''}</div>

      <button data-g="hc" role="tab" aria-selected="${currentGrowthTab==='hc'}" class="${currentGrowthTab==='hc'?'active':''}">Head</button>
    </div>

    ${latest ? `
    <div class="hero-metric" style="font-size:34px;">${latest.v}<span style="font-size:15px;font-weight:700;"> ${unitFor(currentGrowthTab).trim()}</span></div>
    <div class="secondary-metric" style="margin-top:3px;">${ordinalSuffix(Math.round(latest.score))} percentile</div>
    ${sinceBirthLine ? `<div class="meta-text" style="font-size:12px;margin-top:3px;">${sinceBirthLine}</div>` : ''}
    ` : `<div class="empty">No ${labelType(currentGrowthTab).toLowerCase()} logged yet — tap + Log to add one.</div>`}

    <div style="margin-top:12px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;">
        <div class="legend" style="margin-top:0;"><span><i style="background:${isDarkMode()?'#F2A796':'#EC9384'}"></i>${escapeHtml(state.profile.name)}</span><span style="color:var(--ink-tertiary);">WHO reference</span></div>
        <div style="display:flex;gap:2px;">
          <button id="toggleWhoCurves" style="border:none;background:none;font-size:11px;font-weight:700;color:var(--ink-soft);cursor:pointer;padding:4px;">${showWhoCurves ? 'Hide WHO curves' : 'WHO curves'}</button>
          <button id="zoomToggle" style="border:none;background:none;font-size:11px;font-weight:700;color:var(--ink-soft);cursor:pointer;padding:4px;">${growthZoomed ? 'Full 24mo' : 'Zoom to age'}</button>
        </div>
      </div>
      <div id="chartWrap">${svg}</div>
    </div>
    ${activePt ? `
    <div class="chart-tooltip">
      <div style="font-size:11.5px;font-weight:700;color:var(--ink-soft);">${fmtDate(activePt.date)} · ${momentAgeLabel(activePt.date)}</div>
      <div style="font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-size:19px;font-weight:600;color:var(--ink);margin-top:3px;">${activePt.v}${unitFor(currentGrowthTab)}</div>
      <div style="font-size:12px;font-weight:700;color:var(--lavender-deep);margin-top:2px;">${ordinalSuffix(Math.round(activePt.score))} percentile</div>

    </div>
    ${growthExplainOpen ? `
      ${nar ? `<div class="narrative">${nar.msg}</div>` : ''}
      ${renderSinceBirthCard(currentGrowthTab)}
      ${pts.length>=2 ? `
      <div class="card">
        <h2>Percentile trend</h2>
        ${trendSvg}
        <div class="note">This plots her percentile position itself over time, separate from the raw number. A flat line means she's tracking steadily along her curve; a rising or falling line means she's crossing percentiles — worth a mention at her next checkup either way.</div>
      </div>` : ''}

    <div class="section-header">All entries</div>

/* ---------------- Daily / weekly summaries & pattern insights ---------------- */
function dailySummary(dateRef){
  dateRef = dateRef || new Date();
  const dayStr = sydDateKey(dateRef);
  const feedsToday = state.feeds.map(normalizeFeed).filter(f=> sydDateKey(f.date)===dayStr);
  const breastfeeds = feedsToday.filter(f=>f.type==='breastfeeding');
  const totalNursingMin = breastfeeds.reduce((s,f)=>s+(f.totalMins||0),0);
  const feedTimes = feedsToday.map(f=>new Date(f.date).getTime()).sort((a,b)=>a-b);
  let avgIntervalMin = null;
  if(feedTimes.length>=2){
    let gap=0; for(let i=1;i<feedTimes.length;i++) gap += feedTimes[i]-feedTimes[i-1];
    avgIntervalMin = (gap/(feedTimes.length-1))/60000;
  }
  /* Sleep uses calendar-day OVERLAP, not the session's start date — canonical
     everywhere via sleepMinutesOnDay/effectiveSleepRecords. An overnight sleep
     only contributes the portion that actually falls on this day; a period
     counts here if any part of it overlaps; "longest stretch" is still the
     full uninterrupted session, never clipped; an in-progress sleep counts
     its elapsed-so-far portion. */
  const allSleeps = effectiveSleepRecords();
  const overlapping = allSleeps.filter(s=> sleepMinutesOnDay(s, dayStr) > 0.5);
  const totalSleepMin = overlapping.reduce((s,x)=> s+sleepMinutesOnDay(x,dayStr), 0);
  const napMin = overlapping.filter(s=>s.label==='nap').reduce((s,x)=>s+sleepMinutesOnDay(x,dayStr),0);
  const nightMin = overlapping.filter(s=>s.label==='night').reduce((s,x)=>s+sleepMinutesOnDay(x,dayStr),0);
  const longestSleep = overlapping.reduce((mx,x)=>Math.max(mx,x.mins||0),0);
  const growthToday = state.measurements.filter(m=> sydDateKey(m.date)===dayStr);
  return {
    dayLabel: dateRef.toLocaleDateString(undefined,{weekday:'long', day:'numeric', month:'long', timeZone:APP_TZ}),
    feedCount: feedsToday.length, totalNursingMin, avgIntervalMin,
    totalSleepMin, sleepPeriods: overlapping.length, longestSleep, napMin, nightMin,
    nappies: getDailyNappyStats(dateRef), growthToday
  };
}
function weeklySummary(){
  const cutoff = Date.now()-7*86400000;
  const feeds7 = state.feeds.map(normalizeFeed).filter(f=> new Date(f.date).getTime()>=cutoff);
  const breastfeeds7 = feeds7.filter(f=>f.type==='breastfeeding');
  const totalNursingMin7 = breastfeeds7.reduce((s,f)=>s+(f.totalMins||0),0);
  const expressedMl7 = feeds7.filter(f=>f.type==='expressed').reduce((s,f)=>s+(f.consumedMl||0),0);
  const formulaMl7 = feeds7.filter(f=>f.type==='formula').reduce((s,f)=>s+(f.consumedMl||0),0);
  const pumpingMl7 = feeds7.filter(f=>f.type==='pumping').reduce((s,f)=>s+(f.pumpTotalMl||0),0);
  const feedTimes7 = feeds7.map(f=>new Date(f.date).getTime()).sort((a,b)=>a-b);
  let avgInterval7=null;
  if(feedTimes7.length>=2){ let g=0; for(let i=1;i<feedTimes7.length;i++) g+=feedTimes7[i]-feedTimes7[i-1]; avgInterval7=(g/(feedTimes7.length-1))/60000; }
  /* Sleep totals here must match the 7-Day Summary exactly — same underlying
     calendar-day overlap calculation, not a separate rolling-hours cutoff. */
  const sleepWeek7 = buildSleepWeek(get7DayKeys(0));
  const totalSleepMin7 = sleepWeek7.reduce((s,d)=>s+d.totalMin,0);
  const sleepPeriods7 = sleepWeek7.reduce((s,d)=>s+d.periods,0);
  const longestSleep7 = sleepWeek7.reduce((mx,d)=>Math.max(mx,d.longest),0);
  const nappyStats7 = getNappyStatsForPeriod(cutoff, Date.now());
  const weightList = state.measurements.filter(m=>m.type==='weight').sort((a,b)=>new Date(a.date)-new Date(b.date));
  let weightChange7 = null;
  if(weightList.length>=2){
    const latest = weightList[weightList.length-1];
    const before = weightList.filter(m=>new Date(m.date).getTime()<cutoff).slice(-1)[0] || weightList[0];
    if(before.id!==latest.id){
      const days=(new Date(latest.date)-new Date(before.date))/86400000;
      weightChange7 = { diff: latest.value-before.value, gramsPerDay: days>0?((latest.value-before.value)*1000/days):null, days };
    }
  }
  return {
    feedsPerDay7: feeds7.length/7, avgInterval7, totalNursingMin7, expressedMl7, formulaMl7, pumpingMl7,
    avgSleepPer24h: totalSleepMin7/7, sleepPeriods7, longestSleep7,
    wet7PerDay: nappyStats7.wet/7, dirty7PerDay: nappyStats7.dirty/7, weightChange7
  };
}
/* ================= Smart Insight Engine =================
   Pipeline: raw records → daily/period aggregates (reusing the same
   dailySummary/buildXWeek functions used everywhere else) → candidate
   generators, each gated on real data-sufficiency → ranked → top 2–4.
   Every insight carries its own supporting numbers so "Why am I seeing
   this?" never has to be taken on faith. Nothing here is LLM-generated —
   all numbers are deterministic calculations over the baby's own records. */
function mkInsight(o){ return o; }
function daysAgoKeys(n, offset){
  offset = offset||0;
  const keys=[]; for(let i=0;i<n;i++){ const d=new Date(); d.setDate(d.getDate()-(1+offset+i)); keys.push(sydDateKey(d)); }
  return keys.reverse();
}

/* --- Change: her longest overnight stretch, recent vs previous comparable nights --- */
function insightChangeSleepStretch(){
  const keys = daysAgoKeys(21);
  const withData = buildSleepWeek(keys).filter(b=>b.hasData);
  if(withData.length<7) return null;
  const recent = withData.slice(-3), prior = withData.slice(-7,-3);
  if(recent.length<3 || prior.length<3) return null;
  const recentAvg = recent.reduce((s,b)=>s+b.longest,0)/recent.length;
  const priorAvg = prior.reduce((s,b)=>s+b.longest,0)/prior.length;
  const diff = recentAvg-priorAvg;
  if(Math.abs(diff)<20) return null;
  const longer = diff>0;
  return mkInsight({
    id:'change-sleep-stretch', type:'change', domain:'sleep',
    title: longer?'Longer overnight stretch':'Shorter overnight stretch',
    body: `Her longest sleep stretch over the last ${recent.length} nights averaged ${fmtDuration(recentAvg)}, compared with ${fmtDuration(priorAvg)} over the previous ${prior.length} comparable nights.`,
    importance: Math.min(92, 45+Math.abs(diff)/3),
    evidence: { current: recent.map(b=>({label:b.dayKey, value:fmtDuration(b.longest)})), comparison: prior.map(b=>({label:b.dayKey, value:fmtDuration(b.longest)})) }
  });
}
/* --- Change: feeding frequency, recent vs previous comparable days --- */
function insightChangeFeedFrequency(){
  const keys = daysAgoKeys(21);
  const withData = buildFeedWeek(keys).filter(b=>b.hasData);
  if(withData.length<7) return null;
  const recent = withData.slice(-3), prior = withData.slice(-7,-3);
  if(recent.length<3 || prior.length<3) return null;
  const recentAvg = recent.reduce((s,b)=>s+b.babyFeedCount,0)/recent.length;
  const priorAvg = prior.reduce((s,b)=>s+b.babyFeedCount,0)/prior.length;
  const diff = recentAvg-priorAvg;
  if(Math.abs(diff)<1.2) return null;
  return mkInsight({
