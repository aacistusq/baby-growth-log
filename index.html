/* Finds the UTC instant for Sydney midnight on a given day-key, via fixed-point
   correction against the Intl-derived Sydney calendar (handles DST correctly
   without needing a timezone database of our own). */
function sydMidnightUTC(dayKey){
  let guess = new Date(dayKey+'T00:00:00Z').getTime();
  for(let i=0;i<3;i++){
    const p = sydDateParts(guess);
    const guessedKey = `${p.year}-${p.month}-${p.day}`;
    const dayDiff = Math.round((new Date(guessedKey+'T00:00:00Z').getTime() - new Date(dayKey+'T00:00:00Z').getTime())/86400000);
    const minuteOfDay = parseInt(p.hour,10)*60 + parseInt(p.minute,10);
    guess -= dayDiff*86400000 + minuteOfDay*60000;
  }
  return guess;
}
function sleepBounds(s){
  const start = new Date(s.date);

  return {start, end};
}
/* Canonical overlap calculation — every daily/range sleep total in the app must
   route through this (or sleepMinutesOnDay below, which is this for one
   calendar day). Never assign a whole session to its start date. */
function sleepMinutesInRange(s, rangeStartMs, rangeEndMs){
  const {start, end} = sleepBounds(s);
  const overlapStart = Math.max(start.getTime(), rangeStartMs);
  const overlapEnd = Math.min(end.getTime(), rangeEndMs);
  return Math.max(0, (overlapEnd-overlapStart)/60000);
}
/* Minutes of a sleep record that actually fall within a given Sydney calendar day —

function sleepMinutesOnDay(s, dayKey){
  const dayStart = sydMidnightUTC(dayKey);

}
/* state.sleeps plus a virtual record for any in-progress sleep, so a running

function effectiveSleepRecords(){
  const list = state.sleeps.slice();
  if(state.activeSleep){
    const elapsedMin = Math.max(0, Math.round((Date.now()-new Date(state.activeSleep.startAt).getTime())/60000));
    list.push({ id: state.activeSleep.id, date: state.activeSleep.startAt, endAt: new Date().toISOString(), mins: elapsedMin, label: inferSleepType(state.activeSleep.startAt), _active:true });
  }

function get7DayKeys(offsetWeeks){

function buildSleepWeek(dayKeys){

    const totalMin = overlapping.reduce((sum,s)=> sum+sleepMinutesOnDay(s,dayKey), 0);
    const napMin = overlapping.filter(s=>s.label==='nap').reduce((sum,s)=>sum+sleepMinutesOnDay(s,dayKey),0);

    const leftMin = breastfeeds.reduce((s,f)=>s+(f.leftMins||0),0);

      nursingMin, breastfeedCount:breastfeeds.length, leftMin, rightMin,

      formulaCount:formula.length, formulaMl: formula.reduce((s,f)=>s+(f.consumedMl||0),0),

const ASK_KNOWN_TYPES = ['lastEvent','countInRange','totalInRange','maxInRange','bestDay','growthChange','weekCompare','dayShowAll','unanswerable','unknown'];
const ASK_MEDICAL_PATTERN = /\b(enough milk|getting enough|low (milk )?supply|milk supply|reflux|dehydrat|overtired|is (this|that|she|it) normal|should i (be )?worry|is she (sick|ill|okay|ok)|diagnos|colic|allerg|intoleran|teething|constipat|underweight|overweight|failure to thrive)\b/i;

  if(range.kind==='yesterday'){ const yk=sydDateKey(now-86400000); return { startMs: sydMidnightUTC(yk), endMs: sydMidnightUTC(yk)+86400000, label:'yesterday' }; }

  if(range.kind==='lastWeek'){ const keys=get7DayKeys(1); return { startMs: sydMidnightUTC(keys[0]), endMs: sydMidnightUTC(keys[6])+86400000, label:'last week' }; }

  else { curB=buildNappyWeek(curKeys); prevB=buildNappyWeek(prevKeys); key='wetOut'; }

  if(curC.length<3 || prevC.length<3) return null;
  const curAvg = curC.reduce((s,b)=>s+b[key],0)/curC.length, prevAvg = prevC.reduce((s,b)=>s+b[key],0)/prevC.length;

const MONTH_NAMES_ASK = {january:0,february:1,march:2,april:3,may:4,june:5,july:6,august:7,september:8,october:9,november:10,december:11,
  jan:0,feb:1,mar:2,apr:3,jun:5,jul:6,aug:7,sep:8,sept:8,oct:9,nov:10,dec:11};
function parseAskDate(s){
  let m = s.match(/\b(\d{1,2})(?:st|nd|rd|th)?\s+(jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:t|tember)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)\b/i);
  if(!m) m = s.match(/\b(jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:t|tember)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)\s+(\d{1,2})(?:st|nd|rd|th)?\b/i);
  if(!m) return null;
  let day, monthName;
  if(/^\d/.test(m[1])){ day=parseInt(m[1],10); monthName=m[2]; } else { monthName=m[1]; day=parseInt(m[2],10); }
  const monthIdx = MONTH_NAMES_ASK[monthName.toLowerCase()];
  if(monthIdx==null || day<1 || day>31) return null;
  let year = new Date().getFullYear();
  const candidate = new Date(Date.UTC(year, monthIdx, day, 12));
  if(candidate.getTime() > Date.now()) year -= 1; // assume last year if the date hasn't happened yet this year
  return `${year}-${String(monthIdx+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
}
function detectAskRange(s){

  if(/\blast\s*week\b/.test(s)) return {kind:'lastWeek'};
  if(/\bthis\s*week\b/.test(s)) return {kind:'thisWeek'};
  if(/\btoday\b/.test(s)) return {kind:'today'};
  const d = parseAskDate(s);

}
function detectTimeOfDay(s){

  if(/\bmorning\b/.test(s)) return 'morning';
  if(/\bafternoon\b/.test(s)) return 'afternoon';

/* Fully local, deterministic intent classifier — no network call, no model in
   the loop at all. Pattern-matches the question into the same strict intent
   shapes the executors below expect. Covers the app's known question types;
   anything it can't confidently match falls through to "unknown" rather than
   guessing. */
function classifyAskIntentLocal(question){
  const s = question.toLowerCase().trim();

  if(/\bcompar\w*\b.*\bweek\b/.test(s) || (/\bthis week\b/.test(s) && /\blast week\b/.test(s))) return {type:'weekCompare'};

  if(/\b(weight|grown|growth|length|height|head)\b.*\b(chang|since birth|from birth)\b/.test(s)){
    let measure='weight';
    if(/\blength|height\b/.test(s)) measure='length';
    else if(/\bhead\b/.test(s)) measure='hc';
    return {type:'growthChange', measure};
  }

  if(/\bwhich day\b|\bbusiest day\b|\bmost (feeds|sleep|nappies|nappy changes)\b/.test(s)){
    let metric='feed';
    if(/\bsleep\b/.test(s)) metric='sleep';
    else if(/\bnapp(y|ies)\b/.test(s)) metric='nappy';
    return {type:'bestDay', metric};
  }

  if(/\blongest\b.*\bsleep\b|\bmax\w*\b.*\bsleep\b/.test(s)){
    return {type:'maxInRange', metric:'sleep', range: detectAskRange(s) || {kind:'thisWeek'}};
  }

  if(/\beverything\b|\bwhat happened\b/.test(s)){
    const d = parseAskDate(s);
    if(d) return {type:'dayShowAll', date:d};
  }

  if(/\bhow many\b/.test(s)){
    const timeOfDay = detectTimeOfDay(s);
    const range = detectAskRange(s) || {kind:'last24h'};
    if(/\bwet\b/.test(s)) return {type:'countInRange', metric:'nappy', subtype:'wet', range};
    if(/\bdirty\b|\bpoo\b/.test(s)) return {type:'countInRange', metric:'nappy', subtype:'dirty', range};
    if(/\bnapp(y|ies)\b/.test(s)) return {type:'countInRange', metric:'nappy', range};
    if(/\bfeed\w*\b|\btimes\b/.test(s)) return {type:'countInRange', metric:'feed', range, timeOfDay};
    if(/\bsleep\w*\b/.test(s)) return {type:'countInRange', metric:'sleep', range};
  }

  if(/\bhow much\b.*\bsleep\b/.test(s)) return {type:'totalInRange', metric:'sleep', range: detectAskRange(s) || {kind:'yesterday'}};
  if(/\bhow much\b.*\b(feed|nurs)\w*\b/.test(s)) return {type:'totalInRange', metric:'feed', range: detectAskRange(s) || {kind:'today'}};

  /* "last"/"latest" here means "most recent single event" — guarded against
     "how many"/"how much" phrasing above, since "in the last 24 hours" would
     otherwise be misread as a single-event lookup rather than a count. */
  if(/\b(last|latest)\b/.test(s) || /^when\b/.test(s)){
    if(/\b(poo|dirty|stool|bowel)\b/.test(s)) return {type:'lastEvent', metric:'nappy', subtype:'dirty'};
    if(/\bwet\b.*nappy|\bwee\b|\bpee\b/.test(s)) return {type:'lastEvent', metric:'nappy', subtype:'wet'};
    if(/\bnapp(y|ies)\b/.test(s)) return {type:'lastEvent', metric:'nappy'};
    if(/\btemp(erature)?\b/.test(s)) return {type:'lastEvent', metric:'temperature'};
    if(/\bweigh(t|ed|-in)?\b/.test(s)) return {type:'lastEvent', metric:'measurement', subtype:'weight'};
    if(/\blength\b/.test(s)) return {type:'lastEvent', metric:'measurement', subtype:'length'};
    if(/\bhead\b/.test(s)) return {type:'lastEvent', metric:'measurement', subtype:'hc'};
    if(/\b(vaccin|shot|jab|immunis)\w*\b/.test(s)) return {type:'lastEvent', metric:'vaccine'};
    if(/\bappointment\b/.test(s)) return {type:'lastEvent', metric:'appointment'};
    if(/\bmoment\b/.test(s)) return {type:'lastEvent', metric:'moment'};
    if(/\b(feed|fed|nurs|eat|ate|breastfe|bottle)\w*\b/.test(s)) return {type:'lastEvent', metric:'feed'};
    if(/\b(sleep|slept|nap|wake|woke)\w*\b/.test(s)) return {type:'lastEvent', metric:'sleep'};
  }

  return {type:'unknown'};
}

/* Interactive 7-bar chart. Pass segmentsFn for a stacked bar (nappies); omit it
   for a simple single-value bar (sleep/feeding). Every column — even empty
   ones — gets a full-height transparent tap target so short bars stay tappable. */
function buildBarChartSVG(buckets, dayKeys, todayKey, valueFn, opts){
  opts = opts || {};
  const W=340,H=140,padL=6,padR=6,padT=10,padB=22,barGap=6;
  const barW = (W-padL-padR-barGap*6)/7;
  const dark = isDarkMode();
  const values = buckets.map(b=> b.hasData ? valueFn(b) : 0);
  const maxV = Math.max(1, ...values);
  const labels = weekDayLabels(dayKeys, todayKey);
  const barColor = opts.barColor || (dark?'#F2A796':'#EC9384');
  const noDataColor = dark ? '#3D3544' : '#EDE3F2';
  const labelColor = dark ? '#EDE8F0' : '#332C3A';
  const textColor = dark ? '#83788F' : '#AFA8B7';
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="overflow:visible" font-family="Nunito, sans-serif" role="img" aria-label="7 day chart, tap a bar for details">`;
  buckets.forEach((b,i)=>{
    const x = padL + i*(barW+barGap);
    const isToday = b.dayKey===todayKey;
    const isActive = opts.activeIdx===i;
    if(!b.hasData){
      svg += `<rect x="${x.toFixed(1)}" y="${(H-padB-3).toFixed(1)}" width="${barW.toFixed(1)}" height="3" rx="1.5" fill="${noDataColor}"/>`;
    } else {
      const v = values[i];
      const hgt = Math.max(3, (v/maxV)*(H-padT-padB));
      const y = H-padB-hgt;
      const segs = opts.segmentsFn ? opts.segmentsFn(b) : null;
      if(segs){
        let cursor = H-padB;
        segs.forEach(seg=>{
          const segH = maxV>0 ? (seg.value/maxV)*(H-padT-padB) : 0;
          if(segH>0.3){ cursor -= segH; svg += `<rect x="${x.toFixed(1)}" y="${cursor.toFixed(1)}" width="${barW.toFixed(1)}" height="${segH.toFixed(1)}" rx="3" fill="${seg.color}" opacity="${isActive||isToday?1:0.75}"/>`; }
        });
      } else {
        svg += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${hgt.toFixed(1)}" rx="4" fill="${barColor}" opacity="${isActive?1:(isToday?0.9:0.6)}"/>`;
      }
      if(isActive) svg += `<rect x="${(x-1.5).toFixed(1)}" y="${(y-1.5).toFixed(1)}" width="${(barW+3).toFixed(1)}" height="${(H-padB-y+1.5).toFixed(1)}" rx="5" fill="none" stroke="${barColor}" stroke-width="1.5" opacity="0.6"/>`;
    }
    svg += `<rect data-idx="${i}" class="week-bar-tap" x="${x.toFixed(1)}" y="0" width="${barW.toFixed(1)}" height="${H-padB}" fill="transparent" style="cursor:pointer;"/>`;
    svg += `<text x="${(x+barW/2).toFixed(1)}" y="${H-6}" font-size="9" fill="${isToday?labelColor:textColor}" text-anchor="middle" font-weight="${isToday?800:600}">${labels[i]}</text>`;
  });
  svg += `</svg>`;
  return svg;
}

function computeDailyBrief(){

  const sleepMin24 = effectiveSleepRecords().reduce((s,x)=> s+sleepMinutesInRange(x, cutoff, Date.now()), 0);
  const feeds24 = state.feeds.map(normalizeFeed).filter(f=> new Date(f.date).getTime()>=cutoff);
  const nappies24 = state.nappies.filter(n=> new Date(n.date).getTime()>=cutoff);
  let wet24=0, dirty24=0; nappies24.forEach(n=>{ if(n.type==='wet'||n.type==='both') wet24++; if(n.type==='poo'||n.type==='both') dirty24++; });
  const lastWetNappy = state.nappies.filter(n=>n.type==='wet'||n.type==='both').sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
  const lastTemp = state.temperatures.slice().sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
  const recentVaccine = state.vaccines.filter(v=>v.givenDate && new Date(v.givenDate).getTime()>=cutoff)[0];
  const recentAppt = state.appointments.filter(a=> a.status==='completed' && new Date(a.date).getTime()>=cutoff)[0];
  const recentMoment = state.milestones.filter(m=> new Date(m.date).getTime()>=cutoff)[0];
  const recentMeasurement = state.measurements.filter(m=> new Date(m.date).getTime()>=cutoff).sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
  return { sleepMin24, feedCount24: feeds24.length, wet24, dirty24, lastWetNappy, lastTemp, recentVaccine, recentAppt, recentMoment, recentMeasurement };
}

  const daysInMonth = new Date(y, m, 0).getDate();
  const keys = [];
  for(let d=1; d<=daysInMonth; d++) keys.push(`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
  return keys;
}
function computeMonthAgeNote(yearMonth){
  const {start, end} = monthBoundsMs(yearMonth);
  const ageAtStart = ageAtDate(state.profile.birthDate, new Date(start).toISOString()).months;
  const ageAtEnd = ageAtDate(state.profile.birthDate, new Date(end-1).toISOString()).months;
  if(ageAtEnd > ageAtStart) return `Turned ${ageAtEnd} month${ageAtEnd===1?'':'s'} old this month`;
  return null;
}
function computeMonthGrowth(yearMonth, type){
  const {start, end} = monthBoundsMs(yearMonth);
  const all = state.measurements.filter(x=>x.type===type).sort((a,b)=>new Date(a.date)-new Date(b.date));
  const inMonth = all.filter(x=>{ const t=new Date(x.date).getTime(); return t>=start && t<end; });
  if(!inMonth.length) return null;
  const beforeMonth = all.filter(x=> new Date(x.date).getTime() < start);
  const first = inMonth[0], latest = inMonth[inMonth.length-1];
  const priorRef = beforeMonth.length ? beforeMonth[beforeMonth.length-1] : null;
  const ageM = ageMonthsDecimal(state.profile.birthDate, latest.date);
  const row = interpolateRow(TYPE_TO_TABLE[type], ageM);
  const score = Math.round(percentileScore(row, latest.value));
  return {
    first, latest, count: inMonth.length,
    changeInMonth: inMonth.length>=2 ? latest.value-first.value : null,
    changeFromPrior: priorRef ? latest.value-priorRef.value : null,
    percentile: score
  };
}
function computeMonthCare(yearMonth){
  const dayKeys = getMonthDayKeys(yearMonth);
  const todayKey = sydDateKey();
  const feedBuckets = buildFeedWeek(dayKeys), sleepBuckets = buildSleepWeek(dayKeys), nappyBuckets = buildNappyWeek(dayKeys);
  const avgFeeds = weekAverageExcludingToday(feedBuckets, 'babyFeedCount', todayKey);
  const avgSleep = weekAverageExcludingToday(sleepBuckets, 'totalMin', todayKey);
  const avgWet = weekAverageExcludingToday(nappyBuckets, 'wetOut', todayKey);
  const avgDirty = weekAverageExcludingToday(nappyBuckets, 'dirtyOut', todayKey);
  const longestSleepStretch = sleepBuckets.reduce((mx,b)=>Math.max(mx,b.longest||0),0);
  let longestSleepDay = null;
  sleepBuckets.forEach(b=>{ if(longestSleepStretch>0 && b.longest===longestSleepStretch) longestSleepDay=b.dayKey; });
  const loggedFeedDays = feedBuckets.filter(b=>b.hasData);
  const busiestFeedDay = loggedFeedDays.length ? loggedFeedDays.reduce((mx,b)=> b.babyFeedCount>(mx?mx.babyFeedCount:-1)?b:mx, null) : null;
  return { avgFeeds, avgSleep, avgWet, avgDirty, longestSleepStretch, longestSleepDay, busiestFeedDay,
    hasAnyData: feedBuckets.some(b=>b.hasData) || sleepBuckets.some(b=>b.hasData) || nappyBuckets.some(b=>b.hasData) };
}
function computeMonthHealth(yearMonth){
  const {start, end} = monthBoundsMs(yearMonth);
  const inRange = d => { const t=new Date(d).getTime(); return t>=start && t<end; };
  const apptsCompleted = state.appointments.filter(a=>a.status==='completed' && inRange(a.date));
  const vaccinesGiven = state.vaccines.filter(v=>v.givenDate && inRange(v.givenDate));
  const tempsInMonth = state.temperatures.filter(t=>inRange(t.date));
  const highTempsCount = tempsInMonth.filter(t=>t.tempC>=38.0).length;
  return { apptsCompleted, vaccinesGiven, tempsCount: tempsInMonth.length, highTempsCount };
}
function computeMonthMoments(yearMonth){
  const {start, end} = monthBoundsMs(yearMonth);
  return state.milestones.filter(m=>{ const t=new Date(m.date).getTime(); return t>=start && t<end; }).sort((a,b)=>new Date(a.date)-new Date(b.date));
}
function computeMonthComparison(yearMonth){
  const curKeys = getMonthDayKeys(yearMonth), prevKeys = getMonthDayKeys(shiftYearMonth(yearMonth,-1));
  const todayKey = sydDateKey();
  const parts = [];
  [['sleep','totalMin',buildSleepWeek],['feed','babyFeedCount',buildFeedWeek],['nappy','wetOut',buildNappyWeek]].forEach(([label,key,builder])=>{
    const curB = builder(curKeys).filter(b=>b.dayKey!==todayKey && b.hasData);
    const prevB = builder(prevKeys).filter(b=>b.hasData);
    if(curB.length<5 || prevB.length<5) return;
    const curAvg = curB.reduce((s,b)=>s+b[key],0)/curB.length;
    const prevAvg = prevB.reduce((s,b)=>s+b[key],0)/prevB.length;
    const diff = curAvg-prevAvg;
    if(label==='sleep' && Math.abs(diff)>=30) parts.push(`Average daily sleep ${diff>0?'increased':'decreased'} from ${fmtDuration(prevAvg)} to ${fmtDuration(curAvg)} compared with the previous month.`);
    if(label==='feed' && Math.abs(diff)>=1.0) parts.push(`Feeding frequency ${diff>0?'increased':'decreased'} from ${prevAvg.toFixed(1)}/day to ${curAvg.toFixed(1)}/day compared with the previous month.`);
    if(label==='nappy' && Math.abs(diff)>=1.0) parts.push(`Wet nappies ${diff>0?'increased':'decreased'} from ${prevAvg.toFixed(1)}/day to ${curAvg.toFixed(1)}/day compared with the previous month.`);
  });
  return parts;
}

function dueVaccinesNearDate(dateISO, windowDays){
  windowDays = windowDays||30;
  return state.vaccines.filter(v=>{
    if(v.givenDate || v.notApplicable || v.hidden) return false;
    const due = vaccineDueDate(v);
    if(!due) return false;
    return Math.abs((due-new Date(dateISO))/86400000) <= windowDays;
  });
}

let exportRangeKey = '7d';
let exportCustomStart = null, exportCustomEnd = null;
function computeExportRange(){
  const now = new Date();
  if(exportRangeKey==='24h') return {start:new Date(now-86400000), end:now};
  if(exportRangeKey==='7d') return {start:new Date(now-7*86400000), end:now};
  if(exportRangeKey==='birth') return {start:new Date(state.profile.birthDate), end:now};
  if(exportRangeKey==='custom' && exportCustomStart && exportCustomEnd) return {start:new Date(exportCustomStart), end:new Date(exportCustomEnd+'T23:59:59')};
  return {start:new Date(now-7*86400000), end:now};
}
function compileHealthSummary(start, end){
  const inRange = d => { const t=new Date(d).getTime(); return t>=start.getTime() && t<=end.getTime(); };
  const p = state.profile;
  const corrected = correctedAgeInfo();
  const weightList = state.measurements.filter(m=>m.type==='weight').sort((a,b)=>new Date(a.date)-new Date(b.date));
  const birthWeight = weightList[0];
  const latestWeight = weightList[weightList.length-1];
  const measurementsInRange = state.measurements.filter(m=>inRange(m.date)).sort((a,b)=>new Date(a.date)-new Date(b.date));
  const feedsInRange = state.feeds.map(normalizeFeed).filter(f=>inRange(f.date));
  /* Sleep uses the same range-overlap logic as everywhere else — a session
     merely needs to overlap [start,end] to contribute its in-range minutes;
     "longest stretch" still reflects each overlapping session's full duration. */
  const sleepsOverlapping = effectiveSleepRecords().filter(s=> sleepMinutesInRange(s, start.getTime(), end.getTime()) > 0.5);
  const nappiesInRange = state.nappies.filter(n=>inRange(n.date));
  const tempsInRange = state.temperatures.filter(t=>inRange(t.date));
  const healthInRange = state.healthRecords.filter(r=>inRange(r.date));
  const vaccinesGiven = state.vaccines.filter(v=>v.givenDate).sort((a,b)=>new Date(a.givenDate)-new Date(b.givenDate));
  const vaccinesUpcoming = state.vaccines.filter(v=>!v.givenDate && !v.notApplicable && !v.hidden).sort((a,b)=>a.dueMonths-b.dueMonths);
  const apptsInRange = state.appointments.filter(a=>inRange(a.date));
  const apptsUpcoming = state.appointments.filter(a=>(a.status||'upcoming')==='upcoming' && new Date(a.date)>=new Date()).sort((a,b)=>new Date(a.date)-new Date(b.date));

  const days = Math.max(1, (end-start)/86400000);
  const breastfeeds = feedsInRange.filter(f=>f.type==='breastfeeding');
  const totalNursingMin = breastfeeds.reduce((s,f)=>s+(f.totalMins||0),0);
  const formulaMl = feedsInRange.filter(f=>f.type==='formula').reduce((s,f)=>s+(f.consumedMl||0),0);
  const expressedMl = feedsInRange.filter(f=>f.type==='expressed').reduce((s,f)=>s+(f.consumedMl||0),0);
  const pumpingMl = feedsInRange.filter(f=>f.type==='pumping').reduce((s,f)=>s+(f.pumpTotalMl||0),0);
  const totalSleepMin = sleepsOverlapping.reduce((s,x)=> s+sleepMinutesInRange(x, start.getTime(), end.getTime()), 0);
  const longestSleep = sleepsOverlapping.reduce((mx,x)=>Math.max(mx,x.mins||0),0);
  let wetCount=0, dirtyCount=0; nappiesInRange.forEach(n=>{ if(n.type==='wet'||n.type==='both') wetCount++; if(n.type==='poo'||n.type==='both') dirtyCount++; });

  return { p, corrected, birthWeight, latestWeight, measurementsInRange, feedsInRange, feedsPerDay: feedsInRange.length/days,
    totalNursingMin, formulaMl, expressedMl, pumpingMl, totalSleepMin, sleepPeriods: sleepsOverlapping.length, longestSleep,
    avgSleepPerDay: totalSleepMin/days, wetCount, dirtyCount, wetPerDay: wetCount/days, dirtyPerDay: dirtyCount/days,
    tempsInRange, healthInRange, vaccinesGiven, vaccinesUpcoming, apptsInRange, apptsUpcoming, start, end };
}

/* ---------------- Backup & Restore (data helpers — UI lives in Settings) ---------------- */
function buildBackupObject(){
  return { backupVersion: 1, createdAt: new Date().toISOString(), appData: buildPayload() };
}
function downloadBackupFile(){
  const backup = buildBackupObject();
  const json = JSON.stringify(backup, null, 2);
  const blob = new Blob([json], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateStr = todayDateInput();
  const nameSlug = (state.profile.name||'baby').toLowerCase().replace(/[^a-z0-9]+/g,'-');
  a.href = url;
  a.download = `${nameSlug}-growth-log-backup-${dateStr}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function validateBackup(parsed){
  if(!parsed || typeof parsed!=='object') return {ok:false, error:"This doesn't appear to be a valid Baby Tracker backup."};
  if(typeof parsed.backupVersion !== 'number') return {ok:false, error:"This doesn't appear to be a valid Baby Tracker backup."};
  if(parsed.backupVersion > 1) return {ok:false, error:"This backup was created by a newer app version and can't be restored here yet."};
  if(!parsed.appData || typeof parsed.appData !== 'object') return {ok:false, error:"The backup file appears to be damaged."};
  if(!parsed.appData.profile || !parsed.appData.profile.name || !parsed.appData.profile.birthDate) return {ok:false, error:"The backup file appears to be damaged."};
  return {ok:true};
}

function readAndCompressImage(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>h){ if(w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; } }
        else { if(h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function ageAtDate(birthISO, atISO){
  const birth = new Date(birthISO), at = new Date(atISO);
  let ms = at-birth; if(ms<0) ms=0;
  const days = Math.floor(ms/86400000);
  const weeks = Math.floor(days/7), remDays = days%7;
  const months = (at.getFullYear()-birth.getFullYear())*12 + (at.getMonth()-birth.getMonth()) - (at.getDate()<birth.getDate()?1:0);
  return { weeks, remDays, months: Math.max(0,months) };
}
function momentAgeLabel(dateISO){
  const a = ageAtDate(state.profile.birthDate, dateISO);
  return a.weeks<12 ? `${a.weeks}w ${a.remDays}d old` : `${a.months} mo old`;
}
function momentMonthLabel(n){ return n===0 ? 'Newborn' : n===1 ? '1 month' : `${n} months`; }

  rest.forEach(m=>{

    </div>` : `<div class="empty">No moments saved yet.<br>Capture your first memory 🌱</div>`}

    ${order.length ? order.map(bucket=>`
      <div style="margin-bottom:6px;">
        <div class="section-header" style="margin-top:16px;">${momentMonthLabel(bucket)}</div>
        <div class="gallery-grid">
          ${groups[bucket].map(m=>`
            <div class="gallery-card" data-viewmoment="${m.id}" style="cursor:pointer;">
              ${m.photo ? `<img src="${m.photo}" alt="">` : `<div class="ph">⭐</div>`}
              <div class="cap">
                <div class="t">${escapeHtml(m.title)}</div>
                <div class="s">${fmtDate(m.date)} · ${momentAgeLabel(m.date)}</div>
              </div>
            </div>`).join('')}
        </div>
      </div>`).join('') : ''}
  `;
}
function bindMilestones(){
  const addLink = document.getElementById('addMomentLink');
  if(addLink) addLink.addEventListener('click', ()=> openSheet('moment'));
  document.querySelectorAll('[data-viewmoment]').forEach(el=>{
    el.addEventListener('click', ()=> openMomentViewer(el.dataset.viewmoment));
  });
}

const DELETE_MAP = {
  measurement: {arr:'measurements', key:'measurements'},
  feed: {arr:'feeds', key:'feeds'},
  sleep: {arr:'sleeps', key:'sleep'},
  milestone: {arr:'milestones', key:'milestones'},
  vaccine: {arr:'vaccines', key:'vaccines'},
  appointment: {arr:'appointments', key:'appointments'},
  nappy: {arr:'nappies', key:'nappies'},
  temperature: {arr:'temperatures', key:'temperatures'},
  healthRecord: {arr:'healthRecords', key:'healthRecords'}
};
function bindDeletes(){
  document.querySelectorAll('button.del, button.del-x').forEach(b=>{
    b.addEventListener('click', (e)=>{
      e.stopPropagation();
      const id=b.dataset.id, kind=b.dataset.kind;
      if(!DELETE_MAP[kind]) return;
      openEntryActions(kind, id);
    });
  });
}

/* ---------------- Onboarding ---------------- */
function renderOnboard(){
  return `
    <div class="onboard">
      <div class="mark">🌷🍼🌙</div>
      <h1>Let's set up her growth log!</h1>
      <p class="sub">This stays synced between both of your phones. Add her details to get started.</p>
      ${lastLoadDiagnostic ? `
      <div class="note" style="background:var(--surface-muted);border-radius:var(--radius-control);padding:12px 14px;margin-bottom:14px;text-align:left;">
        <b>Before you continue:</b> if you're expecting to see an existing baby's data here, do not proceed — this means the app looked and found nothing under your account. Check the details below against your Firebase console first.<br><br>
        Signed in as: <b>${escapeHtml(lastLoadDiagnostic.signedInAs)}</b><br>
        Account UID: <span style="font-family:monospace;font-size:10.5px;">${escapeHtml(lastLoadDiagnostic.uid)}</span><br>
        Looked at: <span style="font-family:monospace;font-size:10.5px;">${escapeHtml(lastLoadDiagnostic.projectId)} / ${escapeHtml(lastLoadDiagnostic.docPath)}</span><br>
        Document found: <b>${lastLoadDiagnostic.docExists ? 'Yes, but empty/unreadable' : 'No'}</b>
      </div>
      <button class="ql-link" id="obSignOutInstead">Wrong account? Sign out</button>
      ` : ''}
      <label>Baby's name</label>
      <input type="text" id="obName" placeholder="e.g. Amara">
      <label>Date of birth</label>
      <input type="date" id="obDob" value="${todayDateInput()}">
      <button class="btn" id="obSave">Start tracking 🌱</button>
      <p class="note">Growth percentiles use WHO standards for girls. Data syncs automatically to any signed-in family account.</p>
    </div>
  `;
}
function bindOnboard(){
  const soi = document.getElementById('obSignOutInstead');
  if(soi) soi.addEventListener('click', async ()=>{ try{ await signOutUser(); } catch(e){ console.error(e); } });
  document.getElementById('obSave').addEventListener('click', async ()=>{
    const name = document.getElementById('obName').value.trim();
    const dob = document.getElementById('obDob').value;
    if(!name || !dob){ alert('Please enter a name and date of birth.'); return; }
    state.profile = {name, sex:'female', birthDate:new Date(dob).toISOString()};
    await saveKey('profile', state.profile);
    render();
  });
}

/* ---------------- Boot ---------------- */
function resolveTheme(){
  const pref = state.prefs && state.prefs.theme;
  if(pref==='light' || pref==='dark') return pref;
  return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
}
function applyTheme(){
  document.documentElement.setAttribute('data-theme', resolveTheme());
}
function isDarkMode(){ return document.documentElement.getAttribute('data-theme')==='dark'; }
if(window.matchMedia){
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{
    if(!(state.prefs && (state.prefs.theme==='light' || state.prefs.theme==='dark'))){
      applyTheme();
      if(document.getElementById('main')) renderMain();
    }
  });
}
let bootStallTimer = null;
function boot(){
  applyTheme();
  authReady = false; authUser = null; initialDataLoaded = false;
  const app = document.getElementById('app');
  app.innerHTML = renderLoadingScreen();

  clearTimeout(bootStallTimer);
  bootStallTimer = setTimeout(()=>{
    if(!authReady){
      app.innerHTML = renderStartupError("This is taking longer than expected — Firebase may not have responded.");
      bindStartupError();
    }
  }, 9000);

  try{
    initFirebase();
  }catch(e){
    console.error('Firebase init failed', e);
    clearTimeout(bootStallTimer);
    app.innerHTML = renderStartupError(e.message || 'Could not start Firebase.');
    bindStartupError();
    return;
  }

  try{
    fbAuth.onAuthStateChanged(user=>{
      clearTimeout(bootStallTimer);
      authReady = true;
      authUser = user;
      if(user){
        initialDataLoaded = false;
        dataLoadError = null;
        render(); /* loading while first snapshot arrives */
        startRealtimeSync();
      } else {
        stopRealtimeSync();
        initialDataLoaded = false;
        dataLoadError = null;
        applyRemote({}); /* clear in-memory data on sign-out */
        render(); /* login screen */
      }
    }, e=>{
      console.error('Auth state error', e);
      clearTimeout(bootStallTimer);
      app.innerHTML = renderStartupError(friendlyAuthError(e));
      bindStartupError();
    });
  }catch(e){
    console.error('onAuthStateChanged threw', e);
    clearTimeout(bootStallTimer);
    app.innerHTML = renderStartupError(e.message || 'Could not check sign-in status.');
    bindStartupError();
  }
}
function bindStartupError(){
  const btn = document.getElementById('retryBootBtn');
  if(btn) btn.addEventListener('click', ()=> location.reload());
}
boot();
</script>
