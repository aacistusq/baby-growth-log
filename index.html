<!DOCTYPE html>
<html lang="en">
<head> 
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Growth Log</title> 
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#F6F1FB;
    --sky2:#FDF1F3;
    --card:#FFFFFF;
    --ink:#4A3B52;
    --ink-soft:#8B7E93;
    --lavender:#B79FD1;
    --lavender-deep:#8E6FB0;
    --blush:#F4B8C1;
    --butter:#F6D186;
    --mint:#8FCDBB;
    --mint-deep:#4F9E8B;
    --coral:#EC9384;
    --coral-deep:#D96F5D;
    --line:#EDE3F2;
    --shadow: 0 6px 18px rgba(142,111,176,0.10), 0 1px 3px rgba(142,111,176,0.08);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:linear-gradient(180deg, var(--sky) 0%, var(--sky2) 100%);
    color:var(--ink);
    font-family:'Nunito',sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  header.top{
    padding:22px 20px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:transparent;
    position:sticky;
    top:0;
    z-index:10;
    backdrop-filter: blur(6px);
  }
  header.top .brand{
    font-family:'Baloo 2',cursive;
    font-weight:700;
    font-size:19px;
    color:var(--lavender-deep);
    display:flex;
    align-items:center;
    gap:6px;
  }
  header.top .age{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--ink-soft);
    background:var(--card);
    padding:5px 10px;
    border-radius:20px;
    box-shadow:var(--shadow);
  }
  main{
    flex:1;
    padding:6px 18px 104px;
    overflow-y:auto;
  }
  .hero{ margin:10px 0 18px; }
  .hero h1{
    font-family:'Baloo 2',cursive;
    font-size:30px;
    font-weight:700;
    margin:0 0 4px;
    line-height:1.1;
    color:var(--ink);
  }
  .hero p{ margin:0; color:var(--ink-soft); font-size:14px; }
  .card{
    background:var(--card);
    border-radius:22px;
    padding:18px 18px 20px;
    margin-bottom:16px;
    box-shadow:var(--shadow);
  }
  .card h2{
    font-family:'Baloo 2',cursive;
    font-size:18px;
    font-weight:600;
    margin:0 0 12px;
    color:var(--ink);
    display:flex;
    align-items:center;
    gap:7px;
  }
  .stat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .stat{
    background:var(--sky);
    border-radius:16px;
    padding:12px 8px;
    text-align:center;
  }
  .stat .val{ font-family:'IBM Plex Mono',monospace; font-size:18px; font-weight:500; color:var(--lavender-deep); display:block; }
  .stat .lbl{ font-size:10px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; display:block; margin-top:3px; }
  .stat .pct{ font-size:9.5px; color:var(--ink-soft); display:block; margin-top:3px; }
  .empty{
    color:var(--ink-soft); font-size:13px; text-align:center; padding:20px 10px;
    background:var(--sky); border-radius:16px;
  }
  .row-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 2px; border-bottom:1px dashed var(--line); font-size:13.5px;
  }
  .row-item:last-child{ border-bottom:none; }
  .row-item .main{ font-weight:700; }
  .row-item .sub{ color:var(--ink-soft); font-size:11.5px; }
  .row-item button.del{ background:none; border:none; color:var(--coral-deep); font-size:12px; cursor:pointer; padding:4px 6px; font-weight:700; }
  label{
    display:block; font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em;
    color:var(--ink-soft); margin:14px 0 6px;
  }
  label:first-child{ margin-top:0; }
  input,select,textarea{
    width:100%; padding:12px 14px; border:2px solid var(--line); border-radius:14px;
    background:var(--sky); font-family:'Nunito',sans-serif; font-size:15px; color:var(--ink);
  }
  input:focus,select:focus,textarea:focus{ outline:none; border-color:var(--lavender); }
  .seg{ display:flex; gap:8px; }
  .seg button{
    flex:1; padding:11px 6px; border:2px solid var(--line); border-radius:14px;
    background:var(--sky); font-family:'Nunito',sans-serif; font-weight:700; font-size:13px;
    color:var(--ink-soft); cursor:pointer;
  }
  .seg button.active{ background:var(--lavender); border-color:var(--lavender); color:#fff; }
  .btn{
    width:100%; padding:14px; border-radius:16px; border:none;
    background:var(--lavender-deep); color:#fff; font-family:'Baloo 2',cursive; font-size:16px;
    font-weight:600; cursor:pointer; margin-top:18px; box-shadow:0 4px 14px rgba(142,111,176,.35);
  }
  .btn:active{ transform:scale(0.98); }
  .btn.secondary{ background:var(--mint-deep); box-shadow:0 4px 14px rgba(79,158,139,.3); }
  .btn.ghost{ background:transparent; color:var(--lavender-deep); border:2px dashed var(--lavender); box-shadow:none; }
  nav.bottom{
    position:sticky; bottom:0; display:flex; background:var(--card);
    border-radius:24px 24px 0 0; box-shadow:0 -4px 18px rgba(142,111,176,.14);
    padding:8px 4px calc(6px + env(safe-area-inset-bottom)); z-index:10;
  }
  nav.bottom button{
    flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center;
    gap:2px; padding:6px 1px; color:var(--ink-soft); cursor:pointer; font-family:'Nunito',sans-serif;
    font-weight:700; font-size:9.5px;
  }
  nav.bottom button svg{ width:19px; height:19px; }
  nav.bottom button.active{ color:var(--lavender-deep); }
  nav.bottom button.active svg{ stroke:var(--lavender-deep); }
  .tabs{ display:flex; gap:8px; margin-bottom:16px; }
  .tabs button{
    padding:8px 14px; border-radius:20px; border:2px solid var(--line); background:var(--card);
    font-size:12.5px; font-weight:700; color:var(--ink-soft); cursor:pointer;
  }
  .tabs button.active{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .legend{ display:flex; gap:12px; flex-wrap:wrap; margin-top:10px; font-size:10.5px; color:var(--ink-soft); }
  .legend span{ display:inline-flex; align-items:center; gap:5px; }
  .legend i{ width:9px; height:9px; border-radius:50%; display:inline-block; }
  .onboard{ display:flex; flex-direction:column; justify-content:center; min-height:100vh; padding:32px 26px; }
  .onboard .mark{ font-size:34px; margin-bottom:6px; }
  .onboard h1{ font-family:'Baloo 2',cursive; font-size:30px; font-weight:700; line-height:1.15; margin:0 0 8px; color:var(--ink); }
  .onboard p.sub{ color:var(--ink-soft); font-size:14px; margin:0 0 26px; }
  .toast{
    position:fixed; bottom:96px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; padding:10px 18px; border-radius:20px; font-size:13px;
    font-weight:700; opacity:0; transition:opacity .25s, transform .25s; pointer-events:none;
    max-width:90%; text-align:center; z-index:50;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .fieldrow{ display:flex; gap:10px; }
  .fieldrow > div{ flex:1; }
  .note{ font-size:11px; color:var(--ink-soft); margin-top:8px; line-height:1.55; }
  .badge{
    display:inline-block; padding:3px 10px; border-radius:20px; font-size:10.5px; font-weight:800;
    text-transform:uppercase; letter-spacing:.03em;
  }
  .badge.good{ background:rgba(143,205,187,.35); color:var(--mint-deep); }
  .badge.watch{ background:rgba(246,209,134,.4); color:#96742A; }
  .badge.flag{ background:rgba(236,147,132,.35); color:var(--coral-deep); }
  .narrative{
    background:var(--sky); border-radius:16px; padding:14px 16px; margin-top:12px; font-size:13.5px; line-height:1.55;
  }
  .narrative .head{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .chip{
    display:inline-flex; align-items:center; gap:4px; padding:4px 10px; border-radius:20px; font-size:10.5px; font-weight:800;
  }
  .chip.due{ background:rgba(246,209,134,.4); color:#96742A; }
  .chip.given{ background:rgba(143,205,187,.35); color:var(--mint-deep); }
  .chip.overdue{ background:rgba(236,147,132,.35); color:var(--coral-deep); }
  .divider-cute{ text-align:center; color:var(--lavender); font-size:12px; letter-spacing:.3em; margin:6px 0 14px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------------- WHO Growth Standards: Girls, 0-24 months ---------------- *
 * columns per month: [3rd, 15th, 50th, 85th, 97th]                          *
 * Source: WHO Child Growth Standards (2006), transcribed official tables    */
const WHO_GIRLS = {

    [7.8,8.7,9.8,11.2,12.5],[8.0,8.8,10.0,11.4,12.7],[8.2,9.0,10.2,11.6,13.0],[8.3,9.2,10.4,11.9,13.3],
    [8.5,9.4,10.6,12.1,13.5],[8.7,9.6,10.9,12.4,13.8],[8.8,9.8,11.1,12.6,14.1],[9.0,9.9,11.3,12.8,14.3],
    [9.2,10.1,11.5,13.1,14.6]
  ],
  length_cm: [
    [45.6,47.2,49.1,51.1,52.7],[50.0,51.7,53.7,55.7,57.4],[53.2,55.0,57.1,59.2,60.9],[55.8,57.6,59.8,62.0,63.8],
    [58.0,59.8,62.1,64.3,66.2],[59.9,61.7,64.0,66.3,68.2],[61.5,63.4,65.7,68.1,70.0],[62.9,64.9,67.3,69.7,71.6],
    [64.3,66.3,68.7,71.2,73.2],[65.6,67.6,70.1,72.6,74.7],[66.8,68.9,71.5,74.0,76.1],[68.0,70.2,72.8,75.4,77.5],
    [69.2,71.3,74.0,76.7,78.9],[70.3,72.5,75.2,77.9,80.2],[71.3,73.6,76.4,79.2,81.4],[72.4,74.7,77.5,80.3,82.7],
    [73.3,75.7,78.6,81.5,83.9],[74.3,76.7,79.7,82.6,85.0],[75.2,77.7,80.7,83.7,86.2],[76.2,78.7,81.7,84.8,87.3],
    [77.0,79.6,82.7,85.8,88.4],[77.9,80.5,83.7,86.8,89.4],[78.7,81.4,84.6,87.8,90.5],[79.6,82.2,85.5,88.8,91.5],
    [80.3,83.1,86.4,89.8,92.5]
  ],
  hc_cm: [
    [31.7,32.7,33.9,35.1,36.1],[34.3,35.3,36.5,37.8,38.8],[36.0,37.0,38.3,39.5,40.5],[37.2,38.2,39.5,40.8,41.9],
    [38.2,39.3,40.6,41.9,43.0],[39.0,40.1,41.5,42.8,43.9],[39.7,40.8,42.2,43.5,44.6],[40.4,41.5,42.8,44.2,45.3],
    [40.9,42.0,43.4,44.7,45.9],[41.3,42.4,43.8,45.2,46.3],[41.7,42.8,44.2,45.6,46.8],[42.0,43.2,44.6,46.0,47.1],
    [42.3,43.5,44.9,46.3,47.5],[42.6,43.8,45.2,46.6,47.7],[42.9,44.0,45.4,46.8,48.0],[43.1,44.2,45.7,47.1,48.2],
    [43.3,44.4,45.9,47.3,48.5],[43.5,44.6,46.1,47.5,48.7],[43.6,44.8,46.2,47.7,48.8],[43.8,45.0,46.4,47.8,49.0],
    [44.0,45.1,46.6,48.0,49.2],[44.1,45.3,46.7,48.2,49.4],[44.3,45.4,46.9,48.3,49.5],[44.4,45.6,47.0,48.5,49.7],
    [44.6,45.7,47.2,48.6,49.8]
  ]
};
const PCT_COLORS = ['#EDE3F2','#D8C6E6','#B79FD1','#D8C6E6','#EDE3F2'];

/* ---------------- Default vaccine template (generic / WHO EPI-style) ---------------- *
 * Ages are a common starting point only — always follow your own              *
 * pediatrician's schedule, which varies by country.                           */
const DEFAULT_VACCINES = [
  {name:'Hepatitis B (dose 1)', dueMonths:0},
  {name:'BCG', dueMonths:0},
  {name:'DTaP / Pentavalent (dose 1)', dueMonths:1.5},
  {name:'Polio (dose 1)', dueMonths:1.5},
  {name:'Pneumococcal (dose 1)', dueMonths:1.5},
  {name:'Rotavirus (dose 1)', dueMonths:1.5},
  {name:'DTaP / Pentavalent (dose 2)', dueMonths:2.5},
  {name:'Polio (dose 2)', dueMonths:2.5},
  {name:'Pneumococcal (dose 2)', dueMonths:2.5},
  {name:'Rotavirus (dose 2)', dueMonths:2.5},
  {name:'DTaP / Pentavalent (dose 3)', dueMonths:3.5},
  {name:'Polio (dose 3)', dueMonths:3.5},
  {name:'Pneumococcal (dose 3)', dueMonths:3.5},
  {name:'Measles (dose 1)', dueMonths:9},
  {name:'MMR (dose 1)', dueMonths:12},
  {name:'Hepatitis A', dueMonths:12},
  {name:'Varicella', dueMonths:12},
  {name:'DTaP booster', dueMonths:18},
];

/* ---------------- Storage: Firestore REST (no SDK, no login) ---------------- */
const firebaseConfig = {
  apiKey: "AIzaSyC_fEk--Wq6bFGa7Sgon5Vz4j5wjuO6f7M",
  authDomain: "baby-growth-log.firebaseapp.com",
  projectId: "baby-growth-log",
  storageBucket: "baby-growth-log.firebasestorage.app",
  messagingSenderId: "747639865841",
  appId: "1:747639865841:web:2aad3330b75c3215d8c450"
};
const FS_DOC = `https://firestore.googleapis.com/v1/projects/${firebaseConfig.projectId}/databases/(default)/documents/appdata/family`;
const FS_KEY = firebaseConfig.apiKey;

function buildPayload(){
  return {
    profile: state.profile,
    measurements: state.measurements,
    feeds: state.feeds,
    sleeps: state.sleeps,
    milestones: state.milestones,
    vaccines: state.vaccines,
    appointments: state.appointments
  };
}
async function firestoreGet(){
  const res = await fetch(`${FS_DOC}?key=${FS_KEY}`);
  if(res.status===404) return null;
  if(!res.ok) throw new Error('Firestore GET failed: '+res.status);
  const doc = await res.json();
  const raw = doc.fields && doc.fields.json && doc.fields.json.stringValue;
  return raw ? JSON.parse(raw) : null;
}
async function firestorePatch(payload){
  const body = { fields: { json: { stringValue: JSON.stringify(payload) } } };
  const res = await fetch(`${FS_DOC}?key=${FS_KEY}&updateMask.fieldPaths=json`, {
    method:'PATCH',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body)
  });
  if(!res.ok) throw new Error('Firestore PATCH failed: '+res.status);
}
let lastSnapshotJSON = null;
async function saveKey(key, value){
  try{
    const payload = buildPayload();
    await firestorePatch(payload);
    lastSnapshotJSON = JSON.stringify(payload);
  }catch(e){ console.error('save failed', key, e); toast('Sync error — check your connection'); }
}
function applyRemote(remote){
  state.profile = remote.profile || null;
  state.measurements = remote.measurements || [];
  state.feeds = remote.feeds || [];
  state.sleeps = remote.sleeps || [];
  state.milestones = remote.milestones || [];
  state.vaccines = remote.vaccines || [];
  state.appointments = remote.appointments || [];
}
function safeRerender(){
  if(!state.profile){ render(); return; }
  const ae = document.activeElement;
  const isTyping = ae && ['INPUT','TEXTAREA','SELECT'].includes(ae.tagName);
  if(isTyping) return; // don't clobber an in-progress edit
  if(document.querySelector('nav.bottom')) renderMain();
  else render();
}
async function pollNow(){
  try{
    const remote = await firestoreGet();
    if(!remote) return;
    const remoteJSON = JSON.stringify(remote);
    if(remoteJSON !== lastSnapshotJSON){
      lastSnapshotJSON = remoteJSON;
      applyRemote(remote);
      safeRerender();
    }
  }catch(e){ console.error('poll failed', e); }
}
function startPolling(){
  setInterval(()=>{ if(document.visibilityState==='visible') pollNow(); }, 6000);
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') pollNow(); });
}

/* ---------------- State ---------------- */
let state = {
  profile: null,
  measurements: [],
  feeds: [],
  sleeps: [],
  milestones: [],
  vaccines: [],
  appointments: []
};
let currentView = 'home';
let currentGrowthTab = 'weight';

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function fmtDate(d){ return new Date(d).toLocaleDateString(undefined,{month:'short',day:'numeric'}); }
function fmtDateTime(d){ return new Date(d).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}); }
function fmtDateFull(d){ return new Date(d).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'}); }
function todayInput(){ const d=new Date(); return d.toISOString().slice(0,16); }

function ageParts(birthISO){
  const birth = new Date(birthISO); const now = new Date();
  let ms = now-birth; if(ms<0) ms=0;
  const days = Math.floor(ms/86400000);
  const weeks = Math.floor(days/7); const remDays = days%7;
  const months = (now.getFullYear()-birth.getFullYear())*12 + (now.getMonth()-birth.getMonth()) - (now.getDate()<birth.getDate()?1:0);
  return {days, weeks, remDays, months: Math.max(0,months)};
}
function ageLabelShort(birthISO){
  const a = ageParts(birthISO);
  if(a.weeks < 12) return `${a.weeks}w ${a.remDays}d`;
  return `${a.months} mo`;
}
function ageMonthsDecimal(birthISO, atISO){
  const birth = new Date(birthISO); const at = new Date(atISO||Date.now());
  return Math.max(0,(at-birth)/(1000*60*60*24*30.4375));
}

function toast(msg){
  const t = document.getElementById('toast'); if(!t) return;
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ---------------- Percentile logic ---------------- */
function bandIndex(type, ageMonths, value){
  const table = WHO_GIRLS[type];
  const idx = Math.min(24, Math.max(0, Math.round(ageMonths)));
  const row = table[idx];
  if(value < row[0]) return 0;
  if(value < row[1]) return 1;
  if(value < row[2]) return 2;
  if(value < row[3]) return 3;
  if(value < row[4]) return 4;
  return 5;
}
const BAND_LABELS = ['below 3rd','3rd–15th','15th–50th','50th–85th','85th–97th','above 97th'];
const TYPE_TO_TABLE = {weight:'weight_kg', length:'length_cm', hc:'hc_cm'};

function growthNarrative(type){
  const list = state.measurements.filter(m=>m.type===type).sort((a,b)=>new Date(a.date)-new Date(b.date));
  if(!list.length) return null;
  const tableKey = TYPE_TO_TABLE[type];
  const latest = list[list.length-1];
  const m = ageMonthsDecimal(state.profile.birthDate, latest.date);
  const bi = bandIndex(tableKey, m, latest.value);
  const label = BAND_LABELS[bi];
  const noun = type==='weight'?'weight':type==='length'?'length':'head circumference';

  let level, verdict, msg;
  if(bi===0){
    level='flag'; verdict='On the lower end';
    msg = `${state.profile.name}'s latest ${noun} (${latest.value}${unitFor(type)}) sits below the 3rd percentile for her age. That band is designed to hold about 3 in 100 healthy babies, so it isn't automatically a problem on its own — but it's worth flagging at her next checkup, especially if this is new or she's been trending down.`;
  } else if(bi===1){
    level='watch'; verdict='On the lower end, within range';
    msg = `${state.profile.name}'s latest ${noun} (${latest.value}${unitFor(type)}) falls in the ${label} percentile range — below the middle, but still within the typical spread for babies her age.`;
  } else if(bi===2 || bi===3){
    level='good'; verdict='Right on track';
    msg = `${state.profile.name}'s latest ${noun} (${latest.value}${unitFor(type)}) falls in the ${label} percentile range — squarely in the range most babies her age fall into.`;
  } else if(bi===4){
    level='watch'; verdict='On the higher end, within range';
    msg = `${state.profile.name}'s latest ${noun} (${latest.value}${unitFor(type)}) falls in the ${label} percentile range — above the middle, but still within the typical spread for babies her age.`;
  } else {
    level='flag'; verdict='On the higher end';
    msg = `${state.profile.name}'s latest ${noun} (${latest.value}${unitFor(type)}) sits above the 97th percentile for her age. That's naturally where about 3 in 100 healthy babies fall — not alarming by itself, but worth mentioning at her next checkup if it's a new trend.`;
  }

  if(list.length>=2){
    const first = list[0];
    const fm = ageMonthsDecimal(state.profile.birthDate, first.date);
    const fbi = bandIndex(tableKey, fm, first.value);
    const shift = bi - fbi;
    if(Math.abs(shift) >= 2){
      msg += ` One thing to note: she's moved across percentile bands over your logged entries (from ${BAND_LABELS[fbi]} to ${BAND_LABELS[bi]}). A crossing trend like this is exactly the kind of thing pediatricians like to see in person, more than any single number.`;
    } else {
      msg += ` She's tracking fairly steadily along her own curve across your logged entries, which is generally the most reassuring sign in a growth chart — steady trend matters more than the exact percentile.`;
    }
  } else {
    msg += ` Log a few more ${noun} entries over time and we'll also tell you whether she's tracking steadily along her curve, which matters more than any single reading.`;
  }
  return {level, verdict, msg, label};
}

/* ---------------- SVG growth chart ---------------- */
function buildChartSVG(type, points){
  const table = WHO_GIRLS[type];
  const W = 400, H = 250, padL = 34, padR = 12, padT = 14, padB = 26;
  const maxAge = 24;
  let minV = Infinity, maxV = -Infinity;
  table.forEach(row=>{ minV=Math.min(minV,row[0]); maxV=Math.max(maxV,row[4]); });
  points.forEach(p=>{ minV=Math.min(minV,p.v); maxV=Math.max(maxV,p.v); });
  const pad = (maxV-minV)*0.08 || 1;
  minV -= pad; maxV += pad;
  const x = m => padL + (m/maxAge)*(W-padL-padR);
  const y = v => padT + (1-((v-minV)/(maxV-minV)))*(H-padT-padB);
  function pathFor(colIdx){
    return table.map((row,i)=> (i===0?'M':'L') + x(i).toFixed(1) + ',' + y(row[colIdx]).toFixed(1)).join(' ');
  }
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="overflow:visible" font-family="IBM Plex Mono, monospace">`;
  for(let g=0; g<=4; g++){
    const v = minV + (maxV-minV)*g/4; const yy = y(v);
    svg += `<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}" stroke="#EDE3F2" stroke-width="1"/>`;
    svg += `<text x="2" y="${(yy+3).toFixed(1)}" font-size="9" fill="#8B7E93">${v.toFixed(1)}</text>`;
  }
  [0,6,12,18,24].forEach(m=>{
    svg += `<text x="${x(m).toFixed(1)}" y="${H-8}" font-size="9" fill="#8B7E93" text-anchor="middle">${m}mo</text>`;
  });
  const topPath = table.map((row,i)=> (i===0?'M':'L') + x(i).toFixed(1) + ',' + y(row[4]).toFixed(1)).join(' ');
  const botPath = table.slice().reverse().map((row,i)=> 'L' + x(24-i).toFixed(1) + ',' + y(row[0]).toFixed(1)).join(' ');
  svg += `<path d="${topPath} ${botPath} Z" fill="#B79FD1" opacity="0.08"/>`;
  [0,1,2,3,4].forEach((colIdx)=>{
    const dash = colIdx===2 ? '' : 'stroke-dasharray="3,3"';
    const w = colIdx===2 ? 2.5 : 1;
    svg += `<path d="${pathFor(colIdx)}" fill="none" stroke="${PCT_COLORS[colIdx]}" stroke-width="${w}" ${dash}/>`;
  });
  if(points.length){
    const dPath = points.map((p,i)=> (i===0?'M':'L') + x(p.m).toFixed(1) + ',' + y(p.v).toFixed(1)).join(' ');
    svg += `<path d="${dPath}" fill="none" stroke="#EC9384" stroke-width="2.5"/>`;
    points.forEach(p=>{
      svg += `<circle cx="${x(p.m).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="4.5" fill="#EC9384" stroke="#fff" stroke-width="2"/>`;
    });
  }
  svg += `</svg>`;
  return svg;
}

function renderMain(){
  const main = document.getElementById('main');
  if(currentView==='home') { main.innerHTML = renderHome(); bindHome(); }
  else if(currentView==='add') { main.innerHTML = renderAdd(); bindAdd(); }
  else if(currentView==='growth') { main.innerHTML = renderGrowth(); bindGrowth(); }
  else if(currentView==='care') { main.innerHTML = renderCare(); bindCare(); }
  else if(currentView==='health') { main.innerHTML = renderHealth(); bindHealth(); }
  else if(currentView==='milestones') { main.innerHTML = renderMilestones(); bindMilestones(); }
}
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function latestOf(type){ const list = state.measurements.filter(m=>m.type===type).sort((a,b)=>new Date(b.date)-new Date(a.date)); return list[0]; }
function labelType(t){ return t==='weight'?'Weight':t==='length'?'Length':'Head circ.'; }
function unitFor(t){ return t==='weight'?' kg':' cm'; }
function bandLabelFor(type, entry){
  if(!entry) return '';
  const m = ageMonthsDecimal(state.profile.birthDate, entry.date);
  return BAND_LABELS[bandIndex(type, m, entry.value)];
}

/* ---------------- Home ---------------- */
function renderHome(){
  const w = latestOf('weight'), l = latestOf('length'), h = latestOf('hc');

    if(!entry) return `<div class="stat"><span class="val">—</span><span class="lbl">${label}</span></div>`;
    return `<div class="stat"><span class="val">${entry.value}${unit}</span><span class="lbl">${label}</span><span class="pct">${bandLabelFor(type, entry)}</span></div>`;
  };
  const nar = growthNarrative('weight');
  const recentMs = state.measurements.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,4);
  const recentMile = state.milestones.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,2);

  return `
    <div class="hero">

      ${nar ? `

          <div class="head"><span class="badge ${nar.level}">${nar.verdict}</span></div>

      <h2>🗓️ Coming up</h2>

      <h2>📝 Recent entries</h2>
      ${recentMs.length ? recentMs.map(m=>`
        <div class="row-item"><div><div class="main">${labelType(m.type)}: ${m.value}${unitFor(m.type)}</div><div class="sub">${fmtDate(m.date)}${m.note?' · '+escapeHtml(m.note):''}</div></div></div>`).join('')
        : `<div class="empty">No measurements yet — tap Add to log the first one 🌱</div>`}
    </div>

      <h2>⭐ Recent moments</h2>
      ${recentMile.length ? recentMile.map(m=>`<div class="row-item"><div><div class="main">${escapeHtml(m.title)}</div><div class="sub">${fmtDate(m.date)}</div></div></div>`).join('')
        : `<div class="empty">No milestones logged yet.</div>`}
    </div>
  `;
}

        </div>`).join('')}
    </div>` : ''}
  `;
}
function bindHealth(){
  document.getElementById('loadDefaults').addEventListener('click', async ()=>{
    const existing = new Set(state.vaccines.map(v=>v.name));
    const additions = DEFAULT_VACCINES.filter(v=>!existing.has(v.name)).map(v=>({id:uid(), name:v.name, dueMonths:v.dueMonths, givenDate:null}));
    state.vaccines = state.vaccines.concat(additions);
    await saveKey('vaccines', state.vaccines);
    toast('Starter schedule added'); renderMain();
  });
  document.getElementById('saveVac').addEventListener('click', async ()=>{
    const name = document.getElementById('vacName').value.trim();
    const due = parseFloat(document.getElementById('vacDue').value);
    const given = document.getElementById('vacGiven').value;
    if(!name){ toast('Enter a vaccine name'); return; }
    state.vaccines.push({id:uid(), name, dueMonths: isNaN(due)?0:due, givenDate: given ? new Date(given).toISOString() : null});
    await saveKey('vaccines', state.vaccines);
    toast('Vaccine added 💉'); renderMain();
  });
  document.querySelectorAll('[data-mark]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const v = state.vaccines.find(x=>x.id===b.dataset.mark);
      if(v){ v.givenDate = new Date().toISOString(); await saveKey('vaccines', state.vaccines); toast('Marked as given ✓'); renderMain(); }
    });
  });
  document.getElementById('saveAppt').addEventListener('click', async ()=>{
    const title = document.getElementById('apptTitle').value.trim();
    const date = document.getElementById('apptDate').value;
    const note = document.getElementById('apptNote').value.trim();
    if(!title || !date){ toast('Enter a title and date'); return; }
    state.appointments.push({id:uid(), title, date:new Date(date).toISOString(), note});
    await saveKey('appointments', state.appointments);
    toast('Appointment saved 🗓️'); renderMain();
  });
  bindDeletes();
}

/* ---------------- Milestones ---------------- */
function renderMilestones(){
  const list = state.milestones.slice().sort((a,b)=>new Date(b.date)-new Date(a.date));
  return `
    <div class="hero"><h1>Moments ⭐</h1><p>First smiles, rolls, and everything worth remembering.</p></div>
    <div class="card">
      <h2>Add a moment</h2>
      <label>What happened</label>
      <input type="text" id="mileTitle" placeholder="e.g. First smile">
      <label>Date</label>
      <input type="date" id="mileDate" value="${new Date().toISOString().slice(0,10)}">
      <label>Note (optional)</label>
      <textarea id="mileNote" rows="2" placeholder="Any detail worth keeping"></textarea>
      <button class="btn" id="saveMile">Save moment</button>
    </div>
    <div class="card">
      <h2>Timeline</h2>
      ${list.length ? list.map(m=>`
        <div class="row-item">
          <div><div class="main">${escapeHtml(m.title)}</div><div class="sub">${fmtDate(m.date)}${m.note?' · '+escapeHtml(m.note):''}</div></div>
          <button class="del" data-id="${m.id}" data-kind="milestone">Delete</button>
        </div>`).join('') : `<div class="empty">Nothing logged yet.</div>`}
    </div>
  `;
}
function bindMilestones(){
  document.getElementById('saveMile').addEventListener('click', async ()=>{
    const title = document.getElementById('mileTitle').value.trim();
    const date = document.getElementById('mileDate').value;
    const note = document.getElementById('mileNote').value.trim();
    if(!title || !date){ toast('Enter a title and date'); return; }
    state.milestones.push({id:uid(), title, date:new Date(date).toISOString(), note});
    await saveKey('milestones', state.milestones);
    toast('Moment saved ⭐'); renderMain();
  });
  bindDeletes();
}

function bindDeletes(){
  document.querySelectorAll('button.del').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const id=b.dataset.id, kind=b.dataset.kind;
      if(kind==='measurement'){ state.measurements = state.measurements.filter(x=>x.id!==id); await saveKey('measurements', state.measurements); }
      if(kind==='feed'){ state.feeds = state.feeds.filter(x=>x.id!==id); await saveKey('feeds', state.feeds); }
      if(kind==='sleep'){ state.sleeps = state.sleeps.filter(x=>x.id!==id); await saveKey('sleep', state.sleeps); }
      if(kind==='milestone'){ state.milestones = state.milestones.filter(x=>x.id!==id); await saveKey('milestones', state.milestones); }
      if(kind==='vaccine'){ state.vaccines = state.vaccines.filter(x=>x.id!==id); await saveKey('vaccines', state.vaccines); }
      if(kind==='appointment'){ state.appointments = state.appointments.filter(x=>x.id!==id); await saveKey('appointments', state.appointments); }
      toast('Deleted'); renderMain();
    });
  });
}

/* ---------------- Onboarding ---------------- */
function renderOnboard(){
  return `
    <div class="onboard">
      <div class="mark">🌷🍼🌙</div>
      <h1>Let's set up her growth log!</h1>
      <p class="sub">This stays synced between both of your phones. Add her details to get started.</p>
      <label>Baby's name</label>
      <input type="text" id="obName" placeholder="e.g. Amara">
      <label>Date of birth</label>
      <input type="date" id="obDob" value="${new Date().toISOString().slice(0,10)}">
      <button class="btn" id="obSave">Start tracking 🌱</button>
      <p class="note">Growth percentiles use WHO standards for girls. Data syncs automatically across every device that opens this app — no login needed. Anyone with the link can view and add entries, so only share it with people you trust with her data.</p>
    </div>
  `;
}
function bindOnboard(){
  document.getElementById('obSave').addEventListener('click', async ()=>{
    const name = document.getElementById('obName').value.trim();
    const dob = document.getElementById('obDob').value;
    if(!name || !dob){ alert('Please enter a name and date of birth.'); return; }
    state.profile = {name, sex:'female', birthDate:new Date(dob).toISOString()};
    await saveKey('profile', state.profile);
    render();
  });
}

/* ---------------- Boot ---------------- */
async function boot(){
  try{
    const remote = await firestoreGet();
    if(remote){ applyRemote(remote); lastSnapshotJSON = JSON.stringify(remote); }
    else { lastSnapshotJSON = JSON.stringify(buildPayload()); }
  }catch(e){
    console.error(e);
    toast('Could not connect — check your internet connection');
  }
  render();
  startPolling();
}
boot();
</script>
</body>
