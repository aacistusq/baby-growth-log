    body: `Averaging ${recentAvg.toFixed(1)} feeds/day over the last ${recent.length} days, compared with ${priorAvg.toFixed(1)}/day over the previous ${prior.length} comparable days.`,
    importance: Math.min(85, 40+Math.abs(diff)*8),
    evidence: { current: recent.map(b=>({label:b.dayKey, value:String(b.babyFeedCount)})), comparison: prior.map(b=>({label:b.dayKey, value:String(b.babyFeedCount)})) }
  });
}
/* --- Consistency: wet nappies steady across recent well-logged days --- */
function insightConsistencyNappy(){
  const keys = daysAgoKeys(10);
  const buckets = buildNappyWeek(keys).filter(b=>b.hasData);
  if(buckets.length<4) return null;
  const last4 = buckets.slice(-4);
  const vals = last4.map(b=>b.wetOut);
  const min=Math.min(...vals), max=Math.max(...vals);
  if(max-min>2 || min<2) return null;
  return mkInsight({
    id:'consistency-nappy-wet', type:'consistency', domain:'nappy',
    title:'Wet nappies have been steady',
    body:`Wet-containing nappies were between ${min} and ${max} on each of the last ${last4.length} completed well-logged days.`,
    importance: 28,
    evidence: { current: last4.map(b=>({label:b.dayKey, value:String(b.wetOut)})) }
  });
}
/* --- Rhythm: does her longest sleep tend to start around the same time? --- */
function insightRhythmSleepTiming(){
  const keys = daysAgoKeys(10);
  const starts = [];
  keys.forEach(dayKey=>{
    const daysSleeps = state.sleeps.filter(s=> sydDateKey(s.date)===dayKey);
    if(!daysSleeps.length) return;
    const longest = daysSleeps.reduce((mx,s)=> (s.mins||0)>(mx?mx.mins:0) ? s : mx, null);
    if(longest && longest.mins>=60) starts.push({dayKey, date:longest.date});
  });
  if(starts.length<5) return null;
  const recent5 = starts.slice(-5);
  const minsFrom6pm = recent5.map(x=>{
    const p = sydDateParts(x.date);
    let total = parseInt(p.hour,10)*60+parseInt(p.minute,10) - 18*60;
    if(total<0) total += 24*60;
    return total;
  });
  const sorted = minsFrom6pm.slice().sort((a,b)=>a-b);
  const median = sorted[Math.floor(sorted.length/2)];
  const within = minsFrom6pm.filter(v=>Math.abs(v-median)<=75);
  if(within.length < Math.ceil(recent5.length*0.7)) return null;
  const toClock = m=>{ let total=((18*60+m)%(24*60)+24*60)%(24*60); const h=Math.floor(total/60), mm=total%60; const ap=h>=12?'pm':'am'; let hh=h%12; if(hh===0)hh=12; return `${hh}:${String(mm).padStart(2,'0')}${ap}`; };
  return mkInsight({
    id:'rhythm-sleep-timing', type:'rhythm', domain:'sleep',
    title:'Longest sleep usually begins around the same time',
    body:`Across the last ${recent5.length} comparable days, her longest sleep period began between ${toClock(Math.min(...within))} and ${toClock(Math.max(...within))} on ${within.length} of those days.`,
    importance: 33,
    evidence: { current: recent5.map(x=>({label:x.dayKey, value:fmtTime(x.date)})) }
  });
}
/* --- Pattern: do evening feeds cluster closer together than the rest of the day? --- */
function insightPatternEveningFeeds(){
  const keys = daysAgoKeys(8);
  let eveningGaps=[], dayGaps=[], daysWithEnough=0;
  keys.forEach(dayKey=>{
    const feeds = state.feeds.map(normalizeFeed).filter(f=>f.type!=='pumping' && sydDateKey(f.date)===dayKey).sort((a,b)=>new Date(a.date)-new Date(b.date));
    if(feeds.length<3) return;
    const evening = feeds.filter(f=>{ const h=parseInt(sydDateParts(f.date).hour,10); return h>=18&&h<22; });
    if(evening.length>=2) daysWithEnough++;
    for(let i=1;i<feeds.length;i++){
      const gap=(new Date(feeds[i].date)-new Date(feeds[i-1].date))/60000;
      const h=parseInt(sydDateParts(feeds[i].date).hour,10);
      if(h>=18&&h<22) eveningGaps.push(gap); else dayGaps.push(gap);
    }
  });
  if(daysWithEnough<5 || eveningGaps.length<5 || dayGaps.length<5) return null;
  const avgEvening = eveningGaps.reduce((a,b)=>a+b,0)/eveningGaps.length;
  const avgDay = dayGaps.reduce((a,b)=>a+b,0)/dayGaps.length;
  if(avgDay-avgEvening<20) return null;
  return mkInsight({
    id:'pattern-evening-feed', type:'pattern', domain:'feed',
    title:'Evening feeds cluster together',
    body:`On ${daysWithEnough} sufficiently logged days, feeds between 6–10pm were typically ${fmtDuration(avgEvening)} apart, compared with ${fmtDuration(avgDay)} during the rest of the day.`,
    importance: 42,
    evidence: { current: [{label:'Evening avg gap', value:fmtDuration(avgEvening)}, {label:'Rest-of-day avg gap', value:fmtDuration(avgDay)}] }
  });
}
/* --- Relationship: does a longer sleep tend to follow the last evening feed? Observed association only. --- */
function insightRelationshipFeedSleep(){
  const keys = daysAgoKeys(8);
  let matches=0, total=0, gaps=[];
  keys.forEach(dayKey=>{
    const feeds = state.feeds.map(normalizeFeed).filter(f=>f.type!=='pumping' && sydDateKey(f.date)===dayKey);
    const evening = feeds.filter(f=>{ const h=parseInt(sydDateParts(f.date).hour,10); return h>=17; }).sort((a,b)=>new Date(a.date)-new Date(b.date));
    if(!evening.length) return;
    const lastFeedTime = new Date(evening[evening.length-1].date).getTime();
    const candidates = state.sleeps.filter(s=> (s.mins||0)>=90 && new Date(s.date).getTime()>lastFeedTime && new Date(s.date).getTime()<lastFeedTime+4*3600000);
    if(!candidates.length) return;
    total++;
    const sleep = candidates.sort((a,b)=>new Date(a.date)-new Date(b.date))[0];
    const gapMin = (new Date(sleep.date).getTime()-lastFeedTime)/60000;
    if(gapMin>=15 && gapMin<=70){ matches++; gaps.push(gapMin); }
  });
  if(total<5 || matches<4) return null;
  return mkInsight({
    id:'relationship-feed-sleep', type:'relationship', domain:'cross',
    title:'Possible feed/sleep pattern',
    body:`On ${matches} of the last ${total} sufficiently logged evenings, her first longer sleep stretch followed the final evening feed within roughly ${Math.round(Math.min(...gaps))}–${Math.round(Math.max(...gaps))} minutes. This is an observed association only — it doesn't mean the feed causes the longer sleep.`,
    importance: 48,
    evidence: { current: gaps.map((g,i)=>({label:`Evening ${i+1}`, value:Math.round(g)+' min later'})) }
  });
}
/* --- Milestone: a genuine new personal record, surfaced only when recent and rare --- */
function insightMilestoneSleep(){
  const sorted = state.sleeps.slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
  if(sorted.length<6) return null;
  const last = sorted[sorted.length-1];
  if((Date.now()-new Date(last.date).getTime()) > 26*3600000) return null;
  const priorMax = sorted.slice(0,-1).reduce((mx,s)=>Math.max(mx,s.mins||0),0);
  if(priorMax<=0 || (last.mins||0)<=priorMax) return null;
  return mkInsight({
    id:'milestone-sleep-longest', type:'milestone', domain:'sleep',
    title:'Longest sleep yet',
    body:`${fmtDuration(last.mins)} — her previous longest recorded sleep was ${fmtDuration(priorMax)}.`,
    importance: 58,
    evidence: { current:[{label:'New longest', value:fmtDuration(last.mins)}], comparison:[{label:'Previous longest', value:fmtDuration(priorMax)}] }
  });
}

/* Runs every generator, keeps only real candidates, ranks by importance,
   returns the top 2–4. Falls back to an explicit "nothing's changed" rather
   than manufacturing something to fill the space. */
function generateSmartInsights(){
  const candidates = [
    insightChangeSleepStretch(), insightChangeFeedFrequency(), insightConsistencyNappy(),

}

/* ---------------- Personal baseline ("what's normal for THIS baby") ---------------- */
function percentileOf(sortedArr, p){
  if(!sortedArr.length) return null;
  const idx = (p/100)*(sortedArr.length-1);
  const lo = Math.floor(idx), hi = Math.ceil(idx);
  if(lo===hi) return sortedArr[lo];
  return sortedArr[lo] + (sortedArr[hi]-sortedArr[lo])*(idx-lo);
}
function meanOf(arr){ return arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : null; }
const MIN_BASELINE_DAYS = 3;
/* Builds a rolling personal baseline from the last `days` calendar days (excluding
   today, since today is still in progress). Days with no logging at all are excluded
   so a missed-logging day doesn't skew the range toward zero. */
function baselineStats(days){
  days = days || 7;
  const daily = [];
  for(let i=1;i<=days;i++){
    const d = new Date(); d.setDate(d.getDate()-i);
    daily.push(dailySummary(d));
  }
  const active = daily.filter(d=> d.feedCount>0 || d.nappies.changeCount>0 || d.totalSleepMin>0);
  if(active.length < MIN_BASELINE_DAYS) return null;
  const feedCounts = active.map(d=>d.feedCount).sort((a,b)=>a-b);
  /* Nappy range must come from days nappies were actually logged — a day with
     only feeds/sleep logged shouldn't pad the "active" count toward a nappy
     range that's really based on too few real nappy days. */
  const nappyDays = active.filter(d=>d.nappies.changeCount>0);
  const wetCounts = nappyDays.map(d=>d.nappies.wet).sort((a,b)=>a-b);
  const dirtyCounts = nappyDays.map(d=>d.nappies.dirty).sort((a,b)=>a-b);
  const sleepMins = active.map(d=>d.totalSleepMin).sort((a,b)=>a-b);
  const longestSleeps = active.filter(d=>d.longestSleep>0).map(d=>d.longestSleep).sort((a,b)=>a-b);
  const intervals = active.filter(d=>d.avgIntervalMin!=null).map(d=>d.avgIntervalMin).sort((a,b)=>a-b);
  const rangeOf = arr => arr.length ? {p25:percentileOf(arr,25), p75:percentileOf(arr,75), mean:meanOf(arr)} : null;
  return {
    days: active.length,
    feeds: rangeOf(feedCounts),
    wet: nappyDays.length>=MIN_BASELINE_DAYS ? rangeOf(wetCounts) : null,
    dirty: nappyDays.length>=MIN_BASELINE_DAYS ? rangeOf(dirtyCounts) : null,

/* Finds the UTC instant for Sydney midnight on a given day-key, via fixed-point
   correction against the Intl-derived Sydney calendar (handles DST correctly
   without needing a timezone database of our own). */
function sydMidnightUTC(dayKey){
  let guess = new Date(dayKey+'T00:00:00Z').getTime();
  for(let i=0;i<3;i++){
    const p = sydDateParts(guess);
    const guessedKey = `${p.year}-${p.month}-${p.day}`;
    const dayDiff = Math.round((new Date(guessedKey+'T00:00:00Z').getTime() - new Date(dayKey+'T00:00:00Z').getTime())/86400000);
    const minuteOfDay = parseInt(p.hour,10)*60 + parseInt(p.minute,10);
    guess -= dayDiff*86400000 + minuteOfDay*60000;
  }
  return guess;
}
function sleepBounds(s){

  return {start, end};
}
/* Canonical overlap calculation — every daily/range sleep total in the app must
   route through this (or sleepMinutesOnDay below, which is this for one
   calendar day). Never assign a whole session to its start date. */
function sleepMinutesInRange(s, rangeStartMs, rangeEndMs){
  const {start, end} = sleepBounds(s);
  const overlapStart = Math.max(start.getTime(), rangeStartMs);
  const overlapEnd = Math.min(end.getTime(), rangeEndMs);
  return Math.max(0, (overlapEnd-overlapStart)/60000);
}
/* Minutes of a sleep record that actually fall within a given Sydney calendar day —
   the core piece that lets a sleep crossing midnight be split correctly across
   both days for daily totals, while the underlying record stays intact. */
function sleepMinutesOnDay(s, dayKey){
  const dayStart = sydMidnightUTC(dayKey);
  return sleepMinutesInRange(s, dayStart, dayStart+86400000);
}
/* state.sleeps plus a virtual record for any in-progress sleep, so a running

function effectiveSleepRecords(){
  const list = state.sleeps.slice();
  if(state.activeSleep){
    const elapsedMin = Math.max(0, Math.round((Date.now()-new Date(state.activeSleep.startAt).getTime())/60000));
    list.push({ id: state.activeSleep.id, date: state.activeSleep.startAt, endAt: new Date().toISOString(), mins: elapsedMin, label: inferSleepType(state.activeSleep.startAt), _active:true });
  }

}
function get7DayKeys(offsetWeeks){

  const keys = [];

function weekRangeLabel(dayKeys){

  const f1 = first.toLocaleDateString(undefined,{day:'numeric', month: sameMonth?undefined:'short', timeZone:APP_TZ});

/* --- Centralized per-metric daily aggregation. Reused by the 7-Day view, and

function buildSleepWeek(dayKeys){

  return dayKeys.map(dayKey=>{
    const overlapping = allSleeps.filter(s=> sleepMinutesOnDay(s, dayKey) > 0.5);
    const totalMin = overlapping.reduce((sum,s)=> sum+sleepMinutesOnDay(s,dayKey), 0);
    const napMin = overlapping.filter(s=>s.label==='nap').reduce((sum,s)=>sum+sleepMinutesOnDay(s,dayKey),0);
    const nightMin = overlapping.filter(s=>s.label==='night').reduce((sum,s)=>sum+sleepMinutesOnDay(s,dayKey),0);
    /* Longest STRETCH is the full uninterrupted session — never clipped to the

    const longest = overlapping.reduce((mx,s)=>Math.max(mx, s.mins||0), 0);

function buildFeedWeek(dayKeys){
  return dayKeys.map(dayKey=>{
    const feeds = state.feeds.map(normalizeFeed).filter(f=> sydDateKey(f.date)===dayKey);
    const breastfeeds = feeds.filter(f=>f.type==='breastfeeding');
    const expressed = feeds.filter(f=>f.type==='expressed');
    const formula = feeds.filter(f=>f.type==='formula');
    const pumping = feeds.filter(f=>f.type==='pumping');
    const nursingMin = breastfeeds.reduce((s,f)=>s+(f.totalMins||0),0);
    const leftMin = breastfeeds.reduce((s,f)=>s+(f.leftMins||0),0);
    const rightMin = breastfeeds.reduce((s,f)=>s+(f.rightMins||0),0);
    const times = feeds.filter(f=>f.type!=='pumping').map(f=>new Date(f.date).getTime()).sort((a,b)=>a-b);

      dayKey, babyFeedCount: breastfeeds.length+expressed.length+formula.length,
      nursingMin, breastfeedCount:breastfeeds.length, leftMin, rightMin,

      formulaCount:formula.length, formulaMl: formula.reduce((s,f)=>s+(f.consumedMl||0),0),
      pumpingCount:pumping.length, pumpMl: pumping.reduce((s,f)=>s+(f.pumpTotalMl||0),0),

}
function weekAverageExcludingToday(buckets, key, todayKey){

/* Compares this window's completed-day average against the previous 7-day window.
   Requires reasonable coverage in both windows and a meaningful (non-noise) gap. */
function compareToPreviousWeek(metric){

  else if(metric==='feed'){ curBuckets=buildFeedWeek(curKeys); prevBuckets=buildFeedWeek(prevKeys); key='babyFeedCount'; }
  else { curBuckets=buildNappyWeek(curKeys); prevBuckets=buildNappyWeek(prevKeys); key='wetOut'; }

  const prevCompleted = prevBuckets.filter(b=>b.hasData);
  if(curCompleted.length<3 || prevCompleted.length<3) return null;
  const curAvg = curCompleted.reduce((s,b)=>s+b[key],0)/curCompleted.length;
  const prevAvg = prevCompleted.reduce((s,b)=>s+b[key],0)/prevCompleted.length;
  const diff = curAvg-prevAvg;
  if(metric==='sleep'){
    if(Math.abs(diff)<20) return null;
    return `Sleep has been ${diff>0?'a little longer':'a little shorter'} this week — ${fmtDuration(curAvg)}/day vs ${fmtDuration(prevAvg)}/day the week before.`;
  }
  if(metric==='feed'){
    if(Math.abs(diff)<1.0) return null;
    return `Feeding ${diff>0?'increased':'decreased'} from ${prevAvg.toFixed(1)}/day to ${curAvg.toFixed(1)}/day vs the previous week.`;
  }

  if(range.kind==='yesterday'){ const yk=sydDateKey(now-86400000); return { startMs: sydMidnightUTC(yk), endMs: sydMidnightUTC(yk)+86400000, label:'yesterday' }; }
  if(range.kind==='lastNight'){ const yk=sydDateKey(now-86400000); return { startMs: sydMidnightUTC(yk)+18*3600000, endMs: sydMidnightUTC(sydDateKey())+12*3600000, label:'last night' }; }

  if(range.kind==='thisWeek'){ const keys=get7DayKeys(0); return { startMs: sydMidnightUTC(keys[0]), endMs: now, label:'this week' }; }
  if(range.kind==='lastWeek'){ const keys=get7DayKeys(1); return { startMs: sydMidnightUTC(keys[0]), endMs: sydMidnightUTC(keys[6])+86400000, label:'last week' }; }

function askCompareMetric(metric){

  else if(metric==='feed'){ curB=buildFeedWeek(curKeys); prevB=buildFeedWeek(prevKeys); key='babyFeedCount'; }
  else { curB=buildNappyWeek(curKeys); prevB=buildNappyWeek(prevKeys); key='wetOut'; }

  const curAvg = curC.reduce((s,b)=>s+b[key],0)/curC.length, prevAvg = prevC.reduce((s,b)=>s+b[key],0)/prevC.length;

const MONTH_NAMES_ASK = {january:0,february:1,march:2,april:3,may:4,june:5,july:6,august:7,september:8,october:9,november:10,december:11,
  jan:0,feb:1,mar:2,apr:3,jun:5,jul:6,aug:7,sep:8,sept:8,oct:9,nov:10,dec:11};
function parseAskDate(s){
  let m = s.match(/\b(\d{1,2})(?:st|nd|rd|th)?\s+(jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:t|tember)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)\b/i);
  if(!m) m = s.match(/\b(jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:t|tember)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)\s+(\d{1,2})(?:st|nd|rd|th)?\b/i);
  if(!m) return null;
  let day, monthName;
  if(/^\d/.test(m[1])){ day=parseInt(m[1],10); monthName=m[2]; } else { monthName=m[1]; day=parseInt(m[2],10); }
  const monthIdx = MONTH_NAMES_ASK[monthName.toLowerCase()];
  if(monthIdx==null || day<1 || day>31) return null;
  let year = new Date().getFullYear();
  const candidate = new Date(Date.UTC(year, monthIdx, day, 12));
  if(candidate.getTime() > Date.now()) year -= 1; // assume last year if the date hasn't happened yet this year
  return `${year}-${String(monthIdx+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
}
function detectAskRange(s){
  if(/\blast night\b|\btonight\b/.test(s)) return {kind:'lastNight'};
  if(/\byesterday\b/.test(s)) return {kind:'yesterday'};
  if(/\blast\s*24\s*hours?\b/.test(s)) return {kind:'last24h'};
  if(/\bsince (she was )?born\b|\bsince birth\b|\bever\b|\ball time\b/.test(s)) return {kind:'sinceBirth'};
  if(/\blast\s*week\b|\bprevious week\b/.test(s)) return {kind:'lastWeek'};
  if(/\bthis\s*week\b/.test(s)) return {kind:'thisWeek'};
  if(/\blast month\b/.test(s)) return {kind:'lastMonth'};
  if(/\bthis month\b/.test(s)) return {kind:'thisMonth'};
  if(/\btoday\b/.test(s)) return {kind:'today'};
  const d = parseAskDate(s);
  if(d) return {kind:'date', date:d};
  return null;
}
function detectTimeOfDay(s){
  if(/\bovernight\b/.test(s)) return 'overnight';
  if(/\bmorning\b/.test(s)) return 'morning';
  if(/\bafternoon\b/.test(s)) return 'afternoon';
  if(/\bevening\b/.test(s)) return 'evening';
  return null;
}
/* ---- Text normalization ---- */
function normalizeAskText(q){
  let s = (q||'').toLowerCase().trim();
  s = s.replace(/what's/g,'what is').replace(/how's/g,'how is').replace(/she's/g,'she is')
       .replace(/didn't/g,'did not').replace(/doesn't/g,'does not').replace(/hasn't/g,'has not')
       .replace(/isn't/g,'is not').replace(/wasn't/g,'was not').replace(/aren't/g,'are not');
  s = s.replace(/[?!.,;:]+/g,' ').replace(/-/g,' ').replace(/\s+/g,' ').trim();
  return s;
}

const ASK_FUTURE_PATTERN = /\bnext\b|\bupcoming\b|\bdue\b|\bcoming up\b|\bscheduled\b|\bplanned\b|\bwhen (do|should|will) we\b|\bproject/;
const ASK_GIVEN_PATTERN = /\balready\b|\bhas had\b|\bhad\b|\bdone\b|\bgot\b|\breceived\b|\bgiven\b|\bcompleted\b|\badministered\b/;
const ASK_PREVIOUS_PATTERN = /\bprevious\b|\bbefore that\b|\bbefore\b|\blast one\b/;
/* ---- Operation synonym maps — a weaker fallback signal, used only when
   none of the explicit high-precedence patterns above have already decided
   the operation for that domain. ---- */
const ASK_OPERATIONS = {
  latest: ['current','latest','currently','now'],
  count: ['how many','number of','count','times'],
  total: ['how much','how long','total','duration'],
  max: ['longest','most','highest','maximum'],
  min: ['shortest','least','lowest','minimum'],
  average: ['average','usually','typical','normally'],
  change: ['changed','change','gained','increased','decreased','difference'],
  compare: ['compare','more than','less than','versus',' vs ']
};
function levenshtein(a,b){
  /* Damerau-Levenshtein — counts an adjacent-letter swap ("weigth") as a
     single edit rather than two, which matches real typos far better than
     plain Levenshtein and, combined with a strict max-distance-1 threshold,
     avoids accidental collisions between unrelated words (e.g. "nappies"
     no longer fuzzy-matches "napped" — that needs 2 edits either way). */
  const m=a.length, n=b.length;
  if(!m) return n; if(!n) return m;
  const dp = [];
  for(let i=0;i<=m;i++) dp.push(new Array(n+1).fill(0));
  for(let i=0;i<=m;i++) dp[i][0]=i;
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      const cost = a[i-1]===b[j-1] ? 0 : 1;
      dp[i][j] = Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1]+cost);
      if(i>1 && j>1 && a[i-1]===b[j-2] && a[i-2]===b[j-1]) dp[i][j] = Math.min(dp[i][j], dp[i-2][j-2]+cost);
    }
  }
  return dp[m][n];
}
/* Deliberately strict — one edit, and only for words of real length — so
   genuine typos ("weigth","slepp","napies","feedng") are caught without
   short or common words accidentally colliding with an unrelated domain. */
function fuzzyWordMatch(word, target){
  if(word===target) return true;
  if(target.length<5 || Math.abs(word.length-target.length)>1) return false;
  return levenshtein(word,target)<=1;
}
/* Simple English plural stripping — short domain words ("shot","wet") were
   only ever listed singular, so a plural like "shots"/"wets" fell through
   both exact and fuzzy matching (fuzzy is deliberately disabled below
   5 characters to avoid false positives). Checked ahead of fuzzy matching. */
function stripTrailingS(w){ return w.length>3 && w.endsWith('s') && !w.endsWith('ss') ? w.slice(0,-1) : w; }
function scoreDomains(norm){
  const tokens = norm.split(' ').filter(Boolean);
  const scores = {};
  Object.entries(ASK_DOMAINS).forEach(([domain, words])=>{
    let score = 0;
    words.forEach(w=>{
      if(w.includes(' ')){ if(norm.includes(w)) score += 3; return; }
      if(tokens.some(t=> t===w || stripTrailingS(t)===w || fuzzyWordMatch(t,w))) score += 2;
    });
    if(score>0) scores[domain]=score;
  });
  return scores;
}
function scoreOperations(norm){
  const scores = {};
  Object.entries(ASK_OPERATIONS).forEach(([op, words])=>{
    let score = 0;
    words.forEach(w=>{ if(norm.includes(w)) score += w.includes(' ')?3:2; });
    if(score>0) scores[op]=score;
  });
  return scores;
}
function detectNappySubtype(norm){
  if(/\bpoo\b|\bpoop|\bstool\b|\bdirty\b|\bbowel\b|\bbm\b/.test(norm)) return 'dirty';
  if(/\bwet\b|\bwee\b|\bpee\b|\burine\b/.test(norm)) return 'wet';
  return null;
}
function extractVaccineNameHint(norm){
  if(/\bhep\s*b\b|\bhepatitis b\b/.test(norm)) return 'hepatitis b';
  const names = [...new Set(state.vaccines.map(v=>v.name.toLowerCase()))];
  for(const name of names){
    const words = name.split(/\s+/).filter(w=>w.length>3);
    if(words.some(w=>norm.includes(w))) return name;
  }
  return null;
}
const ASK_DOMAIN_LABELS = {weight:'Weight', length:'Length', hc:'Head circumference', sleep:'Sleep', feed:'Feeds', nappy:'Nappies', growth:'Growth', temperature:'Temperature', vaccine:'Vaccines', appointment:'Appointments', health:'Health', moments:'Moments'};
/* Maps a resolved (domain, operation, range) triple onto the same intent
   shapes the executors already understand — this is the single seam between
   "understanding the question" and "running the deterministic query", so
   nothing about how an answer is calculated changes based on how the
   question was phrased. */
/* Precedence-ordered per domain: an explicit, specific signal (a duration
   unit, "next", "already had") always wins over a generic operation word or
   the domain's bare-question default — never the other way around. Each
   domain resolver is read top-to-bottom as its own priority list. */
function buildIntentFromDomainOp(domain, operation, range, norm){
  norm = norm || '';

  if(domain==='weight'||domain==='length'||domain==='hc'){
    if(domain==='weight' && ASK_FUTURE_PATTERN.test(norm)) return {type:'nextWeighIn'};
    if(/\bsince birth\b|\bfrom birth\b|\bgained\b|\bgain\b|\bhow much.*(gained|since)\b|\bchang/.test(norm) || operation==='change') return {type:'growthChange', measure:domain};
    if(range && range.kind==='date') return {type:'measurementOnDate', measure:domain, date:range.date};
    if(ASK_PREVIOUS_PATTERN.test(norm)) return {type:'previousMeasurement', measure:domain};
    return {type:'lastEvent', metric:'measurement', subtype:domain};
  }
  if(domain==='growth'){
    if(/\bpercentile\b/.test(norm) && !/\bchang|\bgain|\bsince birth\b/.test(norm)) return {type:'lastEvent', metric:'measurement', subtype:'weight'};
    return {type:'growthChange', measure:'weight'};
  }

  if(domain==='sleep'){
    if(/\b(is she |still )?(sleeping|asleep)\b/.test(norm) && /\bnow\b|\bcurrently\b|\bstill\b/.test(norm)) return {type:'lastEvent', metric:'sleep'};
    if(ASK_DURATION_PATTERN.test(norm)) return {type:'totalInRange', metric:'sleep', range: range||{kind:'today'}};
    if(/\blongest\b/.test(norm)) return {type:'maxInRange', metric:'sleep', range: range||{kind:'thisWeek'}};
    if(/\bshortest\b/.test(norm)) return {type:'minInRange', metric:'sleep', range: range||{kind:'thisWeek'}};
    if(/\bhow many\b/.test(norm) && /\bnaps?\b|\bsleeps\b|\bsessions?\b|\btimes\b/.test(norm)) return {type:'countInRange', metric:'sleep', range: range||{kind:'today'}};
    if(/^when\b/.test(norm)){
      const startOrEnd = /\bgo to sleep\b|\bfell asleep\b|\bfall asleep\b|\bwent to sleep\b/.test(norm) ? 'start' : 'end';
      return {type:'lastEvent', metric:'sleep', startOrEnd};
    }
    if(!range && !operation) return {type:'sleepOverview'};
    return {type:'totalInRange', metric:'sleep', range: range||{kind:'today'}};
  }

  if(domain==='feed'){
    if(/\bwhich breast\b|\bwhich side\b/.test(norm)) return {type:'breastSide', mode:'last'};
    if(/\bbreast\b/.test(norm) && /\bleft\b/.test(norm) && /\bright\b/.test(norm)){
      const wantsCompare = range || /\bmore\b|\bless\b|\bmost\b/.test(norm);
      return {type:'breastSide', mode: wantsCompare?'compare':'last', range: range||{kind:'thisWeek'}};
    }
    if(ASK_DURATION_PATTERN.test(norm) && /\bnurs|\bbreastfe/.test(norm)) return {type:'totalInRange', metric:'feed', range: range||{kind:'today'}};
    if(/\bhow long since\b|\bsince (her |the )?last feed\b|\btime since\b/.test(norm)) return {type:'lastEvent', metric:'feed'};
    if(/^when\b|\blast feed\b/.test(norm)) return {type:'lastEvent', metric:'feed'};
    if(/\bwhich day\b/.test(norm)) return {type:'bestDay', metric:'feed'};
    if(ASK_DURATION_PATTERN.test(norm)) return {type:'totalInRange', metric:'feed', range: range||{kind:'today'}};
    if(!range && !operation && !/\bhow many\b/.test(norm)) return {type:'feedOverview'};
    const subtype = /\bbreastfeed|\bnurs/.test(norm) ? 'breastfeeding' : /\bformula\b/.test(norm) ? 'formula' : null;
    return {type:'countInRange', metric:'feed', range: range||{kind:'today'}, subtype};
  }

  if(domain==='nappy'){
    const subtype = detectNappySubtype(norm);
    if(/^when\b|\bhas she\b|\blast\b/.test(norm)) return {type:'lastEvent', metric:'nappy', subtype};
    if(/\bwhich day\b/.test(norm)) return {type:'bestDay', metric:'nappy'};
    if(!range && !subtype && !/\bhow many\b/.test(norm)) return {type:'nappyOverview'};
    return {type:'countInRange', metric:'nappy', subtype, range: range||{kind:'today'}};
  }

  if(domain==='temperature') return {type:'lastEvent', metric:'temperature'};

  if(domain==='vaccine'){
    const nameHint = extractVaccineNameHint(norm);
    if(nameHint && /^when\b|\bdid she (get|have)\b|\bwas she given\b/.test(norm)) return {type:'lastEvent', metric:'vaccine', nameHint};
    /* "Already had / done / received / given" is checked before "next /
       upcoming / due" — completion language is the more explicit, more
       specific signal, and must never be read as a request for what's next. */
    if(ASK_GIVEN_PATTERN.test(norm)) return {type:'listGiven', metric:'vaccine'};
    if(ASK_FUTURE_PATTERN.test(norm)) return {type:'nextEvent', metric:'vaccine'};
    if(nameHint) return {type:'lastEvent', metric:'vaccine', nameHint};
    return {type:'vaccineOverview'};
  }

  if(domain==='appointment'){
    if(ASK_GIVEN_PATTERN.test(norm) || /^when did\b|\blast appointment\b/.test(norm)) return {type:'lastEvent', metric:'appointment'};
    return {type:'nextEvent', metric:'appointment'};
  }

  if(domain==='moments') return {type:'lastEvent', metric:'moment'};
  if(domain==='health') return {type:'healthOverview'};
  if(domain==='tummytime'){
    if(operation==='max' || /\blongest\b/.test(norm)) return {type:'tummyStats', sub:'longest', range: range||{kind:'today'}};
    if(operation==='count' || /\bhow many\b/.test(norm) && /\bsessions?\b/.test(norm)) return {type:'tummyStats', sub:'count', range: range||{kind:'today'}};
    if(operation==='latest' || /^when\b|\blast\b/.test(norm)) return {type:'tummyStats', sub:'latest', range: range||{kind:'today'}};
    return {type:'tummyStats', sub:'total', range: range||{kind:'today'}};
  }
  return {type:'unknown'};
}
/* Fully local, deterministic intent classifier — no network call, no model in
   the loop at all. Normalizes the question, scores it against domain and
   operation synonym maps (with light fuzzy matching for typos), extracts
   time context, and combines those signals into one of the app's fixed
   intent shapes. Falls back to a genuine clarification prompt only when a
   quantity is clearly being asked about but the topic itself is ambiguous —
   never a silent guess. Retains one turn of conversational context so a
   short follow-up like "and today?" can build on the previous question. */
let askLastDomain = null, askLastOperation = null;
function classifyAskIntentLocal(question){
  const norm = normalizeAskText(question);
  if(!norm) return {type:'unknown'};

  if(/\bcompar\w*\b.*\bweek\b/.test(norm) || (/\bthis week\b/.test(norm) && /\blast week\b/.test(norm))){
    askLastDomain=null; askLastOperation=null;
    return {type:'weekCompare'};
  }

  if(/\beverything\b|\bwhat happened\b/.test(norm)){
    const d = parseAskDate(norm);
    if(d) return {type:'dayShowAll', date:d};
  }

  const range = detectAskRange(norm);

  /* "Which breast" / "left vs right" questions don't necessarily contain any
     word from the feed synonym list, so they're handled explicitly rather
     than relying on domain scoring to find them. */
  if(/\bwhich (breast|side)\b/.test(norm)) return {type:'breastSide', mode:'last'};
  if(/\bmilestones?\b.*\brecorded\b|\bwhat milestones\b|\bwhich milestones\b/.test(norm)) return {type:'milestonesRecorded'};
  if(/\bwhen did we first\b|\bwhen was her first\b|\bfirst record/.test(norm)) return {type:'milestoneNamed', norm};
  if(/\bactivit(y|ies)\b|\bwhat (can|could) we try\b|\bplay idea/.test(norm)) return {type:'activitiesToday'};
  if(/\bleft\b/.test(norm) && /\bright\b/.test(norm)){
    const wantsCompare = range || /\bmore\b|\bless\b|\bmost\b/.test(norm);
    return {type:'breastSide', mode: wantsCompare?'compare':'last', range: range||{kind:'thisWeek'}};
  }

  /* A specific vaccine name mentioned by itself ("when did she get Hep B?")
     may not contain any generic vaccine keyword at all, so name matching is
     checked before falling back to keyword-based domain scoring. */
  const vaccineNameHint = extractVaccineNameHint(norm);
  if(vaccineNameHint && (/^when\b|\bdid she (get|have)\b|\bwas she given\b/.test(norm))){
    return {type:'lastEvent', metric:'vaccine', nameHint:vaccineNameHint};
  }

  const opScores = scoreOperations(norm);
  const opEntries = Object.entries(opScores).sort((a,b)=>b[1]-a[1]);
  const operation = opEntries.length ? opEntries[0][0] : null;

  // conversational follow-up: "and today?", "what about yesterday?", "and before that?",
  // "before that", "previous one", "and next" — reuses the remembered topic, and since the
  // domain resolvers above read directly from this follow-up's own wording, a phrase like
  // "before that" or "next" naturally resolves to the right operation for that topic.
  const isFollowUp = /^(and|what about)\b/.test(norm) || /\bbefore that\b|\bprevious one\b/.test(norm);
  if(isFollowUp && askLastDomain){
    return buildIntentFromDomainOp(askLastDomain, operation||askLastOperation, range, norm);
  }

  const domainScores = scoreDomains(norm);
  const domainEntries = Object.entries(domainScores).sort((a,b)=>b[1]-a[1]);

  if(!domainEntries.length){
    // No topic recognised at all. "Next"/"upcoming" style words with no
    // named topic ("Her next one?") resolve using the remembered topic if a
    // conversation is already underway; otherwise a genuine clarification
    // beats a silent guess.
    if(ASK_FUTURE_PATTERN.test(norm)){
      if(askLastDomain) return buildIntentFromDomainOp(askLastDomain, operation, range, norm);
      return {type:'clarify', options:['weight','vaccine','appointment'], operation, range};
    }
    if(operation==='total') return {type:'clarify', options: (range && range.kind==='sinceBirth') ? ['weight','sleep','feed'] : ['sleep','feed'], operation, range};
    if(operation==='count') return {type:'clarify', options:['feed','nappy'], operation, range};
    if(operation==='latest') return {type:'clarify', options:['weight','sleep','feed'], operation, range};
    return {type:'unknown'};
  }

  const topScore = domainEntries[0][1];
  const topDomains = domainEntries.filter(([,sc])=>sc===topScore).map(([d])=>d);
  if(topDomains.length>1){
    return {type:'clarify', options: topDomains.slice(0,4), operation, range};
  }

  const domain = topDomains[0];
  askLastDomain = domain; askLastOperation = operation;
  return buildIntentFromDomainOp(domain, operation, range, norm);
}
const ASK_EXAMPLES = [
  'How much sleep today?',
  'Last poo?',
  "Her latest weight?",
  'Compare feeds this week vs last week',
  'When is her next appointment?'
];
let askQuestion = '', askAnswer = null, askEvidence = null, askEvidenceExpanded = false, askError = null;
let askHistory = [];
let askClarify = null; // {options, operation, range, norm}
function handleAskSubmit(question){
  question = (question||'').trim();
  if(!question) return;
  askError = null; askAnswer = null; askEvidence = null; askEvidenceExpanded = false; askClarify = null;
  if(looksLikeMedicalQuestion(question)){
    const r = executeUnanswerable();
    askAnswer=r.answer; askEvidence=r.evidence;
    askHistory.unshift({q:question, a:r.answer});
    renderMain();
    return;
  }
  try{
    const intentRaw = classifyAskIntentLocal(question);
    if(intentRaw && intentRaw.type==='clarify'){
      intentRaw.norm = normalizeAskText(question);
      askClarify = intentRaw;
      renderMain();
      return;
    }
    const intent = (intentRaw && ASK_KNOWN_TYPES.includes(intentRaw.type)) ? intentRaw : {type:'unknown'};
    const r = executeAskIntent(intent);
    askAnswer=r.answer; askEvidence=r.evidence;
    askHistory.unshift({q:question, a:r.answer});
  }catch(e){
    console.error('Ask Keshavi failed', e);
    askError="Something went wrong answering that — try rephrasing the question.";
  }
  renderMain();
}
function resolveAskClarify(domain){
  if(!askClarify) return;
  const {operation, range, norm} = askClarify;
  askClarify = null;
  try{
    const intent = buildIntentFromDomainOp(domain, operation, range, norm||'');
    askLastDomain = domain; askLastOperation = operation;
    const r = executeAskIntent(intent);
    askAnswer=r.answer; askEvidence=r.evidence;
    askHistory.unshift({q:`(${ASK_DOMAIN_LABELS[domain]||domain})`, a:r.answer});
  }catch(e){
    console.error('Ask Keshavi clarify failed', e);
    askError="Something went wrong answering that — try rephrasing the question.";
  }
  renderMain();
}

      ${ASK_EXAMPLES.map(q=>`<button class="chip due" data-askexample="${escapeHtml(q)}" style="text-transform:none;cursor:pointer;border:none;">${escapeHtml(q)}</button>`).join('')}

    ${askError ? `<div class="note" style="background:var(--status-critical-bg);color:var(--status-critical-fg);border-radius:var(--radius-control);padding:12px 14px;margin-top:16px;">${escapeHtml(askError)}</div>` : ''}

    <div class="card" style="margin-top:16px;">
      <div class="support-text" style="margin-top:0;font-size:14px;">What would you like to check?</div>

    ${askHistory.length>1 ? `

    ` : ''}

    <div class="note" style="margin-top:20px;margin-bottom:60px;">Answers are generated only from her logged records — nothing is estimated or diagnosed. This can't assess medical concerns; check with your GP or child health nurse for those.</div>
  `;
}
function bindAskView(){
  const input = document.getElementById('askInput');
  const submitBtn = document.getElementById('askSubmitBtn');
  const submit = ()=>{ if(input) handleAskSubmit(input.value); };
  if(submitBtn) submitBtn.addEventListener('click', submit);
  if(input){
    input.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); submit(); } });
    input.addEventListener('input', ()=>{ askQuestion = input.value; });
  }
  document.querySelectorAll('[data-askexample]').forEach(b=>{
    b.addEventListener('click', ()=> handleAskSubmit(b.dataset.askexample));
  });
  document.querySelectorAll('[data-askclarify]').forEach(b=>{
    b.addEventListener('click', ()=> resolveAskClarify(b.dataset.askclarify));
  });
  document.querySelectorAll('[data-askrerun]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const idx = parseInt(b.dataset.askrerun,10);
      const h = askHistory[idx];
      if(h) handleAskSubmit(h.q);
    });
  });
  const evToggle = document.getElementById('askEvidenceToggle');
  if(evToggle) evToggle.addEventListener('click', ()=>{ askEvidenceExpanded=!askEvidenceExpanded; renderMain(); });
}
function sleepBaselineNote(avgMin){
  if(avgMin==null || weekOffset!==0) return null;
  const b = baselineStats(7);
  if(!b || !b.sleepMin) return null;
  const lo=Math.round(b.sleepMin.p25), hi=Math.round(b.sleepMin.p75);
  if(avgMin < lo-15) return `A little less than her recent typical range (${fmtDuration(lo)}–${fmtDuration(hi)}/day).`;
  if(avgMin > hi+15) return `A little more than her recent typical range (${fmtDuration(lo)}–${fmtDuration(hi)}/day).`;
  return `Consistent with her recent pattern (typically ${fmtDuration(lo)}–${fmtDuration(hi)}/day).`;
}
function feedBaselineNote(avgFeeds){
  if(avgFeeds==null || weekOffset!==0) return null;
  const b = baselineStats(7);
  if(!b || !b.feeds) return null;
  const lo=Math.round(b.feeds.p25), hi=Math.round(b.feeds.p75);
  if(avgFeeds < lo-1) return `Fewer feeds than her recent typical range (${lo}–${hi}/day).`;
  if(avgFeeds > hi+1) return `More frequent than her recent typical range (${lo}–${hi}/day).`;
  return `Consistent with her recent pattern (typically ${lo}–${hi} feeds/day).`;
}
function nappyBaselineNote(avgWet){
  if(avgWet==null || weekOffset!==0) return null;
  const b = baselineStats(7);
  if(!b || !b.wet) return null;
  const lo=Math.round(b.wet.p25), hi=Math.round(b.wet.p75);

  return `Consistent with her recent pattern (typically ${lo}–${hi} wet nappies/day).`;
}
/* Interactive 7-bar chart. Pass segmentsFn for a stacked bar (nappies); omit it
   for a simple single-value bar (sleep/feeding). Every column — even empty
   ones — gets a full-height transparent tap target so short bars stay tappable. */
function buildBarChartSVG(buckets, dayKeys, todayKey, valueFn, opts){
  opts = opts || {};
  const W=340,H=140,padL=6,padR=6,padT=10,padB=22,barGap=6;
  const barW = (W-padL-padR-barGap*6)/7;
  const dark = isDarkMode();
  const values = buckets.map(b=> b.hasData ? valueFn(b) : 0);
  const maxV = Math.max(1, ...values);
  const labels = weekDayLabels(dayKeys, todayKey);
  const barColor = opts.barColor || (dark?'#F2A796':'#EC9384');
  const noDataColor = dark ? '#3D3544' : '#EDE3F2';
  const labelColor = dark ? '#EDE8F0' : '#332C3A';
  const textColor = dark ? '#83788F' : '#918B98';
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="overflow:visible" font-family="Nunito, sans-serif" role="img" aria-label="7 day chart, tap a bar for details">`;
  buckets.forEach((b,i)=>{
    const x = padL + i*(barW+barGap);
    const isToday = b.dayKey===todayKey;
    const isActive = opts.activeIdx===i;
    if(!b.hasData){
      svg += `<rect x="${x.toFixed(1)}" y="${(H-padB-3).toFixed(1)}" width="${barW.toFixed(1)}" height="3" rx="1.5" fill="${noDataColor}"/>`;
    } else if(opts.groupedFn){
      /* Side-by-side sub-bars sharing one baseline and one scale — used when
         two categories legitimately overlap (e.g. wet vs dirty nappies) and
         must never be stacked as if they summed to a single total. */
      const grouped = opts.groupedFn(b);
      const gGap = 2;
      const subW = (barW - gGap*(grouped.length-1)) / grouped.length;
      grouped.forEach((g,gi)=>{
        const gh = maxV>0 ? Math.max(g.value>0?3:0, (g.value/maxV)*(H-padT-padB)) : 0;
        const gx = x + gi*(subW+gGap);
        const gy = H-padB-gh;
        svg += `<rect x="${gx.toFixed(1)}" y="${gy.toFixed(1)}" width="${subW.toFixed(1)}" height="${gh.toFixed(1)}" rx="3" fill="${g.color}" opacity="${isActive||isToday?1:0.75}"/>`;
      });
    } else {
      const v = values[i];
      const hgt = Math.max(3, (v/maxV)*(H-padT-padB));
      const y = H-padB-hgt;
      const segs = opts.segmentsFn ? opts.segmentsFn(b) : null;
      if(segs){
        let cursor = H-padB;
        segs.forEach(seg=>{
          const segH = maxV>0 ? (seg.value/maxV)*(H-padT-padB) : 0;
          if(segH>0.3){ cursor -= segH; svg += `<rect x="${x.toFixed(1)}" y="${cursor.toFixed(1)}" width="${barW.toFixed(1)}" height="${segH.toFixed(1)}" rx="3" fill="${seg.color}" opacity="${isActive||isToday?1:0.75}"/>`; }
        });
      } else {
        svg += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${hgt.toFixed(1)}" rx="4" fill="${barColor}" opacity="${isActive?1:(isToday?0.9:0.6)}"/>`;
      }
    }
    if(isActive) svg += `<rect x="${(x-1.5).toFixed(1)}" y="${(padT-2).toFixed(1)}" width="${(barW+3).toFixed(1)}" height="${(H-padB-padT+2+1.5).toFixed(1)}" rx="5" fill="none" stroke="${barColor}" stroke-width="1.5" opacity="0.6"/>`;
    svg += `<rect data-idx="${i}" class="week-bar-tap" x="${x.toFixed(1)}" y="0" width="${barW.toFixed(1)}" height="${H-padB}" fill="transparent" style="cursor:pointer;"/>`;
    svg += `<text x="${(x+barW/2).toFixed(1)}" y="${H-6}" font-size="9" fill="${isToday?labelColor:textColor}" text-anchor="middle" font-weight="${isToday?800:600}">${labels[i]}</text>`;
  });
  svg += `</svg>`;
  return svg;
}

/* ---------------- Export / Share health summary ---------------- */
let exportRangeKey = '7d';
let exportCustomStart = null, exportCustomEnd = null;
function computeExportRange(){
  const now = new Date();
  if(exportRangeKey==='24h') return {start:new Date(now-86400000), end:now};
  if(exportRangeKey==='7d') return {start:new Date(now-7*86400000), end:now};
  if(exportRangeKey==='birth') return {start:new Date(state.profile.birthDate), end:now};
  if(exportRangeKey==='custom' && exportCustomStart && exportCustomEnd) return {start:new Date(exportCustomStart), end:new Date(exportCustomEnd+'T23:59:59')};
  return {start:new Date(now-7*86400000), end:now};
}
function compileHealthSummary(start, end){
  const inRange = d => { const t=new Date(d).getTime(); return t>=start.getTime() && t<=end.getTime(); };
  const p = state.profile;
  const corrected = correctedAgeInfo();
  const weightList = state.measurements.filter(m=>m.type==='weight').sort((a,b)=>new Date(a.date)-new Date(b.date));
  const birthWeight = weightList[0];
  const latestWeight = weightList[weightList.length-1];
  const measurementsInRange = state.measurements.filter(m=>inRange(m.date)).sort((a,b)=>new Date(a.date)-new Date(b.date));
  const feedsInRange = state.feeds.map(normalizeFeed).filter(f=>inRange(f.date));
  /* Sleep uses the same range-overlap logic as everywhere else — a session
     merely needs to overlap [start,end] to contribute its in-range minutes;
     "longest stretch" still reflects each overlapping session's full duration. */
  const sleepsOverlapping = effectiveSleepRecords().filter(s=> sleepMinutesInRange(s, start.getTime(), end.getTime()) > 0.5);
  const nappiesInRange = state.nappies.filter(n=>inRange(n.date));
  const tempsInRange = state.temperatures.filter(t=>inRange(t.date));
  const healthInRange = state.healthRecords.filter(r=>inRange(r.date));
  const vaccinesGiven = state.vaccines.filter(v=>v.givenDate).sort((a,b)=>new Date(a.givenDate)-new Date(b.givenDate));
  const vaccinesUpcoming = state.vaccines.filter(v=>!v.givenDate && !v.notApplicable && !v.hidden).sort((a,b)=>a.dueMonths-b.dueMonths);
  const apptsInRange = state.appointments.filter(a=>inRange(a.date));
  const apptsUpcoming = state.appointments.filter(a=>(a.status||'upcoming')==='upcoming' && new Date(a.date)>=new Date()).sort((a,b)=>new Date(a.date)-new Date(b.date));

  const days = Math.max(1, (end-start)/86400000);
  const breastfeeds = feedsInRange.filter(f=>f.type==='breastfeeding');
  const totalNursingMin = breastfeeds.reduce((s,f)=>s+(f.totalMins||0),0);
  const formulaMl = feedsInRange.filter(f=>f.type==='formula').reduce((s,f)=>s+(f.consumedMl||0),0);
  const expressedMl = feedsInRange.filter(f=>f.type==='expressed').reduce((s,f)=>s+(f.consumedMl||0),0);
  const pumpingMl = feedsInRange.filter(f=>f.type==='pumping').reduce((s,f)=>s+(f.pumpTotalMl||0),0);
  const totalSleepMin = sleepsOverlapping.reduce((s,x)=> s+sleepMinutesInRange(x, start.getTime(), end.getTime()), 0);
  const longestSleep = sleepsOverlapping.reduce((mx,x)=>Math.max(mx,x.mins||0),0);
  const nappyStatsRange = computeNappyStats(nappiesInRange);
  const wetCount = nappyStatsRange.wet, dirtyCount = nappyStatsRange.dirty;

  return { p, corrected, birthWeight, latestWeight, measurementsInRange, feedsInRange, feedsPerDay: feedsInRange.length/days,
    totalNursingMin, formulaMl, expressedMl, pumpingMl, totalSleepMin, sleepPeriods: sleepsOverlapping.length, longestSleep,
    avgSleepPerDay: totalSleepMin/days, wetCount, dirtyCount, wetPerDay: wetCount/days, dirtyPerDay: dirtyCount/days,
    tempsInRange, healthInRange, vaccinesGiven, vaccinesUpcoming, apptsInRange, apptsUpcoming, start, end };
}

/* ---------------- Backup & Restore (data helpers — UI lives in Settings) ---------------- */
function buildBackupObject(){
  return { backupVersion: 1, createdAt: new Date().toISOString(), appData: buildPayload() };
}
function downloadBackupFile(){
  const backup = buildBackupObject();
  const json = JSON.stringify(backup, null, 2);
  const blob = new Blob([json], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateStr = todayDateInput();
  const nameSlug = (state.profile.name||'baby').toLowerCase().replace(/[^a-z0-9]+/g,'-');
  a.href = url;
  a.download = `${nameSlug}-growth-log-backup-${dateStr}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function validateBackup(parsed){
  if(!parsed || typeof parsed!=='object') return {ok:false, error:"This doesn't appear to be a valid Baby Tracker backup."};
  if(typeof parsed.backupVersion !== 'number') return {ok:false, error:"This doesn't appear to be a valid Baby Tracker backup."};
  if(parsed.backupVersion > 1) return {ok:false, error:"This backup was created by a newer app version and can't be restored here yet."};
  if(!parsed.appData || typeof parsed.appData !== 'object') return {ok:false, error:"The backup file appears to be damaged."};
  if(!parsed.appData.profile || !parsed.appData.profile.name || !parsed.appData.profile.birthDate) return {ok:false, error:"The backup file appears to be damaged."};
  return {ok:true};
}

/* ---------------- Moments (photo gallery, grouped by age) ---------------- */
function readAndCompressImage(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>h){ if(w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; } }
        else { if(h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function ageAtDate(birthISO, atISO){
  const birth = new Date(birthISO), at = new Date(atISO);
  let ms = at-birth; if(ms<0) ms=0;
  const days = Math.floor(ms/86400000);
  const weeks = Math.floor(days/7), remDays = days%7;
  const months = (at.getFullYear()-birth.getFullYear())*12 + (at.getMonth()-birth.getMonth()) - (at.getDate()<birth.getDate()?1:0);
  return { weeks, remDays, months: Math.max(0,months) };
}
function momentAgeLabel(dateISO){
  const a = ageAtDate(state.profile.birthDate, dateISO);
  return a.weeks<12 ? `${a.weeks}w ${a.remDays}d old` : `${a.months} mo old`;
}
function momentMonthLabel(n){ return n===0 ? 'Newborn' : n===1 ? '1 month' : `${n} months`; }
function momentChapterKey(dateISO){
  const a = ageAtDate(state.profile.birthDate, dateISO);
  if(a.weeks<=1) return 'birth';
  if(a.months===0) return 'newborn';
  return 'm'+a.months;
}
function momentChapterLabel(key){
  if(key==='birth') return 'Birth & first days';
  if(key==='newborn') return 'Newborn';
  const n = parseInt(key.slice(1),10);
  return n===1 ? '1 month' : `${n} months`;
}
/* Canonical moment shape — old single-photo records (just `photo`) are
   normalized on read into the same `photos[]` array shape new records use,
   so nothing has to special-case legacy data. */
function normalizeMoment(m){
  if(m.photos) return m;
  const photos = m.photo ? [{ id:m.id+'-p0', thumb:m.photo, full:m.photo, focalY:50, legacy:true }] : [];
  return { ...m, photos, kind: m.kind||'moment' };
}
/* New photos get both a small thumbnail (grid/list use) and a larger display
   image (full-screen + photo book). This roughly doubles storage per photo
   versus the old single-640px approach — a deliberate quality trade-off for
   print/full-screen use, still base64-in-Firestore. True print resolution at
   scale needs Firebase Storage instead of inline documents; that's a bigger
   infrastructure change this pass doesn't attempt. */
async function processMomentPhotoFile(file){
  const [thumb, full] = await Promise.all([
    readAndCompressImage(file, 480, 0.62),
    readAndCompressImage(file, 1280, 0.74)
  ]);
  return { id: uid(), thumb, full, focalY:50 };
}
function momentCoverPhoto(m){
  const nm = normalizeMoment(m);
  if(!nm.photos.length) return null;
  return nm.photos.find(p=>p.id===nm.primaryPhotoId) || nm.photos[0];
}
function isLowResPhoto(p){ return !!p.legacy; }

function newPhotoBookDraft(rangeKind){
  const now = new Date();
  const birth = state.profile.birthDate;
  let start, end, subtitle;
  if(rangeKind==='firstMonth'){ start=birth; end=new Date(new Date(birth).getTime()+31*86400000).toISOString(); subtitle='Her First Month'; }
  else if(rangeKind==='firstYear'){ start=birth; end=new Date(new Date(birth).getTime()+366*86400000).toISOString(); subtitle='Her First Year'; }
  else { start=birth; end=now.toISOString(); subtitle='A Memory Book'; }
  return {
    id: uid(), title: state.profile.name, subtitle,
    range: { kind: rangeKind, start, end },
    theme: 'classic', coverMomentId: null,
    excludedIds: [], captions: {},
    createdAt: now.toISOString(), updatedAt: now.toISOString()
  };
}
function photoBookEligibleMoments(book){
  const startMs = new Date(book.range.start).getTime(), endMs = new Date(book.range.end).getTime();
  return state.milestones.filter(m=>{
    const t = new Date(m.date).getTime();
    if(t<startMs || t>endMs) return false;
    if(book.excludedIds.includes(m.id)) return false;
    if(m.kind==='letter') return true;
    return m.includeInBook!==false;
  }).sort((a,b)=>new Date(a.date)-new Date(b.date));
}
function weightNearAge(months){
  const list = state.measurements.filter(m=>m.type==='weight')
    .sort((a,b)=>Math.abs(ageMonthsDecimal(state.profile.birthDate,a.date)-months) - Math.abs(ageMonthsDecimal(state.profile.birthDate,b.date)-months));
  return list[0]||null;
}

/* Book pages are plain HTML styled for print — "Export PDF" uses the
   browser's native print-to-PDF, the same honest approach already used for
   the health summary export, rather than pretending to generate a PDF
   client-side without a real print engine. */
function renderPhotoBookPages(book){
  const eligible = photoBookEligibleMoments(book);
  const groups = {}; const order = [];
  eligible.forEach(m=>{ const k=momentChapterKey(m.date); if(!groups[k]){groups[k]=[];order.push(k);} groups[k].push(m); });
  const coverMoment = book.coverMomentId ? state.milestones.find(x=>x.id===book.coverMomentId) : eligible.find(m=>m.kind!=='letter');
  const coverPhoto = coverMoment ? momentCoverPhoto(coverMoment) : null;

  let html = `
    <div class="book-page book-cover-page">
      ${coverPhoto ? `<img src="${coverPhoto.full||coverPhoto.thumb}" class="book-cover-img" style="object-position:center ${coverPhoto.focalY!=null?coverPhoto.focalY:50}%;">` : ''}
      <div class="book-cover-text">
        <div class="book-cover-title">${escapeHtml(book.title)}</div>
        <div class="book-cover-subtitle">${escapeHtml(book.subtitle)}</div>
        <div class="book-cover-dates">${fmtDate(book.range.start)} – ${fmtDate(book.range.end)}</div>
      </div>
    </div>`;

  if(!eligible.length){
    html += `<div class="book-page"><div class="book-chapter-title">No moments in this range yet</div></div>`;
    return html;
  }

  order.forEach(key=>{
    html += `<div class="book-page book-chapter-page"><div class="book-chapter-title">${momentChapterLabel(key)}</div></div>`;
    if(key.startsWith('m')){
      const months = parseInt(key.slice(1),10);
      const w = weightNearAge(months);
      const favMoment = groups[key].find(m=>m.kind!=='letter' && m.favourite) || groups[key].find(m=>m.kind!=='letter');
      if(w || favMoment){
        html += `<div class="book-page book-summary-page">
          <div class="book-summary-title">${momentChapterLabel(key)}</div>
          ${w?`<div class="book-summary-line">Weight around this time · ${w.value} kg</div>`:''}
          ${favMoment?`<div class="book-summary-line">Favourite memory · ${escapeHtml(favMoment.title)}</div>`:''}
        </div>`;
      }
    }
    groups[key].forEach(m=>{
      if(m.kind==='letter'){
        html += `<div class="book-page book-letter-page">
          <div class="book-letter-heading">From ${escapeHtml(m.author||'a parent')} · ${momentAgeLabel(m.date)}</div>
          <div class="book-letter-text">${escapeHtml(m.note||'').split(String.fromCharCode(10)).filter(Boolean).map(l=>`<p>${l}</p>`).join('')}</div>
        </div>`;
        return;
      }
      const nm = normalizeMoment(m);
      const cap = book.captions[m.id] || m.note || '';
      const big = m.favourite || m.pinned || nm.photos.length>1;
      if(big){
        html += `<div class="book-page book-moment-page-full">
          <div class="book-photo-grid">${nm.photos.slice(0,4).map(p=>`<img src="${p.full||p.thumb}" class="book-photo" style="object-position:center ${p.focalY!=null?p.focalY:50}%;">`).join('')}</div>
          <div class="book-moment-caption">
            <div class="book-moment-title">${escapeHtml(m.title)}</div>
            <div class="book-moment-meta">${fmtDate(m.date)} · ${momentAgeLabel(m.date)}</div>
            ${cap?`<div class="book-moment-note">${escapeHtml(cap)}</div>`:''}
          </div>
        </div>`;
      } else {
        html += `<div class="book-page book-moment-page-small">
          ${nm.photos[0]?`<img src="${nm.photos[0].full||nm.photos[0].thumb}" class="book-photo-small" style="object-position:center ${nm.photos[0].focalY!=null?nm.photos[0].focalY:50}%;">`:''}
          <div class="book-moment-title-small">${escapeHtml(m.title)}</div>
          <div class="book-moment-meta">${fmtDate(m.date)} · ${momentAgeLabel(m.date)}</div>
          ${cap?`<div class="book-moment-note-small">${escapeHtml(cap)}</div>`:''}
        </div>`;
      }
    });
  });
  return html;
}
function renderPhotoBookPreview(){
  const book = state.photoBooks.find(b=>b.id===currentPhotoBookId);
  if(!book) return `<div class="empty">This book was removed.</div>`;
  return `
    <div class="hero no-print">${backButton('Edit book')}<h1>Preview</h1><p>Scroll to review, then export.</p></div>
    <button class="btn no-print" id="pbExportBtn" style="margin-bottom:16px;">Export / Print PDF</button>
    <div class="book-preview-scale" data-book-theme="${book.theme}">
      ${renderPhotoBookPages(book)}
    </div>
  `;
}
function bindPhotoBookPreview(){
  const exportBtn = document.getElementById('pbExportBtn');
  if(exportBtn) exportBtn.addEventListener('click', ()=> window.print());
}

let momentsSearchQuery = '';
function computeMomentPrompts(){
  const prompts = [];
  const todayKey = sydDateKey();
  const ageToday = ageAtDate(state.profile.birthDate, new Date().toISOString());
  const bday = new Date(state.profile.birthDate);
  const isMonthBirthday = ageToday.months>0 && bday.getDate()===new Date().getDate();
  const todaysMoments = state.milestones.filter(m=> (m.kind||'moment')==='moment' && sydDateKey(m.date)===todayKey);
  if(isMonthBirthday && !todaysMoments.length){
    prompts.push({ text:`${escapeHtml(state.profile.name)} is ${ageToday.months} month${ageToday.months===1?'':'s'} old today`, cta:'Capture a moment' });
  } else if(todaysMoments.length>=3){
    prompts.push({ text:`${todaysMoments.length} moments were added today`, cta:'Add a note about today' });
  }
  return prompts.slice(0,1);
}
function renderMilestones(){
  const all = state.milestones.slice().sort((a,b)=>new Date(b.date)-new Date(a.date));
  const q = momentsSearchQuery.trim().toLowerCase();
  if(q){
    const matches = all.filter(m=> (m.title||'').toLowerCase().includes(q) || (m.note||'').toLowerCase().includes(q) || (m.people||[]).some(p=>p.toLowerCase().includes(q)));
    return `
      <div class="hero" style="display:flex;align-items:baseline;justify-content:space-between;">
        <div><h1>Moments</h1><p>A private journal of everything worth remembering.</p></div>
      </div>
      ${renderMomentsToolbar()}
      <div class="section-header">${matches.length} result${matches.length===1?'':'s'}</div>
      ${matches.length ? `<div class="gallery-grid">${matches.map(renderMomentGalleryCard).join('')}</div>` : `<div class="empty">No moments match "${escapeHtml(momentsSearchQuery)}".</div>`}
    `;
  }

  const moments = all.filter(m=>(m.kind||'moment')==='moment');
  const letters = all.filter(m=>m.kind==='letter');
  const hero = moments.find(m=>m.pinned) || moments.find(m=>m.favourite) || moments[0] || null;
  const rest = all.filter(m=>m.id!==(hero&&hero.id));

  const groups = {}; const order = [];
  rest.forEach(m=>{
    const key = momentChapterKey(m.date);
    if(!groups[key]){ groups[key]={photos:[], letters:[]}; order.push(key); }
    if(m.kind==='letter') groups[key].letters.push(m); else groups[key].photos.push(m);
  });

  const prompts = computeMomentPrompts();

  return `
    <div class="hero" style="display:flex;align-items:baseline;justify-content:space-between;">
      <div><h1>Moments</h1><p>A private journal of everything worth remembering.</p></div>
    </div>
    ${renderMomentsToolbar()}
    ${prompts.map(p=>`
      <div class="row-item" data-momentprompt="1" style="cursor:pointer;">
        <div class="main" style="font-weight:600;">${p.text}</div>
        <div class="meta-text" style="color:var(--lavender-deep);font-weight:700;">${p.cta} →</div>
      </div>`).join('')}
    ${(moments.length || letters.length) ? `<button class="ql-link" id="goPhotoBookLink" style="padding:10px 0 14px;">📖 Create photo book →</button>` : ''}

    ${hero ? renderMomentHeroCard(hero) : `<div class="empty">No moments saved yet.<br>Capture your first memory 🌱</div>`}

    ${order.map(key=>`
      <div style="margin-bottom:6px;" id="chapter-${key}">
        <div class="section-header" style="margin-top:16px;">${momentChapterLabel(key)}</div>
        ${groups[key].letters.map(renderLetterCard).join('')}
        ${groups[key].photos.length ? `<div class="gallery-grid">${groups[key].photos.map(renderMomentGalleryCard).join('')}</div>` : ''}
      </div>`).join('')}
  `;
}
function renderMomentsToolbar(){
  const chapters = [...new Set(state.milestones.map(m=>momentChapterKey(m.date)))];
  return `
    <div style="display:flex;gap:8px;margin-bottom:8px;">
      <input type="text" id="momentSearchInput" placeholder="Search moments…" value="${escapeHtml(momentsSearchQuery)}" style="flex:1;">
      ${chapters.length>1 ? `<select id="momentJumpSelect" style="width:auto;flex:0 0 auto;"><option value="">Jump to…</option>${chapters.map(k=>`<option value="${k}">${momentChapterLabel(k)}</option>`).join('')}</select>` : ''}
    </div>
    <button class="ql-link" id="addMomentLink" style="padding:0 0 14px;">+ Add moment</button>
    <button class="ql-link" id="addLetterLink" style="padding:0 0 14px;margin-left:14px;">💌 Write a letter</button>
  `;
}
function renderMomentHeroCard(featured){
  const cover = momentCoverPhoto(featured);
  const extraCount = normalizeMoment(featured).photos.length - 1;
  return `
    <div data-viewmoment="${featured.id}" style="position:relative;border-radius:var(--radius-major);overflow:hidden;margin-bottom:22px;background:var(--surface-muted);box-shadow:var(--shadow-2);cursor:pointer;">
      ${featured.pinned ? `<div style="position:absolute;top:12px;left:12px;z-index:2;font-size:11px;font-weight:800;color:#fff;background:rgba(0,0,0,0.4);padding:3px 9px;border-radius:99px;">📌 Featured</div>` : ''}
      ${featured.favourite ? `<div style="position:absolute;top:12px;right:12px;z-index:2;font-size:18px;">⭐</div>` : ''}
      ${cover ? `<img src="${cover.thumb}" style="width:100%;height:280px;object-fit:cover;object-position:center ${cover.focalY!=null?cover.focalY:50}%;display:block;">` : `<div style="width:100%;height:170px;display:flex;align-items:center;justify-content:center;font-size:46px;">⭐</div>`}
      <div style="padding:16px 18px 18px;">
        <div style="font-family:'Baloo 2',cursive;font-size:21px;font-weight:700;color:var(--ink);">${escapeHtml(featured.title)}</div>
        <div class="meta-text" style="margin-top:4px;font-size:12px;">${fmtDateFull(featured.date)} · ${momentAgeLabel(featured.date)}${extraCount>0?` · +${extraCount} more photo${extraCount===1?'':'s'}`:''}</div>
        ${featured.note ? `<div class="support-text" style="margin-top:8px;">${escapeHtml(featured.note)}</div>` : ''}
      </div>
    </div>`;
}
function renderMomentGalleryCard(m){
  const cover = momentCoverPhoto(m);
  const photoCount = normalizeMoment(m).photos.length;
  return `
    <div class="gallery-card" data-viewmoment="${m.id}" style="cursor:pointer;position:relative;">
      ${m.favourite ? `<div style="position:absolute;top:6px;right:6px;z-index:2;font-size:13px;">⭐</div>` : ''}
      ${photoCount>1 ? `<div style="position:absolute;top:6px;left:6px;z-index:2;font-size:9.5px;font-weight:800;color:#fff;background:rgba(0,0,0,0.4);padding:2px 6px;border-radius:99px;">${photoCount}</div>` : ''}
      ${cover ? `<img src="${cover.thumb}" alt="" style="object-position:center ${cover.focalY!=null?cover.focalY:50}%;">` : `<div class="ph">⭐</div>`}
      <div class="cap">
        <div class="t">${escapeHtml(m.title)}</div>
        <div class="s">${fmtDate(m.date)} · ${momentAgeLabel(m.date)}</div>
      </div>
    </div>`;
}
function renderLetterCard(m){
  return `
    <div class="card" data-viewmoment="${m.id}" style="cursor:pointer;margin-bottom:12px;">
      <div style="display:flex;align-items:center;gap:8px;">
        <span style="font-size:18px;">💌</span>
        <div style="font-weight:800;font-size:13.5px;">From ${escapeHtml(m.author||'a parent')} · ${momentAgeLabel(m.date)}</div>
      </div>
      <div class="support-text" style="margin-top:6px;font-style:italic;">${escapeHtml((m.note||'').slice(0,140))}${(m.note||'').length>140?'…':''}</div>
    </div>`;
}
function bindMilestones(){
  const addLink = document.getElementById('addMomentLink');
  if(addLink) addLink.addEventListener('click', ()=> openSheet('moment'));
  const addLetterLink = document.getElementById('addLetterLink');
  if(addLetterLink) addLetterLink.addEventListener('click', ()=> openSheet('letter'));
  document.querySelectorAll('[data-viewmoment]').forEach(el=>{
    el.addEventListener('click', ()=> openMomentViewer(el.dataset.viewmoment));
  });
  const searchInput = document.getElementById('momentSearchInput');
  if(searchInput){
    searchInput.addEventListener('input', ()=>{ momentsSearchQuery = searchInput.value; renderMain(); });
  }
  const jumpSelect = document.getElementById('momentJumpSelect');
  if(jumpSelect) jumpSelect.addEventListener('change', ()=>{
    const el = document.getElementById('chapter-'+jumpSelect.value);
    if(el) el.scrollIntoView({behavior:'smooth', block:'start'});

  document.querySelectorAll('[data-momentprompt]').forEach(el=>{
    el.addEventListener('click', ()=> openSheet('moment'));
  });
  const gpbl = document.getElementById('goPhotoBookLink');
  if(gpbl) gpbl.addEventListener('click', ()=> navigateTo('photobook'));
}

const DELETE_MAP = {
  measurement: {arr:'measurements', key:'measurements'},
  feed: {arr:'feeds', key:'feeds'},
  sleep: {arr:'sleeps', key:'sleep'},
  milestone: {arr:'milestones', key:'milestones'},
  vaccine: {arr:'vaccines', key:'vaccines'},

  nappy: {arr:'nappies', key:'nappies'},

};

  document.querySelectorAll('button.del, button.del-x').forEach(b=>{
    b.addEventListener('click', (e)=>{
      e.stopPropagation();
      const id=b.dataset.id, kind=b.dataset.kind;

      <div class="mark">🌷🍼🌙</div>

/* ---------------- Boot ---------------- */
function resolveTheme(){
  const pref = state.prefs && state.prefs.theme;
  if(pref==='light' || pref==='dark') return pref;
  return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
}
function applyTheme(){
  document.documentElement.setAttribute('data-theme', resolveTheme());
}
function isDarkMode(){ return document.documentElement.getAttribute('data-theme')==='dark'; }
if(window.matchMedia){
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{
    if(!(state.prefs && (state.prefs.theme==='light' || state.prefs.theme==='dark'))){
      applyTheme();
      if(document.getElementById('main')) renderMain();
    }
  });
}
let bootStallTimer = null;
function boot(){
  applyTheme();
  authReady = false; authUser = null; initialDataLoaded = false;
  const app = document.getElementById('app');
  app.innerHTML = renderLoadingScreen();

  clearTimeout(bootStallTimer);
  bootStallTimer = setTimeout(()=>{
    if(!authReady){
      app.innerHTML = renderStartupError("This is taking longer than expected — Firebase may not have responded.");
      bindStartupError();
    }
  }, 9000);

  try{
    initFirebase();
  }catch(e){
    console.error('Firebase init failed', e);
    clearTimeout(bootStallTimer);
    app.innerHTML = renderStartupError(e.message || 'Could not start Firebase.');
    bindStartupError();
    return;
  }

  try{
    fbAuth.onAuthStateChanged(user=>{
      clearTimeout(bootStallTimer);
      authReady = true;
      authUser = user;
      if(user){
        initialDataLoaded = false;
        dataLoadError = null;
        render(); /* loading while first snapshot arrives */
        startRealtimeSync();
      } else {
        stopRealtimeSync();
        initialDataLoaded = false;
        dataLoadError = null;
        applyRemote({}); /* clear in-memory data on sign-out */
        render(); /* login screen */
      }
    }, e=>{
      console.error('Auth state error', e);
      clearTimeout(bootStallTimer);
      app.innerHTML = renderStartupError(friendlyAuthError(e));
      bindStartupError();
    });
  }catch(e){
    console.error('onAuthStateChanged threw', e);
    clearTimeout(bootStallTimer);
    app.innerHTML = renderStartupError(e.message || 'Could not check sign-in status.');
    bindStartupError();
  }
}
function bindStartupError(){
  const btn = document.getElementById('retryBootBtn');
  if(btn) btn.addEventListener('click', ()=> location.reload());
}
boot();
</script>
